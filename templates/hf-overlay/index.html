<!doctype html>
<!-- 路线 B 的第二步：画面是 render_frames.mjs 接好的 scene.mp4，这里只叠歌词、配歌。
     出片后同样跑 scripts/finalize_audio.py 把原曲按原音量封回去。DURATION 和三处 data-duration（#root、video、audio）改成歌长。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lyrics.js"></script>
    <script src="lyrics-layer.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080" data-fps="30">
      <video id="scene" src="scene.mp4" muted playsinline data-start="0" data-duration="60" data-media-start="0" data-track-index="1"></video>
      <audio id="song" src="song.mp3" data-start="0" data-duration="60" data-media-start="0" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const DURATION = 60;
      LYRIC_LAYER.mount(document.getElementById("root"));
      const proxy = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(proxy, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => LYRIC_LAYER.render(proxy.t) }, 0);
      window.addEventListener("hf-seek", (e) => LYRIC_LAYER.render(e.detail.time));
      LYRIC_LAYER.render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
