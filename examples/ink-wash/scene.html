<!doctype html>
<!--
  中国水墨（写意 / ink wash）· 晨雾江上：渔翁戴斗笠撑一叶小舟穿过芦苇，竹篙拍上点水惊起白鹭，墨在水里晕开、落成层层远山，白鹭飞成天上的一笔。
  示范场景只为展示画法，做 MV 时场景、角色、构图从你的歌来。6 秒，BPM 72，两个镜头，中间一次「墨在水里晕开」的转场。

  关键画法（Canvas 2D，纸、笔、洇都自己写，不靠画图库；页面用 ../../templates/mv/kit.js 的 MV.page）：
  1. 分层：每个镜头拆成几层缓存好的墨（对岸、远水、中景芦苇、近水、近景芦苇；远山四层、近岸），按视差跟着镜头走：
     画面 x = 世界 x + p × V × (t − ref)。所有墨先画进一张透明的「墨层」，最后 multiply 叠到纸上，纸纹从墨底下透出来。
     纸不跟镜头动：镜头移的是纸上的墨（GIF 也因此小：纸白的地方每张都一样）。
  2. 纸：开页面造一张宣纸（makePaper）：几千根弯曲的纤维 + 两层云絮状的明暗 + 细颗粒，同时留一张「纤维图」FW，洇墨时查它。
  3. 笔（brush）：一笔 = 中线 + 粗细曲线；起笔藏锋（先细、顿一下鼓起来），收笔出锋或回锋。笔头横切成 3–40 束笔毛：先按并集铺一层，
     每束再补一点墨（笔触里一丝丝深浅），侧锋时一边饱一边淡；干笔时每束沿笔路按自己的噪声断开，越往笔尾越干 → 飞白。
     种子是「这一笔的名字 + 第几束毛」，同一笔每一张的飞白断口都在同一处。
  4. 洇（wetten）：画完的一团墨逐像素洇一次：墨化开一点，水线顺着纤维乱一点，线内补一层淡墨，最外沿一道浅水渍；朱色往边上积一圈（pool）。
  5. 颜色：墨分五色只靠浓度（焦 .95、浓 .8、重 .6、淡 .3、清 .1）。只有墨 #181516 和一个朱 #C22A18：全片只有初升的太阳是朱，
     两个镜头里是同一个太阳、同一个位置，慢慢往上升，下半截被一缕雾擦淡。
  6. 物件：芦苇的叶子每片一笔撇出去（藏锋起、越走越细、出锋收尖，有的半路折一下），茎一笔，芦花几下干的淡墨；风按 9 档弯，用到哪档才画、洇、缓存。
     渔翁：斗笠一片淡墨加两笔浓墨斜面、一笔帽檐、顶上焦墨一点；蓑衣是一把从肩往下撒开的干笔（飞白就是蓑草）；脸藏在斗笠底下，不画五官。
     竹篙从人身后过，画到人这里断开一截（画家的避让），握篙的手在蓑衣外头。小舟：侧锋一笔淡墨拖出船帮，浓墨一笔船舷，倒影几笔断开的淡墨。
     水：大片留白，只扫几笔横的淡墨、清墨。白鹭：身子是纸白（在墨层上按身形挖掉），淡墨细线勾、留断口，喙浓墨、腿焦墨，飞羽一根根分开。
     远山：几座峰各一个圆顶（一边陡一边缓）取最高的那座，淡墨一层层铺（山脊叠得最深、往下化开），米点顺着山脊点；四层山一层比一层近、墨一层比一层重。
  7. 雾和光：雾是一条条横的雾带（四分之一分辨率、首尾相接），在墨层上 destination-out 擦掉墨 = 露出纸白，每帧按 t 平移；
     先画远的、擦一道雾、再画近的，雾只盖住它后面的东西。不用黄色、不发光：晨光就是大片留白。
  8. 动起来：镜头一直往左慢移（手卷从右往左看，近水那层一秒 55 px），一个镜头里只这一种慢动作；会动的墨一秒 12 张
     （芦苇、船和人、涟漪、水花、白鹭按张数取、缓存），雾按 t 平滑地漂。拍上：竹篙一扎入水，溅几点墨（「啪」）、荡开扁扁的涟漪，白鹭隔一张受惊伸脖、再一张起飞。
  9. 转场 = 墨在水里晕开：篙拔出水那一点冒出一滴墨，先贴着水面摊开（中心最浓），再漫上来盖住画面：前沿最浓、后面拖着打卷的墨丝、越往里越淡，
     淡到透出镜头 B。低分辨率（640×360）逐格算墨的浓度 D 和露出 B 的遮罩 M，放大贴上：A 只留墨还没晕到的地方，B 只在晕开、变淡的地方露出来，
     再叠上晕开的墨。前沿 = 半径 R(t) − 距离 + 噪声，噪声在跟着水走的坐标里，墨团是一个形状在长大，不是一片噪声在闪。
     R 开头 0.3 秒一冒、之后匀速；R_END 开页面时按噪声算好，让前沿正好在落点那一拍扫过最后一个角；之后残墨 0.8 秒退净（浓墨化开再退成淡墨）。
     白鹭、太阳跨两个镜头一直画在最上面：白鹭飞过浓墨时是一只白鸟，越飞越远越小，第 6 拍简成一笔浓墨。
  10. 歌词 = 题跋：竖排两列，从右往左写在右上的空白里。字形取 hanzi-writer-data 的笔画中线，按笔顺用同一支笔写（横细竖粗，每个字歪一点、
     大小差几个百分点），运笔速度一样，笔画多的字写得久；一列蘸一次墨，往下越写越枯；按字实际的高度往下排（「一」不占整格）。
     不写标点（两列之间就是停顿），不加印章；写完的字也洇一次；画在 overlay 里（最上层、不跟镜头动）。

  时间线（第 0 拍在 0 秒，一拍 0.833 秒）：
    第 0–2 拍  小舟往左走，渔翁撑着上一篙；第 1 拍起拔篙、竖起来、往下扎。
    第 2 拍（1.667 秒）竹篙入水：溅墨点、涟漪一圈圈荡开；白鹭隔一张伸脖受惊，再一张起飞。第 2.25 拍起写第一列「一篙点破晨雾」。
    第 3 拍（2.5 秒）篙尖出水，墨从篙眼晕开。第 5 拍（4.167 秒，window.PLAN）整幅晕满、落到远山，残墨再退。
    第 5.15 拍起写第二列「白鹭飞成一笔」；第 6 拍（5.0 秒）白鹭简成天上的一笔，之后接着往远处飘。
  画面只由 t 决定：随机数都是 MV.rng / MV.hash 加固定种子（「元素名 + 序号」）；笔毛、山脊的一维噪声种子取 MV.hash、格点用整数混合（每帧要算几万次，
  比 MV.noise 快，结果同样只由种子决定）。不用 Math.random() / Date，不存上一帧（芦苇、船、白鹭、写完的字有缓存，内容只取决于第几张 / 第几档 / 第几个字）。
  速度（4 核、没独显的电脑）：开页面准备约 3.1–3.3 秒（取笔画数据、造纸、烤各层）；1920×1080 一帧 0.11–0.29 秒（含出 PNG；转场那几拍两个镜头都画，最慢）。
  出 README 动图：render_frames.mjs --fps 12 --width 1280 --height 720 --format png 出 72 张，再
    ffmpeg -framerate 12 -i %06d.png -vf "scale=640:360:flags=lanczos,split[a][b];[a]palettegen=max_colors=96:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" -loop 0
    4.4 MB（640×360、72 帧；128 色 4.8 MB，超了）。
  坑：
    - 笔毛一束束各填各的，毛之间会露出细缝像条纹：先填满并集再补深浅；干笔噪声的步长太短，飞白碎成噪点
    - 水渍太深会多出一圈「描边」：山的 ring 别超过 .12
    - 逐像素洇墨的成本跟面积走：会动的东西用贴身的小画布、按张数缓存，别整屏洇
    - 缓存图的下边、两头会切出一道直线：山脚、山尾先用渐变擦掉（fadeDown / fadeEnds）再洇
    - 一秒 12 张的动作别用小数比时刻（t < T + 1/12 会差一张），按第几张（整数）比
    - 晕墨的噪声幅度要跟着半径一起从 0 长出来，不然开头一帧就冒出一大团
    - 晕墨里整片匀的灰像一团烟：刚滴下去中心最浓，晕开后前沿最浓，里面只留几缕墨丝
    - 长篙从人前面横过会像串在人身上：画在人后面，人这里断开一截
    - 自己开的画布都要放在 CPU 上（ctx2d 里的 willReadFrequently）：浏览器按用法给画布开、关 GPU 加速，同一个 t 单独渲和顺着渲会差几级
  外部资源：hanzi-writer-data@2.0.1（jsDelivr，Arphic Public License），只取歌词里 11 个字的笔画中线（MV.glyphs：网络问题取不到时出片报错停下；数据里没有的字才退回系统楷体）。
-->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<script src="../../templates/mv/kit.js"></script>
<style>html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }</style>
</head><body><script>
'use strict';
// ───────────────────────── 时间线：全部从拍子算（BPM 72，第 0 拍在 0 秒，一拍 0.833 秒）─────────────────────────
const W = 1920, H = 1080, FPS = 30, BPM = 72, DUR = 6;
MV.tempo(BPM, 0);
const { clamp, lerp, seg, ease } = MV;
const bt = (n) => MV.beatTime(n);
const T_PLANT = bt(2);            // 1.667 秒 竹篙点进水里：溅几点墨、荡开涟漪，白鹭受惊
const T_FLY = (Math.round(T_PLANT * 12) + 2) / 12;   // 白鹭隔两张（一秒 12 张）起飞；按张数算，免得小数比大小差一张
const T_LIFT = bt(3);             // 2.500 秒 篙尖出水，墨从篙眼那儿晕开
const T_LAND = bt(5);             // 4.167 秒 墨晕满画面、退成淡墨：落到远山（转场落点）
const T_ONE = bt(6);              // 5.000 秒 白鹭飞成天上的一笔
const T_W1 = bt(2.25), T_W2 = bt(5.15);   // 两列题跋起笔
const HAZE = 0.8;                 // 落点之后残墨再退多久
window.PLAN = [+T_LAND.toFixed(3)];
const LYRIC = '一篙点破晨雾，白鹭飞成一笔';
window.LYRICS = [[+T_W1.toFixed(3), DUR, LYRIC]];
const POSES = 12, q12 = (t) => Math.floor(t * POSES + 1e-6) / POSES;   // 会动的墨一秒 12 张
const V = 55;                     // 镜头往左慢移（手卷从右往左看）：近水那层一秒走 55 px，远的层乘视差 p
const INK = [24, 21, 22], VERM = [194, 42, 24];
const TAU = Math.PI * 2;
const SYS_FONT = '"KaiTi","STKaiti","Kaiti SC","PingFang SC","Microsoft YaHei",serif';

// ───────────────────────── 工具 ─────────────────────────
const sm = (a, b, v) => { const k = clamp((v - a) / (b - a)); return k * k * (3 - 2 * k); };
const gs = (x, c, s) => Math.exp(-(((x - c) / s) ** 2));
const hashStr = MV.hash, rng = MV.rng, rnd = (key) => rng(key)();
// 一维噪声（笔毛断口、山脊）：种子用 MV.hash 取，格点用整数混合。每帧要算几万次，比 MV.noise 快；结果同样只由种子决定
function lat(seed, i) { let h = (seed ^ Math.imul(i | 0, 0x27d4eb2d)) >>> 0; h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296 * 2 - 1; }
function n1(seed, x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lat(seed, i) * (1 - u) + lat(seed, i + 1) * u; }
function fbm1(seed, x) { return .62 * n1(seed, x) + .27 * n1(seed + 101, x * 2.13) + .11 * n1(seed + 211, x * 4.37); }
// 二维值噪声（纸、雾、晕墨）：MV.rng 铺一张随机格子，平滑插值，四周循环
function grid(key, n) { const r = rng(key), a = new Float32Array(n * n); for (let i = 0; i < a.length; i++) a[i] = r(); return { a, n }; }
function vn(g, x, y) {
  const n = g.n, i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const i0 = ((i % n) + n) % n, j0 = ((j % n) + n) % n, i1 = (i0 + 1) % n, j1 = (j0 + 1) % n, a = g.a;
  return lerp(lerp(a[j0 * n + i0], a[j0 * n + i1], sx), lerp(a[j1 * n + i0], a[j1 * n + i1], sx), sy);
}
function cv(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
// 自己开的画布都放在 CPU 上（willReadFrequently）：浏览器会按用法给画布开 / 关 GPU 加速，开和不开叠出来的像素差几级，
// 同一个 t 先渲、后渲会不一样；全在 CPU 上，画面才只由 t 决定
const ctx2d = (c) => c.getContext('2d', { willReadFrequently: true });
const ink = (a, col = INK) => `rgba(${col[0]},${col[1]},${col[2]},${clamp(a).toFixed(3)})`;
const bez = (a, b, c, d, u) => { const v = 1 - u; return [0, 1].map((k) => v * v * v * a[k] + 3 * v * v * u * b[k] + 3 * v * u * u * c[k] + u * u * u * d[k]); };
const rot = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];

// ───────────────────────── 宣纸 ─────────────────────────
let PAPER = null, FW = null;      // FW：每个像素的纤维 / 吸水度（0..1），洇墨和纸挡墨都查它
function makePaper() {
  const fc = cv(W, H), f = ctx2d(fc), r = rng('fiber');
  f.lineCap = 'round'; f.strokeStyle = '#000';
  for (let i = 0; i < 6500; i++) {             // 纸纤维：短短长长、弯弯的
    const x = r() * W, y = r() * H, a = r() * TAU, L = 5 + r() * r() * 75, b = (r() - .5) * 1.5;
    f.globalAlpha = .25 + .75 * r(); f.lineWidth = .5 + r() * 1.2;
    f.beginPath(); f.moveTo(x, y); f.quadraticCurveTo(x + Math.cos(a + b) * L * .5, y + Math.sin(a + b) * L * .5, x + Math.cos(a) * L, y + Math.sin(a) * L); f.stroke();
  }
  const fd = f.getImageData(0, 0, W, H).data;
  const big = grid('paper-big', 24), mid = grid('paper-mid', 96), fine = grid('paper-fine', 640), pore = grid('paper-pore', 512);
  PAPER = cv(W, H); const pg = ctx2d(PAPER), im = pg.createImageData(W, H), d = im.data;
  FW = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = y * W + x, fib = fd[k * 4 + 3] / 255;
    const cloud = vn(big, x / 110, y / 110) * .6 + vn(mid, x / 26, y / 26) * .4;     // 云絮：纸浆厚薄不匀
    const g = vn(fine, x / 3.2, y / 3.2);
    const tone = 1 + (cloud - .5) * .05 + fib * .028 - (g - .5) * .022;
    d[k * 4] = clamp(241 * tone, 0, 255); d[k * 4 + 1] = clamp(235 * tone, 0, 255); d[k * 4 + 2] = clamp(221 * tone - fib * 3, 0, 255); d[k * 4 + 3] = 255;
    FW[k] = clamp(.12 + .45 * vn(pore, x / 4.5, y / 4.5) + .3 * cloud + .5 * fib);
  }
  pg.putImageData(im, 0, 0);
}
const fwAt = (x, y) => { y |= 0; if (y < 0 || y >= H) return .5; x = (((x | 0) % W) + W) % W; return FW[y * W + x]; };

// ───────────────────────── 洇 ─────────────────────────
// c：画好一团墨的画布（只看 alpha），(ox, oy)：它在纸上的位置。o：r 水走多远、bleed 洇出去的淡墨、th 水线、
// soft 水线软硬、ring 水渍深浅、ringW 水渍宽、feather 纤维把水线扰乱多少、grain 纸挡墨多少、pool 颜料往边上跑、col 颜料
function wetten(c, ox, oy, o) {
  const w = c.width, h = c.height, g = ctx2d(c);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  const bc = cv(w, h), bg = ctx2d(bc);
  bg.filter = `blur(${o.r}px)`; bg.drawImage(c, 0, 0); const bd = bg.getImageData(0, 0, w, h).data;
  const sc = cv(w, h), sg = ctx2d(sc);      // 墨本身也化开一点（湿笔边是软的）
  sg.filter = `blur(${o.cr ?? 1}px)`; sg.drawImage(c, 0, 0); const sd = sg.getImageData(0, 0, w, h).data, cm = o.cm ?? .6;
  const col = o.col || INK, th = o.th ?? .04, soft = o.soft ?? .03, ringW = o.ringW ?? .05, fe = o.feather ?? .15, gr = o.grain ?? .15, bl = o.bleed ?? .25, ri = o.ring ?? .1;
  for (let j = 0; j < h; j++) {
    const wy = oy + j;
    for (let i = 0; i < w; i++) {
      const k = (j * w + i) * 4, A = d[k + 3] / 255, B = bd[k + 3] / 255;
      if (A === 0 && B < .004) continue;
      const f = fwAt(ox + i, wy), e = B + (f - .5) * fe * Math.min(1, B * 6 + .2);
      const wet = sm(th, th + soft, e);
      const bleed = wet * bl * Math.min(1, B * 2.2);
      const ring = ri * wet * (1 - sm(th + soft, th + soft + ringW, e));
      const pool = o.pool ? o.pool * clamp((A - B) * 2.5) * A : 0;
      const core = clamp((A * (1 - cm) + sd[k + 3] / 255 * cm) * (1 - gr * f) + pool);
      const a = 1 - (1 - core) * (1 - bleed) * (1 - ring);
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = Math.round(a * 255);
    }
  }
  g.putImageData(im, 0, 0);
  return c;
}
// 在 box（世界坐标）里画一团墨、洇一次、贴到 dst
function wet(dst, box, o, draw) {
  const x0 = Math.floor(box[0]), y0 = Math.floor(box[1]), c = cv(box[2] - x0, box[3] - y0), g = ctx2d(c);
  g.translate(-x0, -y0); draw(g); wetten(c, x0, y0, o);
  dst.drawImage(c, x0, y0);
}

// ───────────────────────── 笔 ─────────────────────────
function spline(pts, n = 8) {           // Catmull-Rom：把几个手点拉成顺的笔路
  if (pts.length < 3) return pts.map((p) => [p[0], p[1]]);
  const o = [];
  for (let i = 0; i < pts.length - 1; i++) {

    brush(k, [P([hx + hrx * .8, hy + hry * .6]), P([hx + hrx, hy - hry * .3]), P([hx, hy - hry]), P([hx - hrx * .9, hy - hry * .3])], { ...O, w: lw(2.4), a: A(.4), seed: 'egHead' });
    brush(k, E.beak.map(P), { w: lw(4.6), a: A(.84), head: 'hide', tip: 'point', seed: 'egBeak' });
    blob(k, ...P([hx - hrx * .25, hy - hry * .2]), lw(1.6), lw(1.6), A(.92), 'egEye', INK, .05);
    for (const [i, lg] of E.legs.entries()) brush(k, lg.map(P), { w: lw(3.2), a: A(.88), head: 'round', tip: E.toes ? 'blunt' : 'point', seed: 'egLeg' + i, dry: .2 });

    if (E.toes) {                         // 站在浅水里：脚下一道水纹，腿的倒影两笔清墨
      brush(k, [P([-40, 99]), P([0, 101]), P([44, 99])], { w: lw(3), a: A(.2), head: 'point', tip: 'point', dry: .5, seed: 'egRip' });
      for (const [i, lg] of E.legs.entries()) { const f = lg[lg.length - 1]; brush(k, [P([f[0], f[1] + 8]), P([f[0] + 3, f[1] + 26]), P([f[0] - 1, f[1] + 46])], { w: lw(3), a: A(.14), head: 'point', tip: 'point', dry: .5, seed: 'egRef' + i }); }
    }
    if (E.plume) for (let i = 0; i < 3; i++) brush(k, [P([26, -6 + i * 4]), P([64, 6 + i * 6]), P([96, 26 + i * 8])], { w: lw(1.8), a: A(.2), head: 'point', tip: 'point', dry: .5, seed: 'egPl' + i });
    if (E.wingLine) brush(k, [P([-16, -6]), P([20, 4]), P([50, 18])], { ...O, w: lw(2.4), a: A(.3), seed: 'egWl' });
    for (const [wi, wg] of wings.entries()) {        // 前缘一笔、后缘断着勾、飞羽之间几笔分开、覆羽一道
      const pp = wg.pts.map(P), al = wg.far ? .6 : 1, mid = (a, b, u) => [lerp(pp[a][0], pp[b][0], u), lerp(pp[a][1], pp[b][1], u)];
      brush(k, pp.slice(0, 5), { ...O, w: lw(3), a: A(.46 * al), seed: 'egWa' + wi });
      brush(k, pp.slice(4), { ...O, w: lw(2.3), a: A(.3 * al), dry: .45, dryFrom: .2, seed: 'egWb' + wi });
      for (const q of [5, 7, 9, 11]) brush(k, [pp[q], mid(q, 2, .42)], { w: lw(1.9), a: A(.26 * al), head: 'point', tip: 'point', seed: 'egF' + wi + q });

  if (simp > .01) {

// ───────────────────────── 转场：墨在水里晕开 ─────────────────────────
// 篙拔出水的那一点（T_LIFT）冒出一团浓墨，在水里往外晕：前沿最浓，后面拖着打卷的墨丝，越往里越化越淡，淡到透出下一个镜头（远山）；

// 低分辨率（640×360）逐格算两张图：墨的浓度 D、露出 B 的遮罩 M，放大贴上。前沿 φ = R(t) − 距离 + 噪声 > 0；

}
function makeBloom() {

  NB = new Float32Array(NBG.nx * NBG.ny * 3);

    const X = x + 300 * (vn(gw, x / 430, y / 430) - .5), Y = y + 300 * (vn(gw, x / 430 + 17.3, y / 430 + 9.1) - .5);   // 扭一下：墨团打卷
    const X2 = X + 130 * (vn(g3, X / 160 + 5.2, Y / 160) - .5), Y2 = Y + 130 * (vn(g3, X / 160, Y / 160 + 2.7) - .5);   // 再扭一下：墨丝
    NB[k] = .55 * vn(g1, X / 300, Y / 300) + .3 * vn(g1, X / 130 + 3.1, Y / 130 + 7.7) + .15 * vn(g2, X / 56, Y / 56);
    NB[k + 1] = .6 * vn(g2, X2 / 46 + 1.3, Y2 / 46) + .4 * vn(g2, X2 / 20, Y2 / 20 + 4.4);
    NB[k + 2] = .65 * vn(g3, X2 / 90 + 8.8, Y2 / 90 + 1.1) + .35 * vn(g3, X2 / 38, Y2 / 38 + 6.6);

  const O = exitAt(T_LAND);
  for (let j = 0; j < BLH; j++) for (let i = 0; i < BLW; i++) {
    const dx = (i + .5) * W / BLW - O[0], dy = (j + .5) * H / BLH - O[1], n = nbAt(dx, dy);
    R_END = Math.max(R_END, Math.hypot(dx / 1.3, dy / .9) - 300 * (n[0] - .5) * 2.2 - 26 * (n[1] - .5) + 3);

function bloomField(t) {

}

// ───────────────────────── 题跋（歌词）─────────────────────────
// 竖排，从右往左两列，题在右上的空白里。字形取 hanzi-writer-data 的笔画中线，按笔顺用上面那支笔写：
// 起笔藏锋，撇捺钩提出锋、横竖点回锋，横细竖粗，每个字歪一点、大小差几个百分点；运笔速度一样，笔画多的字写得久。
// 一列蘸一次墨：头一个字饱，往下越写越枯（墨淡一点、飞白多一点）。两列之间就是停顿，不写标点，不加印章
const MED = {}, GLYPHS = [], GLYPH_DONE = new Map();
function makeGlyphs() {
  const r = rng('tiba');
  LYRIC.split('，').forEach((txt, ci) => {
    const chars = [...txt], T0 = ci ? T_W2 : T_W1, DW = 1.15;
    const lens = chars.map((ch) => (MED[ch] ? MED[ch].reduce((a, p) => { let l = 0; for (let j = 1; j < p.length; j++) l += Math.hypot(p[j][0] - p[j - 1][0], p[j][1] - p[j - 1][1]); return a + l + 160; }, 0) : 2400));
    const tot = lens.reduce((a, b) => a + b, 0);

      let top = -.45 * S, bot = .45 * S;
      if (MED[ch]) { const ys = MED[ch].flat().map((p) => (388 - p[1]) / 1024 * S); top = Math.min(...ys) - .06 * S; bot = Math.max(...ys) + .06 * S; }
      if (bot - top < .34 * S) { const c = (top + bot) / 2; top = c - .17 * S; bot = c + .17 * S; }
      GLYPHS.push({ ch, id: ci * 16 + k, x: (ci ? 1684 : 1796) + (r() - .5) * 8, y: y - top, S, rot: (r() - .5) * .07, t0, t1: T0 + DW * acc / tot - .02, load: k / Math.max(1, chars.length - 1) });
      y += bot - top + 14 + (r() - .5) * 8;

}
function strokeTip(pts) {     // 撇、捺、钩、提出锋；横、竖、点回锋
  const a = pts[Math.max(0, pts.length - 3)], b = pts[pts.length - 1], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
  return (dx / l < -.35 || (dx / l > .45 && dy / l > .35) || dy / l < -.4) ? 'point' : 'round';
}
function glyphArt(G, f) {
  if (f >= 1 && GLYPH_DONE.has(G.id)) return GLYPH_DONE.get(G.id);
  const size = Math.ceil(G.S * 1.6), c = cv(size, size), g = ctx2d(c);
  g.translate(size / 2, size / 2); g.rotate(G.rot);
  if (MED[G.ch]) {
    const S = G.S, strokes = MED[G.ch].map((m) => m.map(([x, y]) => [(x - 512) / 1024 * S, (388 - y) / 1024 * S]));
    const lens = strokes.map((p) => { let l = 0; for (let j = 1; j < p.length; j++) l += Math.hypot(p[j][0] - p[j - 1][0], p[j][1] - p[j - 1][1]); return l + S * .16; });

      brush(g, p, { w: S * .118 * flat * (dotty ? 1.25 : 1) * (.92 + .16 * rnd('lw' + G.id + k)), a: .95 - .1 * G.load, head: 'hide', tip: dotty ? 'point' : tip, tipLen: S * .2, thin: .2, wob: .1,
        dry: (L > S * .5 ? .42 : .18) + .3 * G.load, dryFrom: .55 - .2 * G.load, gap: S * .22, seed: 'ly' + G.id + '_' + k, f: fk, var: .3, seg: 6 });
    });
  } else if (f > 0) {           // 笔画数据没取到（断网）：退回系统楷体
    g.globalAlpha = clamp(f * 2); g.fillStyle = ink(.92); g.font = `${G.S * .9}px ${SYS_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(G.ch, 0, 0); g.globalAlpha = 1;
  }
  wetten(c, Math.round(G.x - size / 2), Math.round(G.y - size / 2), { r: 1.8, cr: .8, cm: .5, bleed: .14, th: .1, soft: .05, ring: .08, ringW: .05, feather: .35, grain: .14 });

}

// ───────────────────────── 一帧 ─────────────────────────
// 纸不跟镜头动（镜头移的是纸上的墨）。墨全画进一张透明的墨层，最后 multiply 叠到纸上，纸纹从墨底下透出来。
// 转场那几拍 A、B 各画一张墨层：A 只留墨还没晕到的地方，B 只在晕开、变淡了的地方露出来，再叠上晕开的墨。
// 太阳、白鹭跨两个镜头，画在最后（白鹭在墨层上挖出纸白，所以飞过浓墨时是一只白鸟）
let DEV = null;

  const w = g.canvas.width, h = g.canvas.height;

  return DEV;
}
function fresh(c, T) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, c.canvas.width, c.canvas.height); c.setTransform(T); c.imageSmoothingQuality = 'high'; return c; }   // 缩小出草稿时细笔画不断
function drawFrame(g, t) {
  const T = g.getTransform(), D = devs(g), tq = q12(t), box = [T.e, T.f, W * T.a, H * T.d];
  g.drawImage(PAPER, 0, 0);
  const o = fresh(ctx2d(D.ink), T);
  if (t < T_LIFT) drawA(o, t, tq);
  else if (t >= T_LAND) {
    drawB(o, t, tq);
    if (t < T_LAND + HAZE) { bloomField(t); o.save(); o.setTransform(1, 0, 0, 1, 0, 0); o.drawImage(DLO, ...box); o.restore(); }
  } else {
    const a = fresh(ctx2d(D.a), T), b = fresh(ctx2d(D.b), T);
    drawA(a, t, tq); drawB(b, t, tq); bloomField(t);
    for (const c of [a, b, o]) c.setTransform(1, 0, 0, 1, 0, 0);
    a.globalCompositeOperation = 'destination-out'; a.drawImage(MLO, ...box); a.globalCompositeOperation = 'source-over';
    b.globalCompositeOperation = 'destination-in'; b.drawImage(MLO, ...box); b.globalCompositeOperation = 'source-over';
    o.drawImage(D.a, 0, 0); o.globalCompositeOperation = 'lighter'; o.drawImage(D.b, 0, 0); o.globalCompositeOperation = 'source-over';
    o.drawImage(DLO, ...box);

// 歌词：最上层、不跟镜头动。一笔一笔写出来的题跋，multiply 叠在纸上
function overlay(g, t) {
  if (!MV.lyricAt(t)) return;
  g.globalCompositeOperation = 'multiply';
  for (const G of GLYPHS) {
    const f = clamp((t - G.t0) / (G.t1 - G.t0)); if (f <= 0) continue;
    const c = glyphArt(G, f); g.drawImage(c, G.x - c.width / 2, G.y - c.height / 2);
  }
  g.globalCompositeOperation = 'source-over';
}

async function ready() {
  // 笔画数据：先用本地的 glyphs.js（scripts/glyphs.py 存的，页面里引了就用），缺的从 jsDelivr 取；网络问题取不到时出片报错停下，不会有的帧有字、有的退回楷体
  Object.assign(MED, await MV.glyphs(LYRIC));
  makePaper(); makeMists(); bakeA(); bakeB(); makeSun(); makeBloom(); makeGlyphs();
}
MV.page({ W, H, fps: FPS, duration: DUR, ready, draw: drawFrame, overlay });
