<!doctype html>
<!--
  纸艺立体书（papercraft diorama / pop-up book）原生画法示范 · 6 秒 · 秋夜森林：小狐狸叼着纸灯笼穿过纸树林，书页合上再翻开，走到山坡小木屋门口
  示范场景只为展示画法，做 MV 时场景、角色、构图从你的歌来。
  像什么：桌上一本打开的立体书被相机拍下来。后半页立着当背板（印好的夜空），前半页平铺当地面，所有东西都是从前半页的折痕上
  立起来的硬纸片，前后站开、浅景深；夜里是冷的环境光，暖光只有灯笼、萤火虫和窗。

  关键画法（Canvas 2D，不靠任何库）：
  1. 纸片（paperSprite）：每样东西先平涂画一次，缓存成离屏画布。立体的东西分亮暗两面（twoTone：整片涂暗面，再把往左上错开的
     同一形状涂亮面）；小块像另一张纸贴上去，下面垫一点小影子（glue）。然后把透明度往外扩一圈填暖白当模切白边，外面再扩一点填深色
     当刀口线，右下错开 2–5px 露一条深一点的纸芯当纸厚。同一张纸片顺手做好背面（同一个外形的牛皮纸，翻页时露出来）和剪影（投影用）。
  2. 纸和纹理：开页面烤一张 512 的纸纹（纸浆不匀的大块明暗、斑点、弯的纤维），用 pattern 贴在每张纸片自己身上（每张错开一个随机
     位置），跟着纸片走，不是整屏叠一层。地面纸是几张波浪边的纸一层层压着往前铺，撒着剪好的小落叶。
  3. 分层（每个镜头 7–8 层）：书后面的屋子（只在合书那一下露出来）→ 背板（后半页，提前糊好）→ 地面纸（前半页）→ 远排 → 中排
     → 萤火虫（细铁丝从地上立起来）→ 主角排（第二个镜头木屋和狐狸各一层）→ 最前排的大树和草。每层画在自己的画布上（layer）：
     先往后面已经画好的东西投影 → 画纸片 → 打光 → 补自发光 → 按景深糊着叠上去。
     景深糊多少：背板 5px、远排 5–5.5、中排 2–2.2、萤火虫 0.8、主角排 0、最前排 10；地面纸离焦平面越远越糊（烤的时候分带糊）。
  4. 颜色：秋天的树冠是锈红、赭黄、酱红、橄榄绿，夹一棵墨绿的松；狐狸橙、奶白、深棕的袜子；夜空是灰蓝，不用深底霓虹。
     打光 = 纸的颜色 × 光照图（multiply）：光照图先铺冷蓝的环境光，暖光按浓度「盖」上去（蓝 + 黄「加」起来会变成中性白），
     再把（纸的颜色 × 暖光）加一点上去（boost），灯旁边比环境亮。
  5. 光和影：灯笼是点光，影子从灯往外推（纸片在灯左边影子就往左），离灯越近越浓，跟着狐狸一起走；月亮是远光，影子朝一个方向，
     月亮越升越高影子越短；第二个镜头两个光一起投。影子 = 这一层纸片的剪影按光错开、糊开，叠在后面的层上（只落在后面，
     不落在自己身上）。地上的光池是压扁的一团暖光；亮着的灯笼、萤火虫尾巴、窗玻璃不吃环境光，打光以后再贴；最后在镜头上
     screen 一点光斑。
  6. 折页（立体书的机关，withFold）：每层纸片绕自己底边的折痕转，相机略高（PHI = 12°），投到画面上的高度是 cos(th − PHI)：
     往后倒（th → +90°）看到正面，往折痕压扁、越倒越暗，倒平了还剩一窄条；往前倒（过了 −78°）翻到折痕下面，露出牛皮纸背面；
     影子跟着站起来的高度变短，倒平了就没有。背板往前合上时，背面在折痕下面拉长（KB），把整个前半页盖住。
  7. 动起来的手感：场景时间一秒 12 张（格子对齐落点那一拍，落点那张正好在拍上），手够得着的纸片每一张有一点手摆的偏移和转角
     （place 的 jit），远处糊掉的不抖；整体曝光一档停三张再换（每张都闪的话 GIF 会大一截）。狐狸是关节纸偶：身子、头、尾巴、
     四条腿各是一张纸片，关节钉着铜脚钉；走路四张一循环，身子一颠一颠，灯笼挂在叼着的小木棍上跟着步子晃。萤火虫亮、窗亮这种光
     按真实的 t 算，正好在拍上，不跟着一秒 12 张取整。镜头整片只有一个慢移（往右，近的层走得多、远的走得少 = 视差），两个镜头
     接着走，不推拉不晃。
  8. 转场 = 合书再翻开：第一页的纸片从前往后依次往后倒 → 背板往前合上（越落越快），牛皮纸背面盖住整页 → 在盖住的那一帧换页
     → 下一页的背板一下翻起来（先快后慢）→ 纸片从后往前依次站起来，都在第 5 拍站直，落下后前后晃两下停住。
     换页那一帧两边要画得一模一样：同一张背面（S.sky2.back = S.sky1.back）、同一组光（AMB_COVER）、屋子在同一个镜头位置。
  9. 歌词：一张从书页的缝里拉出来的纸条（overlay，最上层、不跟镜头动）。画面底下一道缝一直在；这句开始时纸条带着半圆的拉手
     从缝里抽出来，冲过一点再回来（ease.back），字印在纸条上，抽出来多少露多少；纸条每张有一点手抖，往书页上投一点影子。

  时间线（BPM 96，一拍 0.625 秒，第 0 拍在 0 秒）：
    第 0 拍          狐狸叼着灯笼往右走，镜头跟着慢移，落叶一直在落
    第 1、2、3 拍    萤火虫一只只亮（亮的那一下闪一下再回落）；第 1 拍纸条从缝里拉出来
    第 3.4 拍        第一页的纸片从前往后依次往后倒
    第 3.65–4.3 拍   背板往前合上，盖住整页；第 4.35 拍换页
    第 4.4–4.85 拍   下一页的背板翻起来，纸片从后往前站起来
    第 5 拍（3.125 秒）落点：纸片站直（window.PLAN）；月亮开始从山后升起，狐狸起步走向小木屋
    第 6 拍          小木屋的窗亮
    第 8 拍          狐狸走到门口停下，尾巴摇，眯眼笑；烟囱的纸烟、萤火虫一直在动
  速度：开页面到准备好约 5 秒（下字体 + 烤纸纹、纸片、背板和地面纸，烤约 2 秒）。1920×1080 画一帧连 toDataURL 约 0.08–0.13 秒
  （第一帧预热 0.3–1.6 秒）；render_frames 实测 1920×1080 约 0.4 秒/帧、960×540 约 0.1–0.18 秒/帧（含传图写盘，机器忙时慢一倍）。
  慢在每层几次整幅的合成和糊（每个光源一遍投影、一遍打光），出图缩小省不了多少。
  出 README 动图：render_frames.mjs --fps 12 --width 1280 --height 720 --format png 渲 72 帧，ffmpeg scale=640:360:flags=lanczos，
  palettegen=max_colors=128:stats_mode=diff + paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle，-loop 0，约 4.3 MB。
  镜头一直在慢移，每帧整屏都在变，颜色再多就超 4.5 MB。
  外部资源：霞鹜文楷 LXGW WenKai（jsDelivr 的 lxgw-wenkai-webfont@1.7.0，字体 OFL-1.1，网页字体包 MIT）；没下载到 MV.font 会报出来（出片时停下）。
  坑：
  - 几个圆拼成的形状（树冠、烟），每个椭圆要自己起一段子路径（addEll）。连着调 ellipse 会从上一个椭圆的终点拉直线过来，
    形状里多出三角形的洞，露出白边的颜色。
  - 亮着的窗玻璃是打光以后才贴的，要和狐狸分两层画，不然亮窗会贴到走过去的狐狸身上。
  - 合书那几帧只有书页背面和屋子，别拖长：合上和翻开各 0.3–0.4 秒，盖住的只有一两张。
-->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
<script src="../../templates/mv/kit.js"></script>
<style>html, body { margin: 0; overflow: hidden; background: #000; }</style>
</head><body><script>
// ======================= 基本量 =======================
const W = 1920, H = 1080, FPS = 30, DURATION = 6;
const M = 64, LW = W + 2 * M, LH = H + 2 * M;         // 每层画布四周多留 64px，糊的时候边上不发虚
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const POSES = 12;                                    // 定格：一秒 12 张
const { clamp, lerp, seg, ease } = MV;
MV.tempo(96, 0);
const bt = MV.beatTime;
const FONT = '"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif';
const LYRIC = '提着灯，走回你的门口';
window.LYRICS = [[bt(1), bt(9.6), LYRIC]];

// 时间线（都从拍子算）
const T_FLY = [bt(1), bt(2), bt(3)];                 // 萤火虫一只只亮
const T_FOLD = bt(3.4);                              // 第一页的纸片开始往后倒
const T_CLOSE = [bt(3.65), bt(4.3)];                 // 背板往前合上（越落越快），盖住整页
const T_SWAP = bt(4.35);                             // 合上的那一下换页（画面被书页背面盖着）
const T_OPEN = [bt(4.4), bt(4.85)];                  // 下一页的背板一下翻起来（先快后慢）
const T_LAND = bt(5);                                // 落点：下一页的纸片在这一拍站直
const T_WIN = bt(6);                                 // 小木屋的窗亮
const T_DOOR = bt(8);                                // 小狐狸走到门口
window.PLAN = [+T_LAND.toFixed(3)];

const GUT = 560;                                     // 书的中缝（背板立在这条线上）
const PHI = 12 * D2R, CPHI = Math.cos(PHI);          // 相机从稍高处往下看

const C = {
  cream: '#FFF6E6', edge: '#A08C74', cut: '#2E2420', kraft: '#B89D7B', kraftDk: '#977B5C',
  rust: { lt: '#D3653A', dk: '#A9461F' }, ochre: { lt: '#E8AC45', dk: '#C08429' }, maroon: { lt: '#9E4634', dk: '#76311F' },
  olive: { lt: '#959247', dk: '#706E34' }, pine: { lt: '#4A6E5C', dk: '#334F42' },
  trunk: '#6E4B35', trunkDk: '#4F3424',
  fox: '#E27B35', foxDk: '#B65A22', foxCream: '#F8EAD3', foxCreamDk: '#E3CDAD', sock: '#4A3327', nose: '#2B1F1B',
  lanternPaper: '#E5683E', lanternDk: '#B84A28', cap: '#4A3A32', stick: '#C9A274', stickDk: '#9E7B52',
  wood: '#9C6B45', woodDk: '#744C30', woodLt: '#BB8656', roof: '#7F3D30', roofDk: '#5E2C23', stone: '#BDB4A4',
  hill: { lt: '#6F7F57', dk: '#56653F' }, hillFar: { lt: '#4F6B7C', dk: '#3F596A' },
  moon: '#F4EBCF', moonDk: '#D9CBA3', mush: '#C8442F', mushDk: '#9E3220', mushDot: '#F8EEDC', stem: '#EFE3CC',
  fern: { lt: '#7C8A43', dk: '#5D6A30' }, grass: { lt: '#A39348', dk: '#7D6F31' },
};
const LANT = [255, 198, 116], WIN = [255, 190, 104], FLY = [236, 240, 160];   // 灯笼、窗、萤火虫的暖光

// ======================= 工具 =======================
const rnd = (key) => MV.rng(key)();
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
const g2 = (c) => c.getContext('2d');
function reset(x) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.filter = 'none';
  x.shadowColor = 'rgba(0,0,0,0)'; x.shadowBlur = 0; x.shadowOffsetX = 0; x.shadowOffsetY = 0; return x;
}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function ell(cx, cy, rx, ry, rot = 0) { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, rot, 0, TAU); return p; }
// 往一条路径里加一个椭圆（自己起一段新的子路径）。直接连着调 ellipse 会从上一个椭圆的终点拉一条直线过来，
// 几块拼起来的形状里就多出一个个三角形的洞（露出白边的颜色）
function addEll(p, cx, cy, rx, ry) { p.moveTo(cx + rx, cy); p.ellipse(cx, cy, rx, ry, 0, 0, TAU); }
function poly(pts) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
function rrect(x, y, w, h, r) { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; }
function capsule(x1, y1, x2, y2, r1, r2 = r1) {
  const a = Math.atan2(y2 - y1, x2 - x1), p = new Path2D();
  p.arc(x1, y1, r1, a + Math.PI / 2, a - Math.PI / 2); p.arc(x2, y2, r2, a - Math.PI / 2, a + Math.PI / 2); p.closePath(); return p;
}
// 一小片纸贴上去：先画它投在底下那张纸上的小影子，再画它本身
function glue(a, path, fill, o = {}) {
  if (o.sh !== false) {
    a.save(); if (o.clip) a.clip(o.clip);
    a.shadowColor = o.sc || 'rgba(30,20,20,.36)'; a.shadowBlur = o.sb ?? 5; a.shadowOffsetX = o.sx ?? 2; a.shadowOffsetY = o.sy ?? 3;
    a.fillStyle = fill; a.fill(path); a.restore();
  }
  a.fillStyle = fill; a.fill(path);
}
// 立体的东西分亮暗两面：整片涂暗面，再把往左上错开的同一形状涂亮面
function twoTone(a, path, lit, dark, dx = -14, dy = -12) {
  a.fillStyle = dark; a.fill(path);
  a.save(); a.clip(path); a.translate(dx, dy); a.fillStyle = lit; a.fill(path); a.restore();
}

// ======================= 纸 =======================
let TEX = null;
function makeTex() {
  const s = 512, c = canvas(s, s), x = g2(c), r = MV.rng('paper-tex');
  for (let i = 0; i < 70; i++) {
    const px = r() * s, py = r() * s, rad = 30 + r() * 90, dark = r() < .5, g = x.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, dark ? 'rgba(60,50,45,.06)' : 'rgba(255,255,255,.07)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(px - rad, py - rad, rad * 2, rad * 2);
  }
  for (let i = 0; i < 8000; i++) {
    x.fillStyle = r() < .55 ? `rgba(55,45,40,${.05 + r() * .08})` : `rgba(255,255,255,${.07 + r() * .1})`;
    x.fillRect(r() * s, r() * s, 1 + r() * 1.6, 1 + r() * 1.2);
  }
  x.lineCap = 'round';
  for (let i = 0; i < 260; i++) {
    const px = r() * s, py = r() * s, an = r() * TAU, l = 6 + r() * 20;
    x.strokeStyle = r() < .5 ? `rgba(90,75,65,${.07 + r() * .07})` : `rgba(255,255,255,${.09 + r() * .09})`; x.lineWidth = .6 + r() * .6;
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(an) * l * .5 + (r() - .5) * 7, py + Math.sin(an) * l * .5 + (r() - .5) * 7, px + Math.cos(an) * l, py + Math.sin(an) * l); x.stroke();
  }
  return c;
}
function texFill(x, w, h, key, alpha = 1) {
  const p = x.createPattern(TEX, 'repeat');
  p.setTransform(new DOMMatrix([1, 0, 0, 1, Math.floor(rnd(key + 'x') * 512), Math.floor(rnd(key + 'y') * 512)]));
  x.save(); x.globalCompositeOperation = 'source-atop'; x.globalAlpha = alpha; x.fillStyle = p; x.fillRect(0, 0, w, h); x.restore();
}
function grow(src, r, col) {
  const c = canvas(src.width, src.height), x = g2(c), n = Math.max(24, Math.round(r * 3));
  for (let i = 0; i < n; i++) { const t = i / n * TAU; x.drawImage(src, Math.cos(t) * r, Math.sin(t) * r); }
  for (let i = 0; i < 12; i++) { const t = i / 12 * TAU + .26; x.drawImage(src, Math.cos(t) * r * .55, Math.sin(t) * r * .55); }
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
// 一张纸片：正面（画 + 白边 + 刀口 + 纸厚）、背面（同一个外形的牛皮纸）、剪影（投影用）
function paperSprite(key, bounds, draw, o = {}) {
  const r = o.border ?? 12, th = o.thick ?? 3.5, pad = Math.ceil(r + th + 8);
  const [x0, y0, x1, y1] = bounds, w = Math.ceil(x1 - x0) + 2 * pad, h = Math.ceil(y1 - y0) + 2 * pad, ox = pad - x0, oy = pad - y0;
  const art = canvas(w, h), a = g2(art); a.translate(ox, oy); draw(a); reset(a);
  texFill(a, w, h, key, o.tex ?? 1);
  const img = canvas(w, h), x = g2(img), back = canvas(w, h), b = g2(back);
  const shape = r > 0 ? grow(art, r, '#000') : art;
  if (r > 0) {
    const edge = grow(art, r + 1, o.edge || C.edge), rim = grow(art, r + (o.cut ?? 2.2), C.cut), card = grow(art, r, o.cream || C.cream);
    texFill(g2(card), w, h, key + 'card', .9);
    x.drawImage(edge, th * .75, th); x.drawImage(rim, 0, 0); x.drawImage(card, 0, 0);
  }
  x.drawImage(art, 0, 0);
  // 背面：没印东西的牛皮纸，一圈压暗的边
  b.drawImage(grow(shape, th * .6, C.kraftDk), 0, 0);
  b.drawImage(shape, 0, 0); b.globalCompositeOperation = 'source-atop'; b.fillStyle = o.backCol || C.kraft; b.fillRect(0, 0, w, h);
  b.globalCompositeOperation = 'source-over'; texFill(b, w, h, key + 'back', 1);
  const sil = canvas(w, h), s = g2(sil); s.drawImage(shape, 0, 0); s.globalCompositeOperation = 'source-in'; s.fillStyle = '#140E12'; s.fillRect(0, 0, w, h);
  return { img, back, sil, ox, oy, w, h, top: y0 };
}

// ======================= 画每样东西（平涂，锚点 = 底边折痕的中点） =======================
function leafPts(cx, cy, s, rot, k = .55) {          // 一片尖头叶子（贴在树冠上、落叶、蕨）
  const c = Math.cos(rot), sn = Math.sin(rot), P = (x, y) => [cx + x * c - y * sn, cy + x * sn + y * c], p = new Path2D();
  const a = P(-s, 0), b = P(s, 0), u1 = P(-s * .2, -s * k), u2 = P(s * .5, -s * k * .8), d1 = P(s * .5, s * k * .8), d2 = P(-s * .2, s * k);

  place(x, S.stick, F.mouth[0], F.mouth[1], { id: 'stick', jit: .5 });
  if (MODE === 'sil' || FOLD.back) place(x, S.lantern, F.tip[0], F.tip[1], { id: 'lantern', rot: F.swing, jit: .4 });
}
// 亮着的灯笼不吃环境光：打光以后再贴上去（跟着折页一起倒）
function drawLantern(x, F) { if (!FOLD.back) place(x, S.lanternLit, F.tip[0], F.tip[1], { id: 'lantern', rot: F.swing, jit: .4 }); }
function flyPos(i, t, list) {
  const [x0, y0] = list[i], ph = rnd('flyph' + i) * TAU;
  return [x0 + Math.sin(t * 1.3 + ph) * 18, y0 + Math.sin(t * 2.1 + ph * 1.7) * 12];
}
function drawFlies(x, t, list, litFn, emit) {
  for (let i = 0; i < list.length; i++) {
    const [fx, fy] = flyPos(i, TQ, list), lit = litFn(i);
    if (!emit) {
      if (MODE === 'art') { x.strokeStyle = 'rgba(52,40,34,.75)'; x.lineWidth = 2; x.beginPath(); x.moveTo(list[i][0], FLY_BASE); x.quadraticCurveTo(list[i][0] + (fx - list[i][0]) * .3, (FLY_BASE + fy) / 2, fx, fy + 6); x.stroke(); }
      place(x, S.fly, fx, fy, { id: 'fly' + i, rot: Math.sin(t * 2 + i) * .15, jit: .5, cast: .6, sx: 1.4, sy: 1.4 });
    } else if (lit > 0 && !FOLD.back) {
      x.save(); x.translate(fx - 18, fy + 1); const g = x.createRadialGradient(0, 0, 0, 0, 0, 17);
      g.addColorStop(0, rgba([255, 252, 214], Math.min(1, lit))); g.addColorStop(.5, rgba(FLY, .9 * Math.min(1, lit))); g.addColorStop(1, rgba(FLY, 0));
      x.fillStyle = g; x.fillRect(-17, -17, 34, 34); x.restore();
    }
  }
}
// 落叶：每片一个种子，位置只由时刻算（一秒 12 张），一边落一边翻（横向压扁 = 纸片翻面）
function drawLeaves(x, n, key, area) {
  for (let i = 0; i < n; i++) {
    const r = MV.rng(key + i), x0 = area[0] + r() * (area[1] - area[0]), sp = 70 + r() * 60, span = area[3] - area[2];
    const y = area[2] + ((r() * span + sp * TQ) % span), xx = x0 + Math.sin(TQ * 1.4 + r() * 6) * 40;
    const flip = Math.cos(TQ * (2 + r() * 2) + r() * 6);
    place(x, S.leaf[i % 3], xx, y, { id: key + i, rot: TQ * (1 + r()) + r() * 6, sx: Math.abs(flip) < .15 ? .15 : flip, sy: 1, jit: 0, cast: .5 });
  }
}

// ======================= 两个镜头 =======================
const AMB1 = ['124,134,172', '92,100,142'], AMB_COVER = ['222,208,192', '188,174,160'];   // 合上的书页背面朝着屋里的灯，比夜景亮
const KB = 3.15;                                         // 背板往前合上时盖住整个前半页：背面在折痕下面拉长到画面底
function drawRoom(Sc) { reset(Sc); Sc.drawImage(S.room, -40 - CAMX * .15, -20, LW + 80, LH + 40); }
// 背板：书的后半页。a ≥ 0 时立在最后面；往前合上、翻过折痕以后盖在所有东西前面（画背面）
function backPage(Sc, sky, th, amb, warm) {
  layer(Sc, { depth: .35, blur: 0, shadow: false, amb, warm, draw: (x) => withFold(x, GUT, th, () => place(x, sky, W / 2, GUT, { id: 'sky', jit: 0 }), KB) });
  const a = foldA(th);
  if (a < 0) {   // 合上来的书页往下面的东西投一道影子
    const ey = toScreen(0, GUT - a * KB * 990, .35)[1], g = Sc.createLinearGradient(0, ey - 6, 0, ey + 150);
    g.addColorStop(0, 'rgba(20,14,12,.45)'); g.addColorStop(1, 'rgba(20,14,12,0)'); reset(Sc); Sc.fillStyle = g; Sc.fillRect(0, ey - 6, LW, 160);
  }
}
function floorLayer(Sc, img, amb, warm, boost) {
  layer(Sc, { depth: .8, shadow: false, amb, warm, boost, draw: (x) => { x.drawImage(img, FX0 - M, -M); } });
}
const fold1 = (st) => 90 * D2R * ease.inOut(seg(TQ, T_FOLD + st, T_FOLD + st + .36));   // 第一页：前排先倒，越往后越晚
function shotForest(Sc, t) {
  const F = foxPose(TQ, 1), aRow = foldA(fold1(.05));
  const thB = -90 * D2R * ease.in(seg(TQ, T_CLOSE[0], T_CLOSE[1]));
  LIGHTS = [{ kind: 'point', x: F.lc[0], y: F.lc[1], k: .26, max: 150, alpha: .62, reach: 1300 }];
  const lit = (i) => t >= T_FLY[i] ? 1 + 1.6 * Math.exp(-(t - T_FLY[i]) / .1) : 0;
  const lampAt = (d, R, sy = 1, k = 1) => (lx) => {
    const fa = Math.max(0, aRow); glowAt(lx, d, F.lc[0], F.lc[1] + (sy < 1 ? FOX_Y - F.lc[1] + 20 : 0), R, LANT, k * fa, sy);
    for (let i = 0; i < FLIES.length; i++) if (lit(i)) { const [fx, fy] = flyPos(i, TQ, FLIES); glowAt(lx, d, fx, fy + (sy < 1 ? FLY_BASE - fy : 0), 150 * (sy < 1 ? 1.4 : 1), FLY, .3 * Math.min(1, lit(i)) * fa, sy); }
  };
  drawRoom(Sc);
  if (foldA(thB) >= 0) backPage(Sc, S.sky1, thB, AMB1, lampAt(.35, 900, 1, .3));
  floorLayer(Sc, S.floor1, ['132,140,174', '98,104,146'], lampAt(.8, 640, .32), .35);
  layer(Sc, { depth: .5, blur: 5.5, shBlur: 10, shAlpha: .3, amb: ['118,128,166', '90,98,140'], warm: lampAt(.5, 700, 1, .35),
    draw: (x) => withFold(x, 612, fold1(.14), () => { for (const [i, f] of S.far1.entries()) place(x, f.s, f.x, 612, { id: 'far' + i, jit: 0 }); }) });
  layer(Sc, { depth: .72, blur: 2.2, shBlur: 12, shAlpha: .42, amb: ['128,138,176', '96,104,146'], warm: lampAt(.72, 760, 1, .6), boost: .2,
    draw: (x) => withFold(x, 700, fold1(.1), () => { for (const [i, f] of S.mid1.entries()) place(x, f.s, f.x, 700, { id: 'mid' + i, jit: .4 }); }) });
  layer(Sc, { depth: .86, blur: .8, shBlur: 8, shAlpha: .4, amb: ['140,148,184', '104,112,152'], warm: lampAt(.86, 700, 1, .8),
    draw: (x) => withFold(x, FLY_BASE, fold1(.07), () => drawFlies(x, t, FLIES, lit, false)),
    emit: (x) => withFold(x, FLY_BASE, fold1(.07), () => drawFlies(x, t, FLIES, lit, true)) });
  layer(Sc, { depth: 1, blur: 0, shBlur: 9, shAlpha: .55, amb: ['150,158,192', '112,120,160'], warm: lampAt(1, 680), boost: .3,
    draw: (x) => withFold(x, FOX_Y, fold1(.05), () => {
      for (const [i, [mx, k]] of [[520, 0], [560, 1], [1480, 2], [1960, 0]].entries()) place(x, S.mush[k], mx, FOX_Y + 6, { id: 'mush' + i, jit: .5 });
      drawFox(x, F);
    }),
    emit: (x) => withFold(x, FOX_Y, fold1(.05), () => drawLantern(x, F)) });
  layer(Sc, { depth: 1.32, blur: 10, shBlur: 16, shAlpha: .3, amb: ['104,112,150', '80,86,124'], warm: lampAt(1.32, 800, 1, .5),
    draw: (x) => withFold(x, H + 40, fold1(0), () => {
      place(x, S.fern[0], 120, H + 40, { id: 'fern0', jit: 0 }); place(x, S.fern[1], 1560, H + 60, { id: 'fern1', jit: 0 });
      place(x, S.grass[0], 900, H + 30, { id: 'grass0', jit: 0 });
      place(x, S.front[0], 2150, H + 70, { id: 'front0', jit: 0 }); place(x, S.front[1], -330, H + 70, { id: 'front1', jit: 0 });
      drawLeaves(x, 6, 'leafA', [-100, 2300, -100, H + 40]);
    }) });
  if (foldA(thB) < 0) backPage(Sc, S.sky1, thB, AMB_COVER, null);
  // 镜头里的光斑：灯笼、亮了的萤火虫（screen 叠上去，不糊）
  const fa = Math.max(0, aRow), cover = foldA(thB) < 0 ? 0 : 1;
  reset(Sc); Sc.globalCompositeOperation = 'screen';
  glowAt(Sc, 1, F.lc[0], F.lc[1], 190, [255, 200, 120], .55 * fa * cover);
  for (let i = 0; i < FLIES.length; i++) { const l = lit(i); if (l) { const [fx, fy] = flyPos(i, TQ, FLIES); glowAt(Sc, .86, fx - 18, fy - (1 - fa) * (fy - FLY_BASE), 70 + 60 * (l - 1), FLY, .65 * Math.min(1.5, l) * fa * cover); } }
  reset(Sc);
}
const rise2 = (st) => {   // 下一页的纸片：从朝镜头倒平（看到背面）转到站直，后排先起、前排后起，都在 T_LAND 这一拍站直，落下后前后晃两下停住
  let th = -90 * D2R * (1 - ease.inOut(seg(TQ, T_OPEN[0] + .04 + st, T_LAND)));
  if (TQ > T_LAND) th += 8 * D2R * Math.exp(-(TQ - T_LAND) / .2) * Math.sin((TQ - T_LAND) / .34 * TAU);
  return th;
};
function shotCabin(Sc, t) {
  const F = foxPose(TQ, 2), aRow = foldA(rise2(.09));
  const thB = -90 * D2R * (1 - ease.out(seg(TQ, T_OPEN[0], T_OPEN[1])));
  const mu = ease.out(seg(TQ, T_LAND - .05, T_DOOR + .6)), moonY = lerp(690, 290, mu), mI = clamp(mu * 1.4);
  // 两个光源投影：月亮（远光，一个方向，越升越高影子越短）+ 灯笼（点光，跟着狐狸走）
  LIGHTS = [{ kind: 'far', dx: 30 + 26 * (1 - mu), dy: 20 + 34 * (1 - mu), alpha: .38 + .22 * mI, w: .8 },
            { kind: 'point', x: F.lc[0], y: F.lc[1], k: .22, max: 130, alpha: .55, reach: 950, w: .8 }];
  const win = t >= T_WIN ? 1 + .9 * Math.exp(-(t - T_WIN) / .12) - .05 * rnd('wf' + Math.floor(t * 6)) : 0;
  const amb = (k) => { const c0 = [118, 128, 166].map((v, i) => Math.round(lerp(v, [150, 164, 200][i], mI) * k)), c1 = [90, 98, 140].map((v, i) => Math.round(lerp(v, [114, 126, 168][i], mI) * k)); return [c0.join(','), c1.join(',')]; };
  const cab = [1420, 822], m = S.cabinMeta, winC = [cab[0] + 86, cab[1] - 108];
  const warmAt = (d, R, sy = 1, k = 1) => (lx) => {
    const fa = Math.max(0, aRow);
    glowAt(lx, d, F.lc[0], F.lc[1] + (sy < 1 ? FOX_Y - F.lc[1] + 20 : 0), R, LANT, k * fa, sy);
    if (win) glowAt(lx, d, winC[0], sy < 1 ? cab[1] + 30 : winC[1], R * 1.1, WIN, .75 * k * Math.min(1, win) * fa, sy);
  };
  drawRoom(Sc);
  if (foldA(thB) >= 0) backPage(Sc, S.sky2, thB, amb(1.06), null);
  if (TQ > T_LAND - .1) layer(Sc, { depth: .4, blur: 2.5, shadow: false, amb: ['236,236,240', '226,226,232'],
    draw: (x) => place(x, S.moon, 980, moonY, { id: 'moon', jit: .3 }) });
  floorLayer(Sc, S.floor2, amb(1.08), warmAt(.8, 620, .32), .35);
  layer(Sc, { depth: .5, blur: 5, shBlur: 10, shAlpha: .5, amb: amb(.92), draw: (x) => withFold(x, 640, rise2(0), () => place(x, S.hillFar, W / 2 + 120, 640, { id: 'hf', jit: 0 })) });
  layer(Sc, { depth: .72, blur: 2, shBlur: 12, shAlpha: .5, amb: amb(1), warm: warmAt(.72, 700, 1, .5),
    draw: (x) => withFold(x, 770, rise2(.03), () => {
      place(x, S.hillMid, W / 2 + 200, 770, { id: 'hm', jit: .2 });
      for (const [i, f] of S.mid2.entries()) place(x, f.s, f.x, 770 - (i === 2 ? 150 : 40), { id: 'm2' + i, jit: .4 });
    }) });
  layer(Sc, { depth: .86, blur: .8, shBlur: 8, shAlpha: .4, amb: amb(1.05), warm: warmAt(.86, 700, 1, .8),
    draw: (x) => withFold(x, FLY_BASE, rise2(.05), () => drawFlies(x, t, FLIES2, () => 1, false)),
    emit: (x) => withFold(x, FLY_BASE, rise2(.05), () => drawFlies(x, t, FLIES2, () => 1, true)) });
  // 小木屋一层、狐狸一层：狐狸走到门口时，它的影子落在木屋墙上
  layer(Sc, { depth: .97, blur: 0, shBlur: 9, shAlpha: .5, amb: amb(1.1), warm: warmAt(.97, 640), boost: .25,
    draw: (x) => withFold(x, cab[1], rise2(.07), () => {
      place(x, S.cabin, cab[0], cab[1], { id: 'cabin', jit: .3 });
      for (let i = 0; i < 3; i++) {   // 烟囱冒的纸烟：一团团往上走，越走越大，到顶缩回去（棉花团挂在细铁丝上换位置）
        const k = (TQ * .45 + i / 3) % 1, [cx, cy] = m.chimney, s = (.5 + k * .8) * (1 - ease.smooth(seg(k, .8, 1)));
        if (s > .02) place(x, S.puff[i % 2], cab[0] + cx + k * 70 + Math.sin(k * 5 + i) * 14, cab[1] + cy - 14 - k * 240, { id: 'puff' + i, sx: s, sy: s, jit: .5, cast: .4 });
      }
      place(x, S.mush[1], 1760, cab[1] + 22, { id: 'mush2a' }); place(x, S.mush[2], 1800, cab[1] + 26, { id: 'mush2b' });
    }),
    emit: (x) => withFold(x, cab[1], rise2(.07), () => {
      if (!win || FOLD.back) return;
      x.save(); x.translate(cab[0], cab[1]); const f = Math.min(1.2, win);
      for (const [px, py, pw, ph] of m.panes) { const g = x.createLinearGradient(0, py, 0, py + ph); g.addColorStop(0, rgba(WIN, .85 * f)); g.addColorStop(1, rgba([255, 222, 160], .95 * f)); x.fillStyle = g; x.fillRect(px, py, pw, ph); }
      const [rx, ry, rr] = m.round; x.fillStyle = rgba(WIN, .8 * f); x.beginPath(); x.arc(rx, ry, rr, 0, TAU); x.fill(); x.restore();
    }) });
  layer(Sc, { depth: 1, blur: 0, shBlur: 9, shAlpha: .55, amb: amb(1.12), warm: warmAt(1, 680), boost: .3,
    draw: (x) => withFold(x, FOX_Y, rise2(.09), () => drawFox(x, F)),
    emit: (x) => withFold(x, FOX_Y, rise2(.09), () => drawLantern(x, F)) });
  layer(Sc, { depth: 1.32, blur: 10, shBlur: 16, shAlpha: .3, amb: amb(.85), warm: warmAt(1.32, 800, 1, .5),
    draw: (x) => withFold(x, H + 40, rise2(.11), () => {
      place(x, S.grass[1], 260, H + 40, { id: 'g2a', jit: 0 }); place(x, S.grass[0], 1100, H + 50, { id: 'g2b', jit: 0 });
      place(x, S.front[0], 2180, H + 70, { id: 'front2', jit: 0 });
      drawLeaves(x, 5, 'leafB', [-100, 2300, -100, H + 40]);
    }) });
  if (foldA(thB) < 0) backPage(Sc, S.sky2, thB, AMB_COVER, null);
  const fa = Math.max(0, aRow), cover = foldA(thB) < 0 ? 0 : 1;
  reset(Sc); Sc.globalCompositeOperation = 'screen';
  glowAt(Sc, 1, F.lc[0], F.lc[1], 190, [255, 200, 120], .55 * fa * cover);
  if (win) glowAt(Sc, 1, winC[0], winC[1], 210, WIN, .45 * Math.min(1.4, win) * fa * cover);
  if (TQ > T_LAND - .1) glowAt(Sc, .4, 980, moonY, 260, [220, 226, 240], .25 * mI);
  for (let i = 0; i < FLIES2.length; i++) { const [fx, fy] = flyPos(i, TQ, FLIES2); glowAt(Sc, .86, fx - 18, fy - (1 - fa) * (fy - FLY_BASE), 64, FLY, .6 * fa * cover); }
  reset(Sc);
}

// ======================= 一帧 =======================
const SHOTS = [
  { name: '秋夜森林', start: 0, end: T_SWAP, draw: shotForest },
  { name: '山坡小木屋', start: T_SWAP, end: DURATION + 1, draw: shotCabin },
];
function drawFrame(g, t) {
  // 定格：一秒 12 张，格子对齐落点那一拍（落点那一张正好在拍上）
  TQ = T_LAND + Math.floor((t - T_LAND) * POSES + 1e-6) / POSES; POSE = Math.round((TQ - T_LAND) * POSES) + 1000;
  CAMX = camX(TQ);
  const Sc = buf('scene'), sx = reset(g2(Sc)); sx.clearRect(0, 0, LW, LH);
  const shot = SHOTS.find((s) => t >= s.start && t < s.end) || SHOTS[SHOTS.length - 1];
  shot.draw(sx, t);
  // 暗角 + 定格的曝光闪烁（一档亮度停三张再换）
  const vg = sx.createRadialGradient(M + W * .5, M + H * .52, H * .38, M + W * .5, M + H * .52, H * 1.05);
  vg.addColorStop(0, '#FFF'); vg.addColorStop(1, 'rgb(150,140,140)');
  sx.globalCompositeOperation = 'multiply'; sx.fillStyle = vg; sx.fillRect(0, 0, LW, LH); reset(sx);
  const fl = 1 + (rnd('flick' + Math.floor(POSE / 3)) - .5) * .03;
  g.filter = `brightness(${fl.toFixed(3)})`; g.drawImage(Sc, -M, -M); g.filter = 'none';
}

// ======================= 歌词：从书页的缝里拉出来的纸条 =======================
const SLOT_Y = 1032;
let STRIP = null;
function buildStrip() {
  const x0 = g2(canvas(4, 4)); x0.font = `700 58px ${FONT}`; x0.letterSpacing = '6px';
  const tw = x0.measureText(LYRIC).width, w = Math.ceil(tw + 120), h = 112, tab = 30, pad = 12;
  const art = canvas(w + 2 * pad, h + tab + 2 * pad), a = g2(art); a.translate(pad, pad + tab);
  const p = new Path2D(); p.moveTo(0, 6); p.lineTo(w / 2 - 44, 6); p.arc(w / 2, 6, 44, Math.PI, 0); p.lineTo(w, 6); p.lineTo(w, h + 200); p.lineTo(0, h + 200); p.closePath();
  a.fillStyle = '#FBF2DF'; a.fill(p);
  a.fillStyle = 'rgba(150,120,90,.35)'; a.fillRect(16, 18, w - 32, 2); a.fillRect(16, h - 4, w - 32, 2);
  a.save(); a.clip(p); a.strokeStyle = 'rgba(160,130,100,.5)'; a.lineWidth = 2; a.beginPath(); a.arc(w / 2, 6, 32, Math.PI, 0); a.stroke(); a.restore();
  a.fillStyle = '#3A2A22'; a.font = `700 58px ${FONT}`; a.letterSpacing = '6px'; a.textAlign = 'center'; a.textBaseline = 'middle';
  a.fillText(LYRIC, w / 2 + 3, h / 2 + 8);
  reset(a); texFill(a, art.width, art.height, 'strip', .8);
  const out = canvas(art.width, art.height), o = g2(out);
  o.drawImage(grow(art, 2.2, C.cut), 0, 0); o.drawImage(art, 0, 0);
  STRIP = { img: out, sil: grow(art, 1, '#1A1210'), w, h, tab, pad };
}
function overlay(g, t) {
  const L = MV.lyricAt(t, { tail: .3 });
  const sw = STRIP.w, x0 = W / 2 - sw / 2;
  // 书页上的一道缝（一直在）：深色的缝 + 下面一条亮的纸边
  g.fillStyle = 'rgba(30,20,16,.85)'; g.fillRect(x0 - 18, SLOT_Y - 3, sw + 36, 7);
  g.fillStyle = 'rgba(255,240,215,.35)'; g.fillRect(x0 - 18, SLOT_Y + 4, sw + 36, 2);
  if (!L) return;
  const q = Math.floor(t * POSES), out = ease.back(seg(L.age, 0, .5), 1.4) * (1 - ease.inOut(seg(t, L.end + .05, L.end + .3)));
  if (out <= .002) return;
  const pull = (STRIP.h + STRIP.tab + 6) * out, jy = (rnd('sj' + q) - .5) * 1.4, jr = (rnd('sr' + q) - .5) * .004;
  const top = SLOT_Y - pull + jy - STRIP.pad;
  g.save(); g.beginPath(); g.rect(0, 0, W, SLOT_Y - 1); g.clip();
  g.save(); g.globalAlpha = .4; g.filter = 'blur(6px)'; g.drawImage(STRIP.sil, x0 - STRIP.pad + 8, top + 10); g.restore();   // 纸条投在书页上的影子
  g.translate(W / 2, SLOT_Y); g.rotate(jr); g.translate(-W / 2, -SLOT_Y);
  g.drawImage(STRIP.img, x0 - STRIP.pad, top);
  g.restore();
  const lip = g.createLinearGradient(0, SLOT_Y - 26, 0, SLOT_Y); lip.addColorStop(0, 'rgba(30,20,16,0)'); lip.addColorStop(1, 'rgba(30,20,16,.3)');   // 缝口压着纸条的一点暗
  g.fillStyle = lip; g.fillRect(x0 - 2, SLOT_Y - 26, sw + 4, 26);
}

MV.page({ W, H, fps: FPS, duration: DURATION, draw: drawFrame, overlay,
  ready: async () => {
    await MV.font('700 58px "LXGW WenKai"', LYRIC);   // 没下到：出片时报错停下，预览时写在播放条上
    buildSprites(); S.sky2.back = S.sky1.back; buildStrip();
  } });
</script></body></html>
