<!doctype html>
<!--
  蜡笔手绘绘本（crayon picture book）· music-mv 画风样例（5 秒，BPM 120）
  雪夜街角：橘色小螃蟹横着走进来，路灯在第 6 拍（2.5 秒）「啪」地亮起，螃蟹吃一惊、蹦一下，头顶冒爱心，歌词一笔一笔写出来。

  关键画法（给以后读代码学画法的 agent）：
  - 工具：p5.js v2（实例模式）+ p5.brush，所有东西都是笔刷画的，没有平涂、没有滤镜。
    轮廓：ink()，"crayon" 笔（纸纹颗粒 + 压感）。填色：crayon()，brush.hatch() 来回排线（continuous:true 就是蜡笔来回涂），
    两三层不同角度、不同颜色叠出深浅；填色的多边形比轮廓大一点、偏一点（sloppy），所以有的地方涂出线、有的地方留白缝。
  - 大面积（夜空、雪地）不一次涂完：tiles() 切成手掌大小、互相压一点的块，每块方向略不同，压在一起的地方更深（蜡笔叠出来的渐变）。
  - 线条抖动（boil）：轮廓一秒换 12 次种子（种子 = 元素名 + floor(t*12)），顶点也抖 1 px 左右；
    填色、排线的种子固定（只用元素名），所以填色不闪。螃蟹用 p.translate/scale 画在自己的坐标里，排线跟着它走、不会在身上「游动」。
  - 分层：p5.brush 的颜色像颜料会混色（浅色叠在深蓝上变绿），所以一帧在同一张 WebGL 画布上画 5 遍，每遍拷到一张 2D 画布：
      bg     纸底 + 夜空 + 房子 + 雪地（不透明）
      mid    透明底：星星、窗户灯、雪地上的黄排线、灯的光圈、长椅、路灯
      crab   透明底：螃蟹
      front  透明底：雪花、感叹号、爱心
      lyric  透明底：歌词
    物件先用纸色 wash 垫一层不透明的底（base()），再上蜡笔，所以螃蟹跳到夜空前面也不透。
    2D 上按顺序 source-over 叠起来＝蜡笔一层盖一层（黄蜡盖在蓝蜡上还是黄的，不会混成绿）。
    别在一帧里来回 brush.load(另一块画布)：p5.brush 2.2.3 会把颜色串到别的笔画上，所以这里是「同一块画布画多遍」。
  - 灯光：亮的那一下主要靠蜡笔画（黄色光圈和放射线、雪地上的黄排线、螃蟹和长椅朝灯一侧的黄高光、影子往左拉长），
    再在 2D 上用 'lighter' 加一点暖光（加色，不用浅色笔刷去「涂亮」）。
  - 纸：暖白画纸，开场生成一次（固定种子的值噪声 + 竖向细纸纹 + 纤维），最后整张 multiply。
  - 歌词：字的笔画中线取自 hanzi-writer-data（Make Me a Hanzi 的数据，Arphic Public License，jsDelivr 按字取 JSON），
    用自定义的 "wax" 蜡笔（比自带的 crayon 散得少，字才认得清）沿中线按笔顺画，一个词一个词写出来；逗号自己画一笔。
  - 镜头：1.0 → 1.05 很慢地推近，一秒走 4 格（画面边上每格约 1 像素，看不出台阶；中间几帧背景不动，GIF 小一些）。
  - 画面只由 t 决定：没有 Math.random()，不存上一帧。1280×720 一帧约 0.7–1.2 秒。
-->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js"></script>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #F4EBDA; }
  canvas { position: absolute; left: 0; top: 0; }
  #out { z-index: 2; }
</style>
</head><body><script>
const W = 1280, H = 720, DURATION = 5, BPM = 120, BEAT = 60 / BPM, BOIL = 12;
const LIGHT_ON = 5 * BEAT;                   // 第 6 拍（第一拍在 0 秒）= 2.5 秒
const LYRIC = "把今天的星星，都留给你";
const WORDS = [["把", 3.0], ["今天的", 3.2], ["星星，", 3.45], ["都", 3.72], ["留给你", 3.88]];

const PAL = {
  paper: "#FFFDF6",
  navy: "#22346E", navyDeep: "#151F48", skyLow: "#2F4A8C",
  ink: "#251E36",
  snowShade: "#B4BEDC", snowShade2: "#8F9CCB",
  lamp: "#FFCF3F", lampDeep: "#F6A626", lampPale: "#FFE98E",
  win: "#F5B947", winDeep: "#E98F2E",
  iron: "#323856", ironLite: "#59618A",
  wood: "#A8693A", woodDark: "#6E3F22",
  crab: "#EE6B3B", crabDeep: "#C84528", belly: "#FCD3A2", blush: "#F38B7B", crabInk: "#5B2316",
  heart: "#E2434A", heartDeep: "#B32638", lyric: "#20306B",
  pine: "#2F5E4E", pineDark: "#1D4034", trunk: "#6A4128",
};

let T = 0, P;
const layers = {};       // 每一遍画完拷到这里的 2D 画布
let out, paperTex, glowSprite;

// ---------- 随机数：只由「元素名 (+ 抖动序号)」决定 ----------
function hash(s) { let h = 2166136261; for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(key) { let a = hash(key); return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const boilIdx = () => Math.floor(T * BOIL + 1e-6);
function seed(key, boil) { const h = hash(boil ? key + ":" + boilIdx() : key); P.randomSeed(h); P.noiseSeed(h); }

// ---------- 小工具 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };
const easeOutBack = (u) => { u = clamp(u); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function ell(cx, cy, rx, ry, n = 30, rot = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    pts.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); }
  return pts;
}
function subdiv(pts, step = 24, closed = true) {          // 长边切成小段，抖动时才像手画的线
  const outP = [], n = pts.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const a = pts[i], b = pts[(i + 1) % n]; const L = Math.hypot(b[0] - a[0], b[1] - a[1]); const k = Math.max(1, Math.round(L / step));
    for (let j = 0; j < k; j++) outP.push([lerp(a[0], b[0], j / k), lerp(a[1], b[1], j / k)]);
  }
  if (!closed) outP.push(pts[n - 1]);
  return outP;
}
const rectPts = (x, y, w, h) => subdiv([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);
// 大面积不一次涂完：切成一块块手掌大小、互相压一点的不规则四边形，每块方向略不同（真的蜡笔涂天就是这样一片一片的）
function tiles(key, x0, y0, x1, y1, tw, th) {
  const r = rng(key), res = []; let row = 0;
  for (let y = y0; y < y1; y += th, row++) for (let x = x0 - (row % 2) * tw * 0.5; x < x1; x += tw) {
    const ex = tw * (0.12 + r() * 0.18), ey = th * (0.12 + r() * 0.2), j = () => (r() - 0.5) * Math.min(tw, th) * 0.35;
    res.push(subdiv([[x - ex + j(), y - ey + j()], [x + tw + ex + j(), y - ey + j()], [x + tw + ex + j(), y + th + ey + j()], [x - ex + j(), y + th + ey + j()]], 50));
  }
  return res;
}
function wobble(key, pts, amp) { const r = rng(key); return pts.map(([x, y]) => [x + (r() - 0.5) * 2 * amp, y + (r() - 0.5) * 2 * amp]); }
function centroid(pts) { let x = 0, y = 0; pts.forEach((p) => { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; }
// 涂色的范围：比轮廓大一点、整体偏一点 → 有的地方涂出线、有的地方留白缝
function sloppy(key, pts, amp) {
  const r = rng(key + "#slop"); const [cx, cy] = centroid(pts); const dx = (r() - 0.5) * amp * 1.4, dy = (r() - 0.5) * amp * 1.4;
  return pts.map(([x, y]) => { const d = Math.hypot(x - cx, y - cy) || 1; const e = amp * (0.2 + r() * 0.6);
    return [x + dx + ((x - cx) / d) * e, y + dy + ((y - cy) / d) * e]; });
}

// ---------- 画法 ----------
// 轮廓：蜡笔线，每 1/12 秒换种子、顶点抖一点
function ink(key, pts, o = {}) {
  seed(key, true);
  if (pts.length < 3) pts = subdiv(pts, 5, false);          // brush.spline 至少要 3 个点，两点的短线切开再画
  const r = rng(key + ":" + boilIdx()); const a = o.boil ?? 0.9;
  const q = pts.map(([x, y]) => [x + (r() - 0.5) * 2 * a, y + (r() - 0.5) * 2 * a]);
  brush.noFill(); brush.noHatch(); brush.noWash();
  brush.set(o.brush || "crayon", o.color || PAL.ink, o.w ?? 1.2);
  if (o.closed) q.push(q[0]);
  brush.spline(q, o.curv ?? 0.4);
}
// 填色：蜡笔排线，种子固定
function crayon(key, pts, color, o = {}) {
  seed(key, false);
  brush.noStroke(); brush.noFill(); brush.noWash();
  brush.hatch(o.dist ?? 5, o.angle ?? 0.7, { rand: o.rand ?? 0.25, continuous: o.cont ?? true, gradient: o.grad ?? false });
  brush.hatchStyle(o.brush || "crayon", color, o.w ?? 2);
  brush.polygon(o.slop === 0 ? pts : sloppy(key, pts, o.slop ?? 3));
  brush.noHatch();
}
// 不透明的纸色底（盖住后面的蜡笔，物件才不透明）
function base(pts, color = PAL.paper) { brush.noStroke(); brush.noHatch(); brush.noFill(); brush.wash(color, 255); brush.polygon(pts); brush.noWash(); }
function blob(key, pts, color) { seed(key, false); brush.noStroke(); brush.noHatch(); brush.noFill(); brush.wash(color, 255); brush.polygon(pts); brush.noWash(); }

// ---------- 时间轴 ----------
const lit = () => T >= LIGHT_ON - 1e-6;
function lightK() {                         // 灯的亮度：2.5 秒啪一下最亮，再落到 1
  if (!lit()) return 0;
  const u = T - LIGHT_ON; return u > 0.6 ? 1 : 1 + 0.35 * Math.exp(-u * 9);
}
// 镜头很慢地推近 1.0 → 1.05，一秒走 4 格（画面边上每格约 1 像素，看不出台阶），格子中间的帧背景不动，GIF 压得小
const CAM_STEP = 1 / 4;
function camScale() { const t = Math.floor(T / CAM_STEP + 1e-6) * CAM_STEP; return 1 + 0.05 * clamp(t / (DURATION - CAM_STEP)); }
const CAM_C = [800, 455];
function camera() { const s = camScale(); P.translate(CAM_C[0], CAM_C[1]); P.scale(s); P.translate(-CAM_C[0], -CAM_C[1]); }
function toScreen(x, y) { const s = camScale(); return [(x - CAM_C[0]) * s + CAM_C[0], (y - CAM_C[1]) * s + CAM_C[1]]; }

// ---------- 场景布置 ----------
const GROUND = 458;                          // 远处地平线（房子落脚）
const LAMP = { x: 945, base: 618, top: 178 };
const BENCH = { x: 1008, w: 232, seat: 548, back: 478, foot: 612 };
const CRAB_Y = 618;                          // 螃蟹脚踩的雪地
const CRAB_X0 = -170, CRAB_X1 = 745;

const HOUSES = [
  { k: "h1", x: 18, w: 170, h: 128, roofH: 74, wall: "#C9654A", roof: "#5A3E5E", door: 0.62, wins: [[0.12, 0.22, 0.3, 0.3]], chim: 0.72 },
  { k: "h2", x: 205, w: 128, h: 168, roofH: 62, wall: "#E2B04F", roof: "#7C3A2D", door: 0.18, wins: [[0.5, 0.14, 0.34, 0.22], [0.5, 0.52, 0.34, 0.22]], chim: 0.25 },
  { k: "h3", x: 1030, w: 130, h: 118, roofH: 66, wall: "#6E9A94", roof: "#3F4A6E", door: 0.55, wins: [[0.12, 0.24, 0.3, 0.3]], chim: 0.7 },
  { k: "h4", x: 1166, w: 150, h: 156, roofH: 64, wall: "#D98E7C", roof: "#5A3E5E", door: 0.12, wins: [[0.52, 0.14, 0.34, 0.22], [0.52, 0.52, 0.34, 0.22]], chim: 0.3 },
];
const FAR = [ // 远处的小房子，矮一点、颜色淡一点
  { k: "f1", x: 372, w: 92, h: 62, roofH: 40, wall: "#B58BA0", roof: "#3F4A6E", wins: [[0.2, 0.25, 0.26, 0.32], [0.56, 0.25, 0.26, 0.32]] },
  { k: "f2", x: 474, w: 76, h: 84, roofH: 36, wall: "#8FA9C9", roof: "#5A3E5E", wins: [[0.3, 0.2, 0.4, 0.26]] },
  { k: "f3", x: 560, w: 96, h: 56, roofH: 38, wall: "#C99A6B", roof: "#4B3A55", wins: [[0.36, 0.3, 0.3, 0.34]] },
];
const PINES = [{ k: "p1", x: 352, s: 0.88 }, { k: "p3", x: 1012, s: 0.6 }];

function houseGeom(hs, scale = 1) {
  const g = {}; const y0 = GROUND + 2; const top = y0 - hs.h;
  g.wall = wobble(hs.k + "w", rectPts(hs.x, top, hs.w, hs.h), 1.6);
  const ov = 12 * scale;
  g.roof = wobble(hs.k + "r", subdiv([[hs.x - ov, top + 2], [hs.x + hs.w / 2, top - hs.roofH], [hs.x + hs.w + ov, top + 2]]), 1.6);
  // 屋顶上的雪：贴着两条斜边，下沿是波浪
  const peak = [hs.x + hs.w / 2, top - hs.roofH - 5]; const L = [hs.x - ov - 5, top - 2], R = [hs.x + hs.w + ov + 5, top - 2];
  const snow = [L, peak, R]; const n = 9;
  for (let i = n; i >= 0; i--) { const u = i / n; const x = lerp(L[0], R[0], u); const ridge = top - hs.roofH * (1 - Math.abs(u - 0.5) * 2);
    snow.push([x, ridge + 10 * scale + (i % 2 ? 7 : 0) * scale]); }
  g.snow = wobble(hs.k + "s", snow, 1.2);
  g.wins = (hs.wins || []).map(([u, v, ww, hh], i) => wobble(hs.k + "win" + i, rectPts(hs.x + u * hs.w, top + v * hs.h, ww * hs.w, hh * hs.h), 1.0));
  g.winRects = (hs.wins || []).map(([u, v, ww, hh]) => [hs.x + u * hs.w, top + v * hs.h, ww * hs.w, hh * hs.h]);
  if (hs.door !== undefined) { const dw = 0.24 * hs.w, dh = 0.46 * hs.h; g.door = wobble(hs.k + "d", rectPts(hs.x + hs.door * hs.w, y0 - dh, dw, dh), 1.0); g.knob = [hs.x + hs.door * hs.w + dw * 0.78, y0 - dh * 0.48]; }
  if (hs.chim !== undefined) { const cx = hs.x + hs.chim * hs.w; const cy = top - hs.roofH * (1 - Math.abs(hs.chim - 0.5) * 2) ; g.chim = wobble(hs.k + "c", rectPts(cx - 12, cy - 34, 24, 40), 1); g.chimSnow = ell(cx, cy - 36, 16, 6, 14); }
  return g;
}

// ===================== bg：纸 + 夜空 + 房子 + 雪地 =====================
function drawSky() {
  // 一片一片涂，方向各有点不同，压在一起的地方更深 —— 像真的拿蜡笔涂天
  const r = rng("skyAng");
  tiles("skyT", -40, -40, 1330, 480, 250, 175).forEach((pp, i) => crayon("sky" + i, pp, PAL.navy, { dist: 5, angle: -0.62 + r() * 0.34, rand: 0.35, w: 2.4, slop: 0 }));
  // 上面再压一层更深的，越往下越稀（蜡笔叠出来的渐变，不用平滑渐变）
  tiles("skyD", -40, -40, 1330, 400, 380, 120).forEach((pp, i) => { const cy = centroid(pp)[1];
    crayon("skyD" + i, pp, PAL.navyDeep, { dist: 7 + Math.max(0, cy) * 0.032, angle: 0.3 + r() * 0.3, rand: 0.45, w: 2.0, slop: 0 }); });
  tiles("skyL", -40, 330, 1330, 480, 300, 70).forEach((pp, i) => crayon("skyL" + i, pp, PAL.skyLow, { dist: 9, angle: -0.25 + r() * 0.2, rand: 0.5, w: 1.8, slop: 0 }));
}
function drawHouse(hs, far) {
  const g = houseGeom(hs);
  base(g.wall); base(g.roof);
  crayon(hs.k + "wallF", g.wall, hs.wall, { dist: far ? 4.5 : 5, angle: 0.95, rand: 0.3, w: 2.1, slop: 2.5 });
  crayon(hs.k + "wallF2", g.wall, hs.wall, { dist: 11, angle: -0.6, rand: 0.4, w: 1.6, slop: 1 });
  crayon(hs.k + "roofF", g.roof, hs.roof, { dist: 4.2, angle: -0.35, rand: 0.3, w: 2.2, slop: 2.5 });
  if (g.door) { crayon(hs.k + "doorF", g.door, "#5E3A2A", { dist: 3.8, angle: 1.2, w: 2, slop: 1.5 }); }
  if (g.chim) { base(g.chim); crayon(hs.k + "chimF", g.chim, "#9B4B3A", { dist: 4, angle: 0.9, w: 2, slop: 1.5 }); }
  // 窗户先挖成纸色，灯光在 mid 里涂
  g.wins.forEach((wp) => base(wp));
  base(g.snow); crayon(hs.k + "snowSh", g.snow.slice(3), PAL.snowShade, { dist: 6, angle: 0.2, w: 1.4, rand: 0.4, slop: 0 });
  if (g.chim) { base(g.chimSnow); }
  const lw = far ? 1.05 : 1.4;
  ink(hs.k + "wallL", g.wall, { closed: true, w: lw, curv: 0.1 });
  ink(hs.k + "roofL", g.roof, { closed: false, w: lw, curv: 0.1 });
  ink(hs.k + "snowL", g.snow, { closed: true, w: lw * 0.85, curv: 0.5, color: "#3B3F68" });
  if (g.door) { ink(hs.k + "doorL", g.door, { closed: true, w: lw, curv: 0.1 }); ink(hs.k + "knob", ell(g.knob[0], g.knob[1], 2.5, 2.5, 6), { closed: true, w: 0.8, color: "#F2C14E" }); }
  if (g.chim) { ink(hs.k + "chimL", g.chim, { closed: true, w: lw * 0.9, curv: 0.1 }); ink(hs.k + "chimSL", g.chimSnow, { closed: true, w: 0.8, color: "#3B3F68" }); }
}
function pineGeom(pn) {
  const s = pn.s, x = pn.x, y = GROUND + 4;
  const tiers = [[0, 92, 70], [46, 74, 58], [86, 54, 46]].map(([dy, hw, hh], i) => {
    const by = y - 14 * s - dy * s; return wobble(pn.k + "t" + i, subdiv([[x - hw / 2 * s, by], [x, by - hh * s - 22 * s], [x + hw / 2 * s, by]], 18), 1.4); });
  const trunk = wobble(pn.k + "tr", rectPts(x - 7 * s, y - 18 * s, 14 * s, 20 * s), 0.8);
  const snows = [[0, 92], [46, 74], [86, 54]].map(([dy, hw], i) => { const by = y - 14 * s - dy * s; return ell(x + (i % 2 ? 6 : -6) * s, by - 4 * s, hw * 0.28 * s, 5 * s, 14); });
  return { tiers, trunk, snows };
}
function drawPine(pn) {
  const g = pineGeom(pn);
  base(g.trunk); crayon(pn.k + "trF", g.trunk, PAL.trunk, { dist: 3.5, angle: 1.4, w: 1.8, slop: 1 }); ink(pn.k + "trL", g.trunk, { closed: true, w: 0.9, curv: 0.1 });
  g.tiers.slice().reverse().forEach((tp, j) => { const i = 2 - j; base(tp);
    crayon(pn.k + "tF" + i, tp, PAL.pine, { dist: 4, angle: 0.8 + i * 0.3, w: 2, slop: 2 });
    crayon(pn.k + "tD" + i, tp.slice(Math.floor(tp.length / 2)), PAL.pineDark, { dist: 6, angle: -0.5, w: 1.6, slop: 0 });
    ink(pn.k + "tL" + i, tp, { closed: true, w: 0.95, curv: 0.15 }); });
  g.snows.forEach((sp, i) => { base(sp); ink(pn.k + "sL" + i, sp, { closed: true, w: 0.7, color: "#3B3F68" }); });
}

// ===================== crab =====================
function crabX(t) {                          // 匀速横着走，最后 0.4 秒减速停下
  const u = clamp(t / 2.0), a = 0.8, v = 1 / (a + (1 - a) / 2);
  const s = u < a ? v * u : v * a + v * (u - a) - (v * (u - a) * (u - a)) / (2 * (1 - a));
  return lerp(CRAB_X0, CRAB_X1, s);
}
function crabPose(t) {
  const p = { air: 0, x: crabX(t), lift: 0, sx: 1, sy: 1, look: [0, 0], stalk: 0, pupil: 6, clawUp: 0, clawOpen: 0.15, legPh: 0, walk: 0, mouth: "smile", lean: 0, surprise: 0 };
  if (t < 2.0) { // 走
    // 腿按时间倒腾：一秒 3 个循环＝每 4 帧一轮（12 fps 下按距离算会和帧率打架，腿看着不动）
    p.legPh = t * Math.PI * 2 * 3; p.walk = clamp((2.0 - t) / 0.3);
    p.lift = Math.abs(Math.sin(p.legPh)) * 4 * p.walk; p.lean = Math.sin(p.legPh) * 0.035 * p.walk; p.look = [1, 0];
    p.clawOpen = 0.15 + 0.15 * Math.sin(p.legPh * 0.5);
  } else if (t < LIGHT_ON) { // 左看看、右看看、抬头看灯
    const u = t - 2.0;
    if (u < 0.15) { p.look = [-1, 0.1]; p.lean = -0.04; } else if (u < 0.3) { p.look = [1, 0.1]; p.lean = 0.04; } else { p.look = [0.55, -1]; p.stalk = 5; p.lean = 0.02; }
  } else if (t < 2.7) { // 吃一惊
    const u = (t - LIGHT_ON) / 0.2; p.surprise = 1; p.look = [0.4, -1]; p.pupil = 3.6; p.stalk = 14 * easeOutBack(u); p.mouth = "o";
    p.lift = 12 * Math.sin(Math.PI * clamp(u * 1.4)); p.air = 1; p.sy = 1 + 0.06 * Math.sin(Math.PI * clamp(u * 1.4)); p.sx = 2 - p.sy; p.clawOpen = 0.6; p.clawUp = 0.25;
  } else if (t < 2.86) { // 预备：蹲
    const u = (t - 2.7) / 0.16; p.look = [0.3, -0.6]; p.stalk = lerp(14, 4, u); p.sy = 1 - 0.16 * smooth(u); p.sx = 1 + 0.1 * smooth(u); p.mouth = "smile"; p.clawUp = 0.3; p.surprise = 0.5;
  } else if (t < 3.22) { // 腾空
    const u = (t - 2.86) / 0.36; p.lift = 78 * 4 * u * (1 - u); p.air = 1; p.sy = 1 + 0.08 * (1 - Math.abs(u - 0.5) * 2) * (u < 0.5 ? 1.2 : 0.6); p.sx = 2 - p.sy;
    p.clawUp = smooth(u * 2.5); p.clawOpen = 0.55; p.look = [0.2, -0.8]; p.stalk = 6 - 10 * (u < 0.5 ? 0 : (u - 0.5)); p.mouth = "open"; p.legPh = u * 3; p.walk = 0.6;
  } else if (t < 3.5) { // 落地回弹
    const u = (t - 3.22) / 0.28; const sq = Math.sin(Math.PI * clamp(u * 1.6)) * Math.exp(-u * 2.2);
    p.sy = 1 - 0.15 * sq + 0.04 * Math.sin(u * 9) * (1 - u); p.sx = 1 + 0.1 * sq; p.clawUp = 1; p.clawOpen = 0.5; p.look = [0.2, -0.8]; p.mouth = "open"; p.stalk = -4 * sq;
  } else { // 开心：钳子举着、一开一合，身体轻轻晃
    const u = t - 3.5; p.clawUp = 1; p.clawOpen = 0.35 + 0.3 * Math.abs(Math.sin(u * 7)); p.lean = 0.03 * Math.sin(u * 5.5); p.lift = 2 * Math.abs(Math.sin(u * 5.5));
    p.look = [0.25, -0.75]; p.mouth = "open"; p.stalk = 2 * Math.sin(u * 5.5);
  }
  return p;
}

// ===================== 歌词：一笔一笔用蜡笔写 =====================
// 字的笔画中线来自 hanzi-writer-data（Make Me a Hanzi 的数据，jsDelivr 上按字取 JSON），每一笔用蜡笔沿中线画，
// 像真的拿蜡笔写字：笔画按笔顺出现，线条每 1/12 秒抖一下。逗号自己画一小笔。
const MED = {};
const LY = { x: 34, top: 648, size: 56, gap: 2 };
function lyricChars() {      // 每个字：出现的时间、位置、固定的手写歪斜
  const res = []; let i = 0; const r = rng("lyricHand");
  WORDS.forEach(([w, t0]) => { [...w].forEach((ch, j) => { res.push({ ch, t: t0 + j * 0.09, i, rot: (r() - 0.5) * 0.08, dy: (r() - 0.5) * 6, sc: 0.96 + r() * 0.08 }); i++; }); });

function makePaper() {

    const tone = 0.965 + (m - 0.5) * 0.05 - Math.max(0, tooth - 0.66) * 0.16;

  // 窗户的灯微微闪
  ctx.globalCompositeOperation = "lighter";
  [...FAR, ...HOUSES].forEach((hs) => houseGeom(hs).winRects.forEach(([x, y, w, h], i) => { const fl = 0.5 + 0.5 * Math.sin(Math.floor(T * 6) / 6 * (5 + i) + hash(hs.k) % 7); const [sx, sy] = toScreen(x + w / 2, y + h / 2); const R = Math.max(w, h) * 1.3 * camScale();
    ctx.globalAlpha = 0.1 + 0.08 * fl; ctx.drawImage(glowSprite, sx - R, sy - R, 2 * R, 2 * R); }));
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(lyr, 0, 0);
  // 笔画数据没取到的字（断网等），退回系统字体
  ctx.fillStyle = PAL.lyric; ctx.font = `${LY.size * 0.9}px "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  LCH.forEach((c) => { if (T >= c.t && c.ch !== "，" && !MED[c.ch]) ctx.fillText(c.ch, LY.x + c.i * (LY.size + LY.gap) + LY.size / 2, LY.top + LY.size / 2 + c.dy); });
  // 纸：整张 multiply 一层暖白画纸
  ctx.globalCompositeOperation = "multiply"; ctx.drawImage(paperTex, 0, 0); ctx.globalCompositeOperation = "source-over";
  return out.toDataURL("image/png");
}

window.sceneReady = new Promise((resolve) => {
  new p5((p) => {
    P = p;
    p.setup = async () => {
      p.createCanvas(W, H, p.WEBGL); p.pixelDensity(1); p.noLoop();
      brush.instance(p); brush.load(); brush.scaleBrushes(1.6);
      // 写字用的蜡笔：比自带的 crayon 散得少一点，字才认得清
      brush.add("wax", { type: "default", weight: 0.62, scatter: 0.75, sharpness: 0.7, grain: 1.0, opacity: 155, spacing: 0.14, pressure: [1.15, 0.85], rotate: "natural" });
      out = document.createElement("canvas"); out.width = W; out.height = H; out.id = "out"; document.body.appendChild(out);
      makePaper(); makeGlow();
      await Promise.all([...new Set(LYRIC.replace("，", ""))].map(async (ch) => {
        try { const res = await fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${encodeURIComponent(ch)}.json`); MED[ch] = (await res.json()).medians; }
        catch (e) { console.warn("笔画数据没取到，这个字用系统字体：" + ch); }
      }));
      resolve();
    };
    p.draw = () => { DRAW(); };
  });
});
window.renderAt = renderAt;
</script></body></html>
