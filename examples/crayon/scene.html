<!--
  蜡笔 / 水彩绘本（p5.js v2 + p5.brush）· 雨后的小巷：穿黄雨靴的小女孩和小狗踩水坑，镜头推进水坑里的纸船，水彩晕开落到近景，
  小狗凑过来闻纸船，天放晴，彩虹一笔一笔涂出来（6 秒，BPM 84）
  示范场景只为展示画法，做 MV 时场景、角色、构图从你的歌来。

  关键画法（给以后读代码学画法的 agent）：
  - 工具：p5.js v2（实例模式，页面里不写全局的 draw / setup / preload）+ p5.brush 2.2.3，一切都是笔刷画的。
    轮廓 ink()：蜡笔线（"crayon" 笔）。蜡笔填色 crayon()：brush.hatch + hatchStyle，continuous 来回涂。
    水彩填色 water()：brush.fill + fillBleed + fillTexture，同一块颜色叠 2–3 遍（每遍换种子）才实，一遍很淡。不透明的底 base()：brush.wash(颜色, 255)。
  - 两种填色分工：湿的东西用水彩（天、水坑、近景的水面、云的阴影、纸船），干的东西用蜡笔排线（墙、雨衣、雨靴、小狗、彩虹）。
    蜡笔两三层不同角度：墙是 5.5 和 11 两层再加一条墙脚的深色；雨衣、靴子是一层主色 + 一层深色换个角度；
    填色范围比轮廓大一点、整体偏一点（sloppy），所以有的地方涂出线、有的地方露白缝。
    大片的天切成手掌大小、互相压一点的块，每块角度略不同（skyTiles），而且很淡很稀：整片长直线、排得密，看着像在下雨。
    地面先垫一层灰蓝的底再晕水彩：水彩一遍很淡，直接涂在纸上地面会发白，石头缝反倒成了深色。
    彩虹每一道是沿着弧来回涂的锯齿线，切成一小笔一小笔（每笔种子固定，涂上去就不再变），再错开半格、浅一点涂第二层。
  - 线条抖、填色不抖：轮廓一秒换 12 次种子、顶点抖 1 px 左右（4 版轮流：floor(t*12) % 4，静背景才能缓存）；填色、排线的种子只用元素名。
  - 混色：p5.brush 的颜色像颜料会混色（浅色叠在深色上变脏、黄叠在蓝上变绿）。东西先垫一层不透明的底（base）再上蜡笔；
    白云不能用水彩「涂白」（水彩是透明的），先垫不透明的白，下半边再晕一层灰蓝。
  - 光和高光：最后在 2D 上用 'lighter' 加色叠（小巷尽头亮着、水面一闪一闪、踩下去那一下水面一亮、云散开后太阳越来越亮），不用浅色笔刷去「涂亮」。
  - 纸：开页面生成一次（固定种子的值噪声 + 竖向细纸纹 + 纤维），在 overlay 里整张 multiply。
  - 一帧怎么画、怎么缓存：p5 画布按出图的像素开（1280×720 出图就开 1280×720），p.scale(KX) 后按 1920×1080 的坐标画。
    每个镜头分「静的」和「动的」：静的（天、墙、地、水坑、近景的天和水）每版抖动只画一次，存成 p5.Image；
    之后每帧先 p.image 贴上它，再在 p5 里画动的东西——动的笔画会和底下真实的颜色混色，和一次画完一模一样。
  - 镜头推拉在 p5 里矢量重画（每个镜头 cam = {x, y, z}，p.translate / p.scale），不在 2D 里放大位图。
    轮廓线宽、抖动按屏幕算（除以 z），推近时线不跟着变粗；填色跟着世界走。
    纸船在两个镜头里是同一个画法：几何按船长缩放、线宽按屏幕算、填色只用水彩（水彩的纹理按形状大小算，放大缩小一个样），
    推进时两个镜头里的船位置、大小、线宽都对得上（两个镜头叠在一起看只有一条船），所以船一直在、不跳。
  - 转场（落点：第 4 拍 2.857 秒）：拍前 0.62 秒起步，镜头 1 推向水坑里的纸船（倍数对数插值放大 2.1 倍，船在画面上平移到近景的位置）；
    拍前 0.5 秒从纸船那里晕开一圈水彩，越晕越快，拍上正好盖满。圈里是近景：近景的镜头锁着纸船（船的位置、大小和镜头 1 里一样），
    所以圈刚出现时圈里圈外都是同一条船、同样颜色的水。圈的形状是一圈圆鼓包、之间尖凹口（水彩渗开的菜花边），
    边上三道蜡笔线（外深里浅；晕得小时线也细，不然会把船糊住）。被圈盖住的镜头 1 东西不画、圈外的镜头 2 东西不画，省一半时间。
    近景要比画面画大一截：转场时它是缩小着从水里晕开的（算过整段转场里看得见的范围，四周再留一点）。
  - 歌词：window.LYRICS + MV.lyricAt（每半拍一个字），字的笔画中线取自 hanzi-writer-data（Make Me a Hanzi 的数据），
    用自定义的 "wax" 蜡笔（比自带的 crayon 散得少，字才认得清）沿中线按笔顺画。歌词单独画在一张白底的 p5 画面上，
    在 overlay 里 multiply 叠到最上层：白的地方乘上去不变，字边上淡的笔触也不会冒白边；不跟镜头动。写完以后每版抖动缓存一张。
  - 坑：
    · p5.brush 2.2.3 判断笔尖出没出画布，用的是缩放前的坐标（当一个单位就是一个像素）。用 p.scale 画（缩小出图、推拉）时，
      超出画布 1.5 倍范围的那段笔画原地不动、笔触全堆成一团，从外面起笔的排线整条不画。这里把判断关掉：brush.Position.prototype.isInCanvas = () => true
    · 透明画布上的笔画，淡的边会变成不透明的白点（p5.brush 混色时把透明当成白纸）：要叠到别的画面上的层，要么像歌词那样白底 multiply，
      要么像这里每帧先贴静背景再画。
    · 别在一帧里来回 brush.load(另一块画布)：p5.brush 2.2.3 会把颜色串到别的笔画上。这里始终是同一块画布画多遍。
    · brush.spline 只给两个点时什么都不画：ink() 遇到两个点会先切成小段。

  时间线（BPM 84，第 0 拍在 0 秒，一拍 0.714 秒）：
    第 0 拍：小巷远景，女孩站在大水坑那头，小狗在旁边摇尾巴；屋檐、落水管、晾的衣服一直在滴水，落进墙脚的小水坑漾开
    第 1 拍（0.714）：女孩蹲下、起跳，落在拍上：溅起水冠和水珠、水面一亮、水波一圈圈散开；歌词从这一拍起每半拍写一个字（3.53 秒写完）
    第 2 拍（1.429）：小狗跳进去，落在拍上，又溅一下，女孩眯眼笑
    第 3 拍（2.143）：两个一起跳，溅起最大的一下。三次的水波按 1.6 米/秒走到纸船那里，船各晃一下（1.39、1.98、2.69、2.82 秒）
    2.237 镜头起步推向纸船，2.357 从纸船晕开水彩；第 4 拍（2.857）晕满、落到近景
    近景：小狗从右边探进来（2.90–3.66），云往两边散开、太阳越来越亮（到 4.5）；第 5 拍起每半拍嗅一下纸船（鼻子一探，冒几道短线）
    第 5、5.5、6、6.5、7 拍（3.571、3.929、4.286、4.643、5.0）：彩虹从外到里一道一道涂出来，每道 0.34 秒，水里的倒影跟着出来
  速度：开页面约 5 秒（下 p5、p5.brush 和 8 个字的笔画数据，生成纸纹）。
    1920×1080：镜头 1 一帧约 0.35 秒、镜头 2 约 0.8–0.9 秒、转场那几拍约 5.8 秒（两个镜头都现画）；每版抖动的静背景第一次用到时多画一次（镜头 1 约 3.8 秒、镜头 2 约 3 秒）。
    1280×720：镜头 1 约 0.3 秒、镜头 2 约 0.5–0.8 秒、转场约 3.6 秒；72 帧的 GIF 平均 1.19 秒一帧。960×540、30 fps 的草稿 180 帧平均 0.83 秒一帧。
  出 GIF：node scripts/render_frames.mjs --page examples/crayon/scene.html --fps 12 --width 1280 --height 720 --format png --out <目录>
    ffmpeg -framerate 12 -i <目录>/%06d.png -vf "scale=640:360:flags=lanczos,split[a][b];[a]palettegen=max_colors=144:stats_mode=full[p];[b][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" -loop 0
    约 4.4 MB。轮廓一直在抖，整帧都在变；stats_mode=diff 时最后才出来的彩虹颜色发灰，用 full。
  外部资源（jsDelivr）：p5@2.3.3（LGPL-2.1）、p5.brush@2.2.3（MIT）、hanzi-writer-data@2.0.1（汉字笔顺数据，Arphic Public License）。

<script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js"></script>

<style>html, body { margin: 0; overflow: hidden; background: #000; }</style>
</head><body><script>
// ═════════ 基本参数、时间线（所有时刻都从拍子算）═════════
const W = 1920, H = 1080, FPS = 30, BPM = 84, DURATION = 6;
const BOIL = 12, BOILK = 4;                        // 线条一秒抖 12 次；4 版抖动轮流用，静的背景每版只画一次
MV.tempo(BPM, 0);
const { clamp, lerp, seg, ease } = MV;
const TAU = Math.PI * 2, BEAT = 60 / BPM, bt = (n) => MV.beatTime(n);
const T_GIRL = bt(1), T_PUP = bt(2), T_BOTH = bt(3);    // 三次踩水：女孩、小狗、一起
const T_LAND = bt(4);                                    // 转场落点：近景
const T_PUSH = T_LAND - 0.62, T_BLOOM = T_LAND - 0.5;    // 推进起步、水彩晕开起步
const T_BANDS = [5, 5.5, 6, 6.5, 7].map(bt), BAND_DUR = 0.34;   // 彩虹五笔：每笔从这半拍起涂
window.PLAN = [+T_LAND.toFixed(3)];
window.LYRICS = [[bt(1), DURATION, '一起把雨踩成彩虹']];

const PAL = {
  paper: '#FBF6EA', ink: '#33283A', inkSoft: '#5B6680',
  sky1: '#CCDCE8', skyWarm: '#F4EAD2', cloud: '#F6F6F2', cloudSh: '#B4C3D3', cloudLine: '#8DA1B8',
  ochre: '#E2AE5E', ochreDeep: '#C2893F', pink: '#E8A48C', pinkDeep: '#C77C68',
  terra: '#D9785A', terraDeep: '#B45A42', stone: '#DDD0B6', stoneDeep: '#B7A688', slate: '#94AFC2', slateDeep: '#6F8EA6',
  roof: '#545D72', teal: '#3E8A87', glass: '#3B5577', door: '#4F8C7C', wood: '#9A5536',
  leaf: '#62A05A', leafDeep: '#3F7A45', pot: '#C8643F', flower: '#E8506A',
  ground: '#AEB9C6', groundDeep: '#8796AB', cobble: '#7D8AA0',
  water: '#BFDDF1', waterDeep: '#92C0E2', waterLine: '#50708F', ripple: '#7EA6CA',
  coat: '#E04B3A', coatDeep: '#B13427', boot: '#F6C22D', bootDeep: '#DE951C', tights: '#3C4B80',
  skin: '#F8D5BA', blush: '#F0958A', hair: '#4B2F25', tie: '#E8506A',
  pup: '#F4E6CC', pupDeep: '#D6BB93', pupEar: '#B9794A', nose: '#2A1F22', collar: '#D8433A',
  boat: '#FFFDF6', boatSh: '#C3D3E3', stripe: '#E0503E', boatLine: '#38425A',
  sky2: '#A3CDEB', sun: '#F7C744', sunDeep: '#F0A23A',
  rainbow: ['#E5483A', '#F28C38', '#F5C73A', '#6DB46A', '#4C8BD2'],
  lyric: '#22306B',
};

// ═════════ 小工具 ═════════
function ell(cx, cy, rx, ry, n = 28, rot = 0) {
  const c = Math.cos(rot), s = Math.sin(rot), pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; pts.push([cx + x * c - y * s, cy + x * s + y * c]); }
  return pts;
}
function subdiv(pts, step = 24, closed = true) {                 // 长边切成小段，抖动时才像手画的线
  const out = [], n = pts.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const a = pts[i], b = pts[(i + 1) % n], k = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let j = 0; j < k; j++) out.push([lerp(a[0], b[0], j / k), lerp(a[1], b[1], j / k)]);
  }
  if (!closed) out.push(pts[n - 1]);
  return out;
}
const centroid = (pts) => { let x = 0, y = 0; for (const p of pts) { x += p[0]; y += p[1]; } return [x / pts.length, y / pts.length]; };
function sloppy(key, pts, amp) {                                 // 涂色的范围比轮廓大一点、整体偏一点：有的地方涂出线，有的地方留白缝
  const r = MV.rng(key + '#slop'), [cx, cy] = centroid(pts), dx = (r() - 0.5) * amp * 1.4, dy = (r() - 0.5) * amp * 1.4;
  return pts.map(([x, y]) => { const d = Math.hypot(x - cx, y - cy) || 1, e = amp * (0.2 + r() * 0.6); return [x + dx + ((x - cx) / d) * e, y + dy + ((y - cy) / d) * e]; });
}
function bbox(pts, pad = 0) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return [x0 - pad, y0 - pad, x1 + pad, y1 + pad];
}
function inPoly(x, y, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; }
  return c;
}
function clipPoly(pts, clip) {                                   // 多边形裁到一个凸多边形里（Sutherland–Hodgman）
  const area = clip.reduce((s, p, i) => { const q = clip[(i + 1) % clip.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0), sg = area > 0 ? 1 : -1;
  let out = pts;
  for (let i = 0; i < clip.length && out.length; i++) {
    const A = clip[i], B = clip[(i + 1) % clip.length];
    const inside = (p) => sg * ((B[0] - A[0]) * (p[1] - A[1]) - (B[1] - A[1]) * (p[0] - A[0])) >= 0;
    const cut = (p, q) => { const a1 = B[1] - A[1], b1 = A[0] - B[0], c1 = a1 * A[0] + b1 * A[1], a2 = q[1] - p[1], b2 = p[0] - q[0], c2 = a2 * p[0] + b2 * p[1], d = a1 * b2 - a2 * b1; return [(b2 * c1 - b1 * c2) / d, (a1 * c2 - a2 * c1) / d]; };
    const inp = out; out = [];
    for (let j = 0; j < inp.length; j++) { const p0 = inp[j], p1 = inp[(j + 1) % inp.length], i0 = inside(p0), i1 = inside(p1); if (i0) out.push(p0); if (i0 !== i1) out.push(cut(p0, p1)); }
  }
  return out;
}
const rectPoly = ([x0, y0, x1, y1]) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
function offsetPoly(pts, d) {                                    // 多边形沿法线往外扩 d（坑边那一圈湿）
  const n = pts.length, area = pts.reduce((s, p, i) => { const q = pts[(i + 1) % n]; return s + p[0] * q[1] - q[0] * p[1]; }, 0), sg = area > 0 ? 1 : -1;
  return pts.map((p, i) => {
    const a = pts[(i + n - 1) % n], b = pts[(i + 1) % n], tx = b[0] - a[0], ty = b[1] - a[1], L = Math.hypot(tx, ty) || 1;
    return [p[0] + (sg * ty / L) * d, p[1] - (sg * tx / L) * d];
  });
}
function capsule(a, b, r0, r1, n = 5) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), nx = -Math.sin(ang), ny = Math.cos(ang), pts = [];
  pts.push([a[0] + nx * r0, a[1] + ny * r0], [b[0] + nx * r1, b[1] + ny * r1]);
  for (let i = 1; i < n; i++) { const q = ang + Math.PI / 2 - (i / n) * Math.PI; pts.push([b[0] + Math.cos(q) * r1, b[1] + Math.sin(q) * r1]); }
  pts.push([b[0] - nx * r1, b[1] - ny * r1], [a[0] - nx * r0, a[1] - ny * r0]);
  for (let i = 1; i < n; i++) { const q = ang - Math.PI / 2 - (i / n) * Math.PI; pts.push([a[0] + Math.cos(q) * r0, a[1] + Math.sin(q) * r0]); }
  return pts;
}
function partial(pts, f) {                                       // 一笔只画出前 f 那么长（写字、涂彩虹的过程）
  if (f >= 1) return pts;
  let L = 0; const seg = [];
  for (let k = 1; k < pts.length; k++) { const d = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); seg.push(d); L += d; }
  const want = L * f, res = [pts[0]]; let acc = 0;
  for (let k = 1; k < pts.length; k++) { const d = seg[k - 1]; if (acc + d >= want) { const u = (want - acc) / (d || 1); res.push([lerp(pts[k - 1][0], pts[k][0], u), lerp(pts[k - 1][1], pts[k][1], u)]); break; } res.push(pts[k]); acc += d; }
  return res;
}
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, u) => { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], u)).toString(16).padStart(2, '0')).join(''); };
const decay = (t, t0, tau) => (t < t0 ? 0 : Math.exp(-(t - t0) / tau));

// ═════════ p5 和镜头：一张 WebGL 画布，按镜头矢量重画 ═════════
let P, cw = W, ch = H, KX = 1;                                  // p5 画布按出图的像素开（1280×720 出图就开 1280×720，按 KX 缩放画）
let T = 0, BI = 0, CAM = { x: W / 2, y: H / 2, z: 1 }, PAINT = null, BGIMG = null;
let VIEW = [0, 0, W, H], CULL = null;                           // 这一遍看得见的世界范围；转场时被另一个镜头盖住的部分不画
const REST = { x: W / 2, y: H / 2, z: 1 };
const toScr = (cam, x, y) => [(x - cam.x) * cam.z + W / 2, (y - cam.y) * cam.z + H / 2];
function seen(b) {
  if (b[2] < VIEW[0] || b[0] > VIEW[2] || b[3] < VIEW[1] || b[1] > VIEW[3]) return false;
  return CULL ? CULL(b) : true;
}
async function render(paint, cam, t, bg = null) {                // 让 p5 按这个镜头重画一遍；拿到画布马上拷走，下一遍会盖掉
  T = t; CAM = cam; PAINT = paint; BGIMG = bg;
  const m = 40 / cam.z;
  VIEW = [cam.x - W / 2 / cam.z - m, cam.y - H / 2 / cam.z - m, cam.x + W / 2 / cam.z + m, cam.y + H / 2 / cam.z + m];
  await P.redraw();
  return P.drawingContext.canvas;

// ═════════ 画法：轮廓抖、填色不抖 ═════════

function ink(key, pts, o = {}) {                                 // 轮廓：蜡笔线，每 1/12 秒换一版种子、顶点抖一点

    const at = (ii, jj) => g.a[(((jj % n) + n) % n) * n + (((ii % n) + n) % n)];
    return lerp(lerp(at(i, j), at(i + 1, j), sx), lerp(at(i, j + 1), at(i + 1, j + 1), sx), sy); };
  const big = grid(32), mid = grid(128), fine = grid(512), s = W / cw;
  const c = document.createElement('canvas'); c.width = cw; c.height = ch; const g = c.getContext('2d'), img = g.createImageData(cw, ch);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const X = x * s, Y = y * s, m = vn(big, X / 135, Y / 135) * 0.55 + vn(mid, X / 30, Y / 30) * 0.45, tooth = vn(fine, X / 2.6, Y / 4.2);
    const tone = 0.965 + (m - 0.5) * 0.05 - Math.max(0, tooth - 0.66) * 0.16, k = (y * cw + x) * 4;
    img.data[k] = 251 * tone + 4; img.data[k + 1] = 245 * tone + 3; img.data[k + 2] = 230 * tone; img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.globalAlpha = 0.07; g.strokeStyle = '#8a7a60'; g.lineWidth = 0.6;
  for (let i = 0; i < 300; i++) { const x = r() * cw, y = r() * ch, a = r() * TAU, L = (5 + r() * 18) / s; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.5) * L / 2, y + Math.sin(a + 0.5) * L / 2, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke(); }
  g.globalAlpha = 1; paperTex = c;
}

// ═════════ 合成 ═════════
async function drawFrame(g, t) {
  BI = Math.floor(t * BOIL + 1e-6) % BOILK; CULL = null;
  if (t < T_PUSH) { g.drawImage(await render((p, tt) => shot1(p, tt, 'dynamic'), REST, t, await staticImage(1, BI)), 0, 0, W, H); lights1(g, t, REST); }
  else if (t >= T_LAND) { g.drawImage(await render((p, tt) => shot2(p, tt, 'dynamic'), REST, t, await staticImage(2, BI)), 0, 0, W, H); lights2(g, t, REST); }
  else await transition(g, t);
}
async function overlay(g, t) {                                   // 最上层、不跟镜头动：蜡笔写的歌词 + 整张纸纹
  BI = Math.floor(t * BOIL + 1e-6) % BOILK; CULL = null;
  const L = MV.lyricAt(t, { per: BEAT / 2, pop: 0.32 });
  g.globalCompositeOperation = 'multiply';
  if (L) g.drawImage(await lyricLayer(t, L), 0, 0, W, H);
  g.drawImage(paperTex, 0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
}

const sketchReady = new Promise((resolve) => {
  new p5((p) => {
    P = p;
    p.setup = async () => {
      KX = Math.min((innerWidth || W) / W, (innerHeight || H) / H); cw = Math.round(W * KX); ch = Math.round(H * KX);
      p.createCanvas(cw, ch, p.WEBGL).elt.style.display = 'none'; p.pixelDensity(1); p.noLoop();
      brush.instance(p); brush.load(); brush.scaleBrushes(2.4);
      // 坑：p5.brush 2.2.3 判断笔尖出没出画布，用的是缩放前的坐标（当一个单位就是一个像素，范围是画布的 -0.5 到 1.5 倍）。
      // 这里按 KX 和镜头缩放来画，坐标会超出那个范围：超出的那段笔画原地不动、笔触全堆成一团，从外面起笔的排线整条不画（缩小出图、推拉时最明显）。
      // 画布外的笔触 WebGL 自己会裁掉，所以把这个判断关掉
      brush.Position.prototype.isInCanvas = () => true;
      // 写字用的蜡笔：比自带的 crayon 散得少一点，字才认得清
      brush.add('wax', { type: 'default', weight: 0.62, scatter: 0.75, sharpness: 0.7, grain: 1.0, opacity: 155, spacing: 0.14, pressure: [1.15, 0.85], rotate: 'natural' });
      resolve();
    };
    p.draw = () => {
      if (!PAINT) return;
      if (BGIMG) { p.push(); p.image(BGIMG, -cw / 2, -ch / 2, cw, ch); p.pop(); } else p.background(PAL.paper);
      p.push(); p.translate(-cw / 2, -ch / 2); p.scale(KX);
      p.translate(W / 2, H / 2); p.scale(CAM.z); p.translate(-CAM.x, -CAM.y);   // 镜头的推拉在 p5 里做，矢量重画
      PAINT(p, T);
      p.pop();
    };
  });
});

MV.page({
  W, H, fps: FPS, duration: DURATION,
  ready: async () => {
    await sketchReady;
    makePaper(); makeGlow();
    // 笔画数据：先用本地的 glyphs.js（scripts/glyphs.py 存的，页面里引了就用），缺的从 jsDelivr 取；网络问题取不到时出片报错停下，不会有的帧有字、有的没有
    Object.assign(MED, await MV.glyphs(window.LYRICS[0][2]));
  },
  draw: drawFrame,
  overlay,
});
