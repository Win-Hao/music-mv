<!doctype html>
<!--
  1930s 橡皮管卡通（rubber hose cartoon）· 老厨房里，咖啡壶和两只咖啡杯跟着摇摆乐跳舞（BPM 132，12 拍 ≈ 5.45 秒）
  示范场景只为展示画法，做 MV 时场景、角色、构图从你的歌来。
  一部黑白老动画短片放到一半：灰色水彩画的老厨房里，橱柜、窗、吊灯、炉子、灶台全跟着拍子一蹲一伸；咖啡壶站在炉子上跳查尔斯顿
  （壶嘴是鼻子，壶把是一只叉腰的胳膊），墙上挂的平底锅当鼓，汤勺每拍荡过去敲它一下；光圈收到壶脸上，壶冲镜头眨眼，
  光圈收成针孔再张开，换到桌面近景：两只杯子手拉手转圈，每拍冒出一团蒸汽、变成一个音符飘上去。唱歌片的字卡第 1 拍落下，小白球按摇摆八分跳字。

  关键画法（Canvas 2D + kit.js，不靠别的库）：
  1. 工具和分层：MV.page 画两层。draw = 胶片里的画面（两个镜头 + 光圈），overlay = 字卡 + 胶片损伤 + 片门。
     画面从下往上：背景（水彩，开页面烤一张）→ 道具（每样烤一张，整体跟着拍子变形）→ 角色（每张现画，墨线在抖）→ 胶片（最后整帧叠）。
  2. 纸和纹理：背景、道具都是灰色水彩：同一形状推几层不齐的毛边半透明叠上去（wash），边上一道深一点的水痕；木纹、瓷砖缝、窗帘褶用干笔（dry）；
     烤图时用 source-atop 叠一层纸纹（斑块 + 颗粒），纸纹一个像素对一个物理像素。道具的墨线手描、抖一点但固定（inkStatic），画本身不抖。
     格子桌布 = 横条、竖条两遍半透明的灰湿画，交叉处自然叠深，竖条朝消失点收，就是透视。
  3. 颜色：只有灰阶（gr()）。红、橘红在老胶片里是深灰，所以咖啡壶是深灰身子 + 白脸盘（像老卡通的黑身子白脸），两只杯子一白一灰（白杯一道深箍、灰杯白点），
     认它们靠造型，不靠颜色。
  4. 光：灰阶里光就是更白。吊灯 = 一圈圈边缘清楚的白光晕 + 墨线画的光芒（只画灯罩下面半圈，每拍转半格，像在闪）+ 一道淡白光锥 + 炉面上一块更白的光池；
     桌面近景的灯在画外，只留光锥和桌布上的光池。墙上灯下那片更白烤在背景里。
  5. 角色是赛璐珞：平涂 + 等宽墨线（cel()，6 px，缩放时线宽不变），线一张一换抖动种子（boil），填色跟着线走、不闪。
     胳膊、腿是橡皮管：等粗的黑线顺着二次曲线弯，没有关节（hose()）；白手套（glove()：喇叭口袖口 + 手掌，攥拳时背上三道线，张开时四根手指）；
     派形眼：白眼眶里一颗切掉右上角的黑椭圆（pie()）。咖啡壶：壶嘴从脸盘正中长出来当鼻子（tube() 一根渐细的管子），壶把是一只叉在腰上的胳膊，
     眨眼那拍松开、举到脸边挥一下。杯子按圆柱画（drawCup()）：眼睛、嘴、白点都按「绕着杯身转了多少度」算横向位置，转到背面就藏起来，杯把在脸的背面，
     所以转圈时看得出在转。两只杯子转圈按前后排序画：后面那只 → 前面那只 → 攥在一起的手套；杯身挡住圆心时，拉着的胳膊藏在后面。
  6. 动起来的手感：老动画的曝光表按「一拍几格」排。这里一拍 12 格胶片（132 BPM 时一秒 26.4 格，跟 24 格差不多），
     角色一拍 6 张（一张停两格）；拍点和摇摆的后半拍（三连音第 3 个，2/3 拍处）都正好落在整张上。
     万物有灵、同相伸缩：所有道具共用一个拍子函数 pulseAt()：拍上压到最扁，摇摆的后半拍伸到最长，再用 1/3 拍落回拍上（长—短），
     左右轮流歪（leanAt()），幅度 4.5%，第二个镜头加到 6%。站在道具上的角色跟着道具顶面一起蹲（danced() 算顶面在哪）。
     大动作先压后弹：壶拍上压扁、后半拍伸长踢腿、盖子跳起来拍上落回；汤勺按摇摆荡出去（2/3 拍到最远），用 1/3 拍荡回来在拍上敲锅，
     锅被敲得绕钉子晃、冒三道墨线和两道震纹。镜头一个镜头只做一种慢推（厨房 1 → 1.1 推向壶脸，桌面 1 → 1.04），不晃不拉回。
  7. 胶片放映（overlay 最后叠）：4:3 圆角片门（左右黑边）、每格整帧晃 1–3 px（偶尔跳一下，draw 和 overlay 用同一格的晃动）、明暗闪 ±5%、颗粒、灰尘和毛发、
     竖划痕（一道连着几格慢慢漂）、暗角，全部用格号 F 做种子（'weave' + F、'film' + F），是确定的。
  8. 转场 = 老卡通的光圈（iris），画在胶片里：光圈是胶片黑（和墨线同一个 #141414，不是片门外的纯黑），跟着片子晃、落灰。
     第 3 拍起步、第 4 拍收到壶脸上（半径按对数插值 + smooth，一秒 12 张时也是一格一格匀着收），落位时紧一下，收住后跟着拍子一缩一胀；
     第 5 拍壶冲镜头眨眼；5.5 拍再收（ease.in 越收越快），第 6 拍收成针孔（半径 16，整帧平均亮度约 18，高于黑帧线 8），
     针孔里换成第二个镜头，再 ease.out 张开，第 7 拍张开到底。收和张在针孔两边速度接得上。
     镜头表 SHOTS 两个镜头在第 3–7 拍重叠，transition() 里针孔之前画 A、之后画 B，再盖光圈。光圈中心就是镜头慢推的中心（壶脸），所以收的时候壶脸不动。
  9. 歌词 = 唱歌片字卡：window.LYRICS 给这句的起止，MV.lyricAt 判断该不该显示；深色底板、凹角、白色双线边框、两端小菱形，白字老式美术字（站酷庆科黄油体 64 px）。
     字卡在 overlay 里（不跟镜头推、不被光圈盖），但跟着胶片晃、闪、落灰；第 1 拍「啪」地落下（放大 → 回弹）。字卡上只有歌词，不加片名。
     小白球按 HOPS 表（第几拍落在第几个字）跳：拍上和 2/3 拍处落，长的一跳高、短的一跳低，摇摆一眼看得出；落到的字从灰变白、闪大两格；逗号不落，跟前一个字一起亮。

  时间线（拍，从 0 数；1 拍 = 0.4545 秒）：
    0–3   厨房全景：壶在炉子上跳查尔斯顿，两只杯子在灶台上摇，汤勺每拍敲锅；第 1 拍字卡落下，小球从左边的小菱形起跳，第 2 拍落在第 1 个字上
    3→4   光圈收到壶脸上（第 4 拍落位），杯子两手叉腰
    5     壶冲镜头眨眼：右眼闭成弯线、眼角冒一颗四角星、壶把松开举到脸边挥手
    5.5→6 光圈收成针孔，第 6 拍换镜头
    6→7   光圈从针孔张开到桌面近景（第 7 拍张开到底，杯子正好转到并排；小球落在「圈」上）
    7–12  两只杯子手拉手转圈（一小节一圈），每拍一只杯子冒一团蒸汽，半拍里变成音符飘上去，飘三拍后碎成小泡；小球第 8 拍落到最后一个字，之后每拍原地轻跳
  window.PLAN = [第 4 拍, 第 7 拍] = [1.818, 3.182] 秒。

  画面只由 t 决定：随机数全用 MV.rng / MV.hash 加「元素名 + 序号」做种子，不用 Math.random()、Date，不存上一帧。
  画布跟窗口大小走（kit 按 1920×1080 等比缩放），--width 1280 --height 720 也是完整画面。
  速度（这台 4 核、无独显的电脑）：开页面下字体、烤背景和道具约 5 秒；1920×1080 画一帧约 0.03 秒（不算 PNG 编码；第一帧热身约 0.4 秒）。
    render_frames 连存图：1920×1080 PNG 约 0.15–0.35 秒一张，1280×720 PNG 约 0.06 秒，960×540 JPG 约 0.02 秒。
  出 README 动图：render_frames.mjs --fps 12 --width 1280 --height 720 --format png 渲 65 帧 →
    ffmpeg -framerate 12 -i %06d.png -vf "scale=640:360:flags=lanczos,split[a][b];[a]palettegen=max_colors=24:stats_mode=diff[p];[b][p]paletteuse=dither=none" -loop 0，
    约 4.36 MB（一帧约 67 KB）。胶片每格都在晃、闪、落灰，整帧都在变，GIF 没法只存变了的地方，只能靠减色：
    这组帧 28 色不抖动 4.70 MB（32 色约 5.1 MB），24 色加抖动也超（bayer 4.55 MB、sierra 4.54 MB）；灰阶 24 色和 28 色放大看分不出，颗粒把色带盖住了。
  外部资源：站酷庆科黄油体 ZCOOL QingKe HuangYou（OFL-1.1），fontsource 的包，从 jsDelivr 加载；kit.js 是本项目的。

  坑：
  - 纸纹用 source-atop 烤进道具以后又改成 multiply 叠，会把道具图四周的透明处也涂上，出现一个个灰方块；纸纹图块放大以后有接缝竖线，所以一个像素对一个物理像素
  - 小白球的弧线太高会飞出字卡：最高一跳 40 px，字卡高 176
  - 132 BPM 在 24 格下一拍 10.9 格，按秒数取格，拍点会在两格之间来回差一格；所以格号按拍子算（F = 拍数 × 12）
  - 光圈收到全黑会被当成黑帧（整帧平均亮度 < 8），也看不出接的是什么：收到针孔就换镜头，光圈用胶片黑不用纯黑
  - 光圈从「刚好盖住片门」的半径起收，别从更大的圆起收：圆在片门外缩的那几格什么都看不见，收的动作全挤在后半拍
  - 柜子玻璃里两个叠着的圆盘、旋钮里一道竖线，缩小以后像字母（CO、Φ）：盘子平放成一摞，旋钮指针斜着画
  - 汤勺、锅、杯子挤在一面墙上，抬手时会穿到勺子里：杯子的手只举到肩高，勺子荡到最远也在杯口上方
-->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-qingke-huangyou@5.3.0/index.css">
<script src="../../templates/mv/kit.js"></script>
<style>html, body { margin: 0; overflow: hidden; background: #000; }</style>
</head><body><script>
'use strict';
// ───────────────────────── 拍子和时间线：所有时刻都按拍数写 ─────────────────────────
const W = 1920, H = 1080, FPS = 30, BPM = 132;
MV.tempo(BPM, 0);                                    // 第 0 拍在 0 秒
const { clamp, lerp, seg, ease } = MV;
const BT = MV.beatTime;                              // 第 n 拍在几秒
const FR = 12, DR = 6;                               // 曝光表：胶片一拍 12 格，角色一拍 6 张（一张停两格）
const NB = 12, DUR = BT(NB);                         // 片长 12 拍
const B_CARD = 1, B_IRIS = 3, B_FACE = 4, B_WINK = 5, B_PINCH = 5.5, B_CUT = 6, B_OPEN = 7;
window.PLAN = [BT(B_FACE), BT(B_OPEN)].map((t) => +t.toFixed(3));   // 光圈收到脸上、张开到第二个镜头
const LYRIC = '趁咖啡还热，转个圈吧';
window.LYRICS = [[BT(B_CARD), DUR, LYRIC]];
// 小白球：[第几拍落地, 落在第几个字]（-1 = 字卡左端的小菱形）。拍上 + 2/3 拍处落，是摇摆八分的长—短
const HOPS = [[1, -1], [2, 0], [2 + 2 / 3, 1], [3, 2], [3 + 2 / 3, 3], [4, 4], [5, 4], [6, 6], [6 + 2 / 3, 7], [7, 8], [8, 9], [9, 9], [10, 9], [11, 9], [12, 9]];
const FONT_NAME = 'ZCOOL QingKe HuangYou';
const FONT = `"${FONT_NAME}","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif`;
const GX0 = 240, GX1 = 1680;                         // 4:3 片门（1440×1080）
const INK = '#141414', TAU = Math.PI * 2;

// 这一帧在曝光表上的位置：F 胶片格号、BF 格对应的拍数；Q 角色第几张、BQ 那张对应的拍数
let F = 0, BF = 0, Q = 0, BQ = 0, PV = 0, LEAN = 0, AMP = 0;
const swing = (ph) => (ph < 2 / 3 ? ph * 0.75 : 0.5 + (ph - 2 / 3) * 1.5);   // 拍内相位 → 摇摆相位：2/3 拍处走到一半
// 拍上压扁（+1），摇摆的后半拍伸到最长（-1），尖一点，像弹簧
function pulseAt(b) { const n = Math.floor(b), c = Math.cos(TAU * swing(b - n)); return Math.sign(c) * Math.pow(Math.abs(c), 0.6); }
function leanAt(b) { const n = Math.floor(b); return Math.sin(Math.PI * (n + swing(b - n))); }   // 左右轮流歪，后半拍歪到最多
function clock(t) {
  const b = MV.beat(t) + 1e-6;
  F = Math.floor(b * FR); BF = F / FR; Q = Math.floor(b * DR); BQ = Q / DR;
  PV = pulseAt(BF); LEAN = leanAt(BF); AMP = BF < B_CUT ? 0.045 : 0.06;
}

// ───────────────────────── 小工具 ─────────────────────────
const gr = (v, a = 1) => { v = Math.round(clamp(v, 0, 255)); return `rgba(${v},${v},${v},${a})`; };
const rnd = (key) => MV.rng(key)();
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function ellPts(cx, cy, rx, ry, n = 36, rot = 0) {
  const c = Math.cos(rot), s = Math.sin(rot), out = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * TAU, X = Math.cos(a) * rx, Y = Math.sin(a) * ry; out.push([cx + X * c - Y * s, cy + X * s + Y * c]); }
  return out;
}
function quadPts(a, c, b, n = 14) {
  const out = [];
  for (let i = 0; i <= n; i++) { const u = i / n, v = 1 - u; out.push([v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]); }
  return out;
}
const rectPts = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
function rrPts(x0, y0, x1, y1, r, n = 5) {
  const out = [];
  for (const [cx, cy, a0] of [[x1 - r, y0 + r, -Math.PI / 2], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, Math.PI / 2], [x0 + r, y0 + r, Math.PI]]) {
    for (let i = 0; i <= n; i++) { const a = a0 + (i / n) * (Math.PI / 2); out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  }
  return out;
}
function densify(pts, step, closed = true) {
  const out = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const a = pts[i], b = pts[(i + 1) % n], k = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let j = 0; j < k; j++) out.push([lerp(a[0], b[0], j / k), lerp(a[1], b[1], j / k)]);
  }
  if (!closed) out.push(pts[n - 1]);
  return out;
}
function pathOf(pts, closed = true) {
  const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  if (closed) p.closePath();
  return p;
}
// 沿法线推：按弧长的两组正弦 + 一点碎抖。墨线的手抖、水彩的毛边都用它
function jitter(pts, amp, seed, closed = true, rough = 0) {
  const r = MV.rng(seed), p1 = r() * TAU, p2 = r() * TAU, w1 = 40 + r() * 50, w2 = 11 + r() * 9, n = pts.length, out = [];
  let s = 0;
  for (let i = 0; i < n; i++) {
    if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const a = pts[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = pts[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], L = Math.hypot(nx, ny) || 1;
    const d = amp * (0.7 * Math.sin(s / w1 + p1) + 0.4 * Math.sin(s / w2 + p2) + rough * (r() - 0.5));
    out.push([pts[i][0] + (nx / L) * d, pts[i][1] + (ny / L) * d]);
  }
  return out;
}
// 一根渐细的管子（壶嘴）：沿二次曲线两边各推出半个宽度
function tube(a, c, b, w0, w1, n = 14) {
  const P = quadPts(a, c, b, n), L = [], R = [];
  for (let i = 0; i <= n; i++) {
    const p = P[i], q = P[Math.min(n, i + 1)], o = P[Math.max(0, i - 1)], tx = q[0] - o[0], ty = q[1] - o[1], l = Math.hypot(tx, ty) || 1, w = lerp(w0, w1, i / n) / 2;
    L.push([p[0] - (ty / l) * w, p[1] + (tx / l) * w]); R.push([p[0] + (ty / l) * w, p[1] - (tx / l) * w]);
  }
  return [...L, ...R.reverse()];
}
function cloudPts(x0, x1, y, h, seed) {
  const r = MV.rng(seed), pts = [[x1, y + h * 0.25], [x0, y + h * 0.25]];
  let xx = x0;
  while (xx < x1 - 10) {
    const bw = Math.min(x1 - xx, 26 + r() * 30), bh = h * (0.45 + r() * 0.55), cx = xx + bw / 2;
    for (let k = 0; k <= 6; k++) { const a = Math.PI + (k / 6) * Math.PI; pts.push([cx + (Math.cos(a) * bw) / 2, y + Math.sin(a) * bh]); }
    xx += bw;
  }
  return pts;
}
function moundPts(xs, ys) {
  const out = [];
  for (let i = 0; i < xs.length - 1; i++) for (let k = 0; k < 8; k++) { const u = k / 8, e = (1 - Math.cos(u * Math.PI)) / 2; out.push([lerp(xs[i], xs[i + 1], u), lerp(ys[i], ys[i + 1], e)]); }
  out.push([xs[xs.length - 1], ys[ys.length - 1]]);
  return out;
}

// ───────────────────────── 水彩、墨线、纸（背景和道具用，烤一次不抖） ─────────────────────────
let K = 1, BK = 1.1;                                 // 逻辑 px → 物理 px；烤图多留一成给镜头推近
// 一块湿画：同一形状推几层不同的毛边，半透明叠上去（叠得少的边缘浅）；最后沿边描一道深一点的水痕
function wash(x, pts, tone, o = {}) {
  const { seed = 'w', amp = 5, layers = 3, alpha = 0.5, edge = 0.3, step = 12, closed = true } = o;
  const base = densify(pts, step, closed);
  for (let l = 0; l < layers; l++) { x.fillStyle = gr(tone, alpha); x.fill(pathOf(jitter(base, amp, seed + 'L' + l, closed, 0.5))); }
  if (edge > 0) { x.strokeStyle = gr(tone - 34, edge); x.lineWidth = 2.2; x.lineJoin = 'round'; x.stroke(pathOf(jitter(base, amp * 0.8, seed + 'E', closed, 0.4))); }
}
// 干笔：几根鬃毛并排扫过，中间断断续续
function dry(x, x0, y0, x1, y1, w, tone, alpha, seed) {
  const r = MV.rng(seed), L = Math.hypot(x1 - x0, y1 - y0) || 1, ux = (x1 - x0) / L, uy = (y1 - y0) / L, n = 5;
  x.strokeStyle = gr(tone, alpha); x.lineCap = 'round';
  for (let b = 0; b < n; b++) {
    const off = ((b - (n - 1) / 2) * w) / n; x.lineWidth = 0.8 + r() * 1.4;
    let s = r() * 10; x.beginPath();
    while (s < L) {
      const len = 8 + r() * 40, gap = 3 + r() * 16, e = Math.min(L, s + len);
      x.moveTo(x0 + ux * s - uy * off, y0 + uy * s + ux * off); x.lineTo(x0 + ux * e - uy * off + (r() - 0.5), y0 + uy * e + ux * off + (r() - 0.5));
      s = e + gap;
    }
    x.stroke();
  }
}
// 手描墨线（道具用：抖一点但固定，不 boil）
function inkStatic(x, pts, fill, seed, lw = 4.5, closed = true) {
  const p = pathOf(jitter(densify(pts, 9, closed), 0.9, seed, closed), closed);
  if (fill) { x.fillStyle = fill; x.fill(p); }
  x.strokeStyle = INK; x.lineWidth = lw; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke(p);
  return p;
}
// 先填色、在里面上水彩，再描墨线
function inkWash(x, pts, tone, seed, paint, lw = 4.5) {
  const p = pathOf(pts);
  x.save(); x.fillStyle = gr(tone); x.fill(p); x.clip(p); paint(x); x.restore();
  inkStatic(x, pts, null, seed, lw);
}
let PAPER = null;
function makePaper() {                       // 纸纹：透明底上的黑色斑块 + 颗粒（灰阶里叠黑 = multiply）
  const s = 384, c = canvas(s, s), x = c.getContext('2d'), r = MV.rng('paper');
  for (let i = 0; i < 60; i++) {
    const px = r() * s, py = r() * s, rad = 20 + r() * 70, g = x.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, gr(0, 0.05)); g.addColorStop(1, gr(0, 0)); x.fillStyle = g;
    for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]) x.fillRect(px - rad + dx, py - rad + dy, rad * 2, rad * 2);
  }
  for (let i = 0; i < 5000; i++) { x.fillStyle = gr(0, 0.04 + r() * 0.09); x.fillRect(r() * s, r() * s, 1 + r() * 1.5, 1 + r()); }
  return c;
}
// 叠纸纹；烤道具时用 source-atop，只落在画过的地方。纸纹一个像素对一个物理像素，不缩放（缩放会在图块接缝处出竖线）
function paperOver(x, x0, y0, w, h, alpha) {
  const p = x.createPattern(PAPER, 'repeat'), m = x.getTransform();
  p.setTransform(new DOMMatrix([1 / m.a, 0, 0, 1 / m.d, 0, 0]));
  x.save(); x.globalAlpha = alpha; x.fillStyle = p; x.fillRect(x0, y0, w, h); x.restore();
}
// 烤一张图：bbox 是相对锚点的逻辑坐标
function sprite(x0, y0, x1, y1, art) {
  const w = x1 - x0, h = y1 - y0, c = canvas(w * BK, h * BK), g = c.getContext('2d');
  g.setTransform(c.width / w, 0, 0, c.height / h, (-x0 * c.width) / w, (-y0 * c.height) / h); art(g);
  g.setTransform(c.width / w, 0, 0, c.height / h, (-x0 * c.width) / w, (-y0 * c.height) / h);
  g.globalCompositeOperation = 'source-atop'; paperOver(g, x0, y0, w, h, 0.8);
  return { c, x0, y0, w, h };
}
const blit = (x, s) => x.drawImage(s.c, s.x0, s.y0, s.w, s.h);

  wash(x, rectPts(X0 - 20, Y0 - 20, X1 + 20, Y1), 202, { seed: key + 'wall', amp: 12, layers: 2, alpha: 0.5, edge: 0, step: 24 });
  for (let i = 0, sx = X0 + 10; sx < X1; sx += step, i++) {
    wash(x, rectPts(sx, Y0 - 20, sx + band, Y1), 184, { seed: key + 'st' + i, amp: 2.2, layers: 2, alpha: 0.3, edge: 0.14, step: 16 });
    for (let y = Y0 + 40 + (i % 2) * step * 0.6; y < Y1 - 20; y += step * 1.2) {

}

}

const potHW = (y) => { const s = clamp((-50 - y) / 280); return lerp(112, 72, s) + 14 * Math.sin(Math.PI * s * 0.9); };

const R_FULL = 920, R_FACE = 240, R_PIN = 16;   // R_FULL：圆刚好盖过片门四角（壶脸到最远的角约 910），从这里起收，第一格就看得见在收
function irisHold(b) { return R_FACE * (1 - 0.08 * Math.exp(-6 * (b - B_FACE))) * (1 - 0.035 * pulseAt(b)); }   // 收住：落位时紧一下，跟着拍子一缩一胀
function irisR(b) {
  if (b < B_FACE) return MV.lerpLog(R_FULL, irisHold(B_FACE), ease.smooth(seg(b, B_IRIS, B_FACE)));   // 对数插值：每格缩的比例差不多；用 smooth 不用 inOut，一秒 12 张时也是一格一格匀着收
  if (b < B_PINCH) return irisHold(b);

// 光圈画在胶片里：先画圈里的镜头（针孔之前是 A，之后是 B），再用胶片黑盖住圈外
function transition(g, t, a, b) {
  (BF < B_CUT ? a : b).draw(g, t);
  const r = irisR(BF);
  g.fillStyle = INK; g.beginPath(); g.rect(GX0 - 40, -40, GX1 - GX0 + 80, H + 80); g.arc(FACE[0], FACE[1], r, 0, TAU, true); g.fill('evenodd');
  g.strokeStyle = gr(20, 0.4); g.lineWidth = 6; g.beginPath(); g.arc(FACE[0], FACE[1], r + 2, 0, TAU); g.stroke();   // 圈口软一点
}
function weave(g) {                           // 片子在片门里跳：这一格整帧一起晃
  const r = MV.rng('weave' + F), jump = r() < 0.06 ? 1 : 0;
  g.translate((r() - 0.5) * 3 + jump * (r() - 0.5) * 6, (r() - 0.5) * 4 + jump * (r() - 0.5) * 10);
}
function drawFrame(g, t) {                    // 不叫 draw：页面里有全局 draw 时 p5 会进全局模式
  clock(t);
  g.save(); weave(g);
  g.beginPath(); g.rect(GX0 - 8, -8, GX1 - GX0 + 16, H + 16); g.clip();
  const live = SHOTS.filter((s) => t >= s.start && t < s.end);
  if (live.length >= 2) transition(g, t, live[0], live[1]);
  else if (live.length) live[0].draw(g, t);
  g.restore();
}

// ───────────────────────── 字卡 + 跳跳球（overlay：不跟镜头推，跟着胶片晃） ─────────────────────────
function cardPath(w, h, r) {                  // 四个角往里凹的老式字卡
  const x0 = -w / 2, y0 = -h / 2, x1 = w / 2, y1 = h / 2, p = new Path2D();
  p.moveTo(x0 + r, y0); p.lineTo(x1 - r, y0); p.arc(x1, y0, r, Math.PI, Math.PI / 2, true);
  p.lineTo(x1, y1 - r); p.arc(x1, y1, r, Math.PI * 1.5, Math.PI, true);
  p.lineTo(x0 + r, y1); p.arc(x0, y1, r, 0, -Math.PI / 2, true);
  p.lineTo(x0, y0 + r); p.arc(x0, y0, r, Math.PI / 2, 0, true); p.closePath();
  return p;
}
const LIT = (() => { const m = {}; for (const [b, i] of HOPS) if (i >= 0 && m[i] === undefined) m[i] = b; return m; })();
let CHARS = null;
function drawCard(g, t) {
  const L = MV.lyricAt(t, { tail: 1, gap: 0 });
  if (!L) return;
  const CW = 900, CH = 176, FS = 64, TY = 32;
  const f = F - Math.round(MV.beat(L.start) * FR), pop = [1.24, 0.93, 1.04, 1][clamp(f, 0, 3)];
  g.save(); g.translate(960, 974); g.scale(pop, pop);
  g.fillStyle = gr(16, 0.96); g.fill(cardPath(CW, CH, 18));
  g.strokeStyle = gr(244); g.lineWidth = 3.5; g.stroke(cardPath(CW - 18, CH - 18, 14));
  g.lineWidth = 1.6; g.stroke(cardPath(CW - 32, CH - 32, 10));
  for (const s of [-1, 1]) { const dx = s * (CW / 2 - 42); g.fillStyle = gr(244); g.beginPath(); g.moveTo(dx, -9); g.lineTo(dx + 7, 0); g.lineTo(dx, 9); g.lineTo(dx - 7, 0); g.closePath(); g.fill(); }
  g.font = `${FS}px ${FONT}`; g.textBaseline = 'middle'; g.textAlign = 'center';
  if (!CHARS) {
    const cs = Array.from(L.text), ws = cs.map((c) => g.measureText(c).width), gap = 4, tot = ws.reduce((a, b) => a + b, 0) + gap * (cs.length - 1);
    let cx = -tot / 2; CHARS = cs.map((c, i) => { const o = { c, x: cx + ws[i] / 2 }; cx += ws[i] + gap; return o; });
  }
  for (const [i, c] of CHARS.entries()) {
    const lb = LIT[i] ?? LIT[i - 1], lit = BF >= lb - 1e-6, flash = lit && BF < lb + 2 / FR - 1e-6;   // 逗号不落，跟前一个字一起亮
    g.save(); g.translate(c.x, TY); if (flash) g.scale(1.13, 1.13);
    g.fillStyle = lit ? gr(250) : gr(108); g.fillText(c.c, 0, 0); g.restore();
  }
  // 小白球：HOPS 里这一跳从哪个字到哪个字，长的跳高、短的跳低；落地那一格压扁
  let j = 0; while (j < HOPS.length - 2 && BF >= HOPS[j + 1][0] - 1e-6) j++;
  const [b0, i0] = HOPS[j], [b1, i1] = HOPS[j + 1], u = clamp((BF - b0) / (b1 - b0));
  const X = (i) => (i < 0 ? -(CW / 2 - 42) : CHARS[i].x), land = TY - FS * 0.5 - 15;
  const hh = i0 === i1 ? 20 : Math.min(40, 44 * Math.pow(b1 - b0, 0.75));
  const bx = lerp(X(i0), X(i1), u), by = land - 4 * hh * u * (1 - u), sq = BF - b0 < 1 / FR - 1e-6 ? 1 : 0;
  g.save(); g.translate(bx, by + sq * 4); g.scale(1 + 0.3 * sq, 1 - 0.3 * sq);
  g.fillStyle = gr(250); g.strokeStyle = INK; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 15, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = gr(185); g.beginPath(); g.arc(5, 5, 5.5, 0, TAU); g.fill();
  g.restore();
  g.restore();
}

// ───────────────────────── 胶片：颗粒、灰尘、划痕、闪烁、暗角（格号做种子） ─────────────────────────
function film(x) {
  const r = MV.rng('film' + F);
  const pat = x.createPattern(S.grain[F % 3], 'repeat');
  pat.setTransform(new DOMMatrix([2, 0, 0, 2, Math.floor(r() * 256), Math.floor(r() * 256)]));
  x.fillStyle = pat; x.fillRect(GX0, 0, GX1 - GX0, H);
  const n = Math.floor(r() * r() * 7);        // 灰尘（印片上的黑点）、偶尔一个白点（片基上的划伤）
  for (let i = 0; i < n; i++) {
    const px = GX0 + r() * 1440, py = r() * H, rr = 1.6 + r() * r() * 7, dark = r() < 0.8;
    x.fillStyle = dark ? gr(12, 0.85) : gr(245, 0.75); x.fill(pathOf(jitter(ellPts(px, py, rr, rr * (0.5 + r() * 0.5), 10, r() * 3), rr * 0.35, 'd' + F + i, true, 1)));
  }
  if (r() < 0.16) {                           // 偶尔一根毛发
    let px = GX0 + 100 + r() * 1240, py = 80 + r() * 900, a = r() * TAU; const pts = [[px, py]];
    for (let k = 0; k < 7; k++) { a += (r() - 0.5) * 1.6; px += Math.cos(a) * 16; py += Math.sin(a) * 16; pts.push([px, py]); }
    x.strokeStyle = gr(14, 0.8); x.lineWidth = 1.7; x.lineCap = 'round'; x.stroke(pathOf(pts, false));
  }
  for (let j = 0; j < 3; j++) {               // 划痕：每道活几格，慢慢漂
    const len = 9 + j * 6, f0 = F + j * 13, s = Math.floor(f0 / len), rr = MV.rng('scr' + j + ':' + s);
    if (rr() < 0.45) continue;
    const xx0 = GX0 + 60 + rr() * 1320, drift = (rr() - 0.5) * 2.2, light = rr() < 0.7, lw = 1 + rr() * 1.3, part = rr() < 0.35;
    const y0 = part ? rr() * 500 : -10, y1 = part ? y0 + 200 + rr() * 500 : H + 10, xx = xx0 + drift * (f0 % len) + (rnd('sj' + j + ':' + F) - 0.5) * 1.5;
    x.strokeStyle = light ? gr(235, 0.32) : gr(14, 0.35); x.lineWidth = lw; x.beginPath();
    for (let y = y0, k = 0; y <= y1; y += 90, k++) { const ox = xx + Math.sin(y / 170 + j) * 2; k ? x.lineTo(ox, y) : x.moveTo(ox, y); }
    x.stroke();
  }
  const fl = (rnd('flick' + F) - 0.5) * 0.1 + 0.03 * Math.sin(F * 0.7);   // 闪烁：这一格整体亮一点 / 暗一点
  x.fillStyle = fl > 0 ? gr(255, fl * 0.5) : gr(0, -fl); x.fillRect(GX0, 0, GX1 - GX0, H);
  const vg = x.createRadialGradient(960, 520, 330, 960, 540, 920);   // 暗角
  vg.addColorStop(0, gr(0, 0)); vg.addColorStop(0.6, gr(0, 0.22)); vg.addColorStop(1, gr(0, 0.7));
  x.fillStyle = vg; x.fillRect(GX0, 0, GX1 - GX0, H);
}
function overlay(g, t) {
  clock(t);
  g.save(); weave(g);
  g.beginPath(); g.rect(GX0 - 8, -8, GX1 - GX0 + 16, H + 16); g.clip();
  drawCard(g, t);
  film(g);
  g.restore();
  g.drawImage(S.gate, 0, 0, W, H);
}

// ───────────────────────── 开页面：下字体、烤背景和道具 ─────────────────────────
const S = {};
function bake() {
  K = Math.min((innerWidth || W) / W, (innerHeight || H) / H) || 1; BK = K * 1.1;
  PAPER = makePaper();
  S.kitchen = bakeKitchen(); S.table = bakeTable();
  S.cabL = sprite(-192, -346, 192, 12, (x) => artCabinet(x, 'cabL'));
  S.cabR = sprite(-192, -346, 192, 12, (x) => artCabinet(x, 'cabR'));
  S.win = sprite(-204, -326, 204, 12, artWindow);
  S.win2 = sprite(-245, -398, 245, 14, (x) => { x.scale(1.2, 1.2); artWindow(x); });
  S.lamp = sprite(-104, -36, 104, 214, artLamp);
  S.stove = sprite(-246, -238, 246, 6, artStove);
  S.cntL = sprite(-272, -214, 272, 6, (x) => artCounter(x, 'cntL', 510));
  S.cntR = sprite(-272, -214, 272, 6, (x) => artCounter(x, 'cntR', 510));
  S.shelf = sprite(-160, -138, 160, 68, artShelf);
  S.pan = sprite(-106, -14, 106, 276, artPan);
  S.ladle = sprite(-42, -6, 42, 208, artLadle);
  S.rack = sprite(-212, -134, 212, 46, artRack);
  S.sugar = sprite(-100, -140, 100, 10, artSugar);
  S.jug = sprite(-80, -170, 116, 6, artJug);
  S.grain = [0, 1, 2].map((i) => {               // 胶片颗粒：三张，按格号挑一张再随机错位
    const s = 256, c = canvas(s, s), x = c.getContext('2d'), id = x.createImageData(s, s), r = MV.rng('grain' + i);
    for (let k = 0; k < s * s; k++) { const v = r(), o = k * 4; if (v < 0.5) id.data[o + 3] = (0.5 - v) * 2 * 32; else { id.data[o] = id.data[o + 1] = id.data[o + 2] = 255; id.data[o + 3] = (v - 0.5) * 2 * 24; } }
    x.putImageData(id, 0, 0); return c;
  });
  const gc = canvas(W * K, H * K), gx = gc.getContext('2d');   // 片门：黑底挖一个圆角 4:3 窗，边缘稍软
  gx.fillStyle = '#000'; gx.fillRect(0, 0, gc.width, gc.height);

}
async function ready() {
  await MV.font(`64px "${FONT_NAME}"`, LYRIC);   // 没下到：出片时报错停下，预览时写在播放条上

}
MV.page({ W, H, fps: FPS, duration: DUR, ready, draw: drawFrame, overlay });
</script></body></html>
