<!doctype html>
<!--
  像素游戏风（16-bit 时代的游戏画面）· 夏日午后的海边公路：少年骑单车冲下坡，在拍上冲过水洼溅起水花，菱形格子转场切到近景回头笑
  示范场景只为展示画法，做 MV 时场景、角色、构图从你的歌来。
  ------------------------------------------------------------------------------
  这是原生像素画，不是插画加像素滤镜。关键画法：
  1. 工具：Canvas 2D + kit.js 的 MV.page。只在 320×180 的小画布上画（LW×LH），每个格子存的是调色板序号：
     两个镜头各画进一块 Uint8Array 索引缓冲（BA、BB），合成到 BF，最后才按调色板转成 RGB，putImageData 到小画布，
     再 drawImage 整数倍放大到 W×H（1920×1080 是 ×6，1280×720 是 ×4，960×540 是 ×3）。
     MV.page 每帧会 reset 画布，imageSmoothingEnabled = false 要在 draw、overlay 里每帧重设，不然放大是糊的。
  2. 分层和视差：镜头一秒往右 14 格，一个方向走到底；每层乘自己的系数再取整到整像素：天 0、积雨云 0.05、小云 0.1、
     远岬和灯塔 0.15、帆船 0.2、海面浪纹 0.3、沙滩和浪 0.6、电线杆 0.9、护栏/路/草坡/少年 1、最前面的草丛 1.3。
     不缩放（缩放像素画会把格子弄得大小不一）。近景是跟拍：少年不动，背景按远近以不同速度往左走，护栏立柱最快。
  3. 颜色：一套 32 色的调色板 PAL（天和海共用 6 级蓝 + 白、浅海青 2、远岬 2、草绿 4、沥青和钢 4、头发 2、皮肤 2、
     珊瑚红 3、黄 2、沙 2、墨蓝轮廓 1、深蓝 1）。红只给少年（衣服、车架、脸上的红晕），远处灯塔一道暗红腰带（一屏一个强调色）。
  4. 渐变一律用 4×4 Bayer 有序抖动在相邻两格调色板之间取色（天、海、草坡、水洼、云的明暗），不用平滑渐变、不用半透明。
     抖动的格子跟着各自那层的世界坐标走（云按云自己的坐标），镜头移动、云飘的时候花纹不会「滑」。
     路面颗粒、草、浪的缺口查一张开页面时用 MV.rng 固定种子填好的 64×64 噪声表。
  5. 光：朝右上的太阳光。云按每团圆的法线算明暗再抖动；衣服按「离脊梁多远」分亮、中、暗三格；脖子在下巴底下暗两三格；
     海上的闪光按屏幕坐标（反光跟着太阳不跟镜头），一秒换 12 次。
  6. 角色：小号少年（远景，约 28 格高）上半身是手写的字符网格，车架按坡度转（角度取整到 5°，同一个角度的车一模一样），
     腿按脚蹬位置算膝盖；大号少年（近景，头约 26 格，约 3 倍）另画一套：身子、胳膊、腿用整数顶点的多边形和粗线段拼，
     五官、耳朵是手点的格子，头按「侧脸 → 转过来 → 回头笑」三张换。每个部件自动描 1 像素墨蓝轮廓（盖在前面的部件上，
     部件之间就有分界线）。海鸥这种十几格的小精灵描墨色会糊成一团黑：身子描灰、翅膀不描，翅尖一点墨。
  7. 动起来的手感：角色、浪、云、车轮一律按 12 fps 一张张换，不做补间；位置每帧取整到整像素。
     骑车 4 张（脚蹬位置）、车轮辐条 3 张、近景头发/背上/衣角/袖口 3 张、海鸥翅膀 4 张（上、平、下、平）、
     云边每 0.25 秒换一档（每团圆半径 ±0.5 格）、浪两拍一道推上沙滩、草叶 3 张一摆、小花 2 张点头。
     只有整格平移时 video_rhythm 会量成「几乎不动」，所以大一点的东西都在换张：远景靠少年和海鸥，近景靠飞过去的护栏立柱和头发。
  8. 卡拍的动作：拍 6 前轮压进水洼——水幕四张（翻起、最高、塌下、散开）、36 颗水珠走抛物线、水洼里两圈波纹、后轮甩起一串水、
     少年两腿翘起来；水在白护栏和浅色天前面容易看不见，水幕和水珠描一圈蓝（不是墨色）。之后路上一道湿车辙按抖动阈值渐渐变淡。
  9. 转场（菱形格子，拍 6.5 → 拍 8）：屏幕切成 16×16 的格子，格子中心对准近景少年的脸；离脸越近的格子越早开始，
     每格里一个菱形从中心长满整格，菱形里是近景、外面是远景，菱形边亮一格白。两个镜头这几拍都在画、都在动；
     每个像素要么是 A、要么是 B、要么是白，调色板以外的颜色一格都不出。最后一格正好在拍 8 长满。
     圆心对准「近景的脸」而不是「远景的小人」：先翻开的那几格就是他的脸，一眼认得出是同一个人推近了。
     整屏均匀的抖动溶解看着就是叠化，按格子、有方向地换才像游戏。
  10. 歌词：开源像素字体 Fusion Pixel 12px 在 12px 原尺寸画到小画布，alpha 二值化（>50% 才算有像素）后写进对话框那一层，
     放大后字也是一格一格的；字体没加载上：出片时报错停下，预览时先用系统字体同样二值化凑合看。对话框在最上层（overlay，透明处是 255），不跟镜头动、
     转场时也不动：白底、蓝边、墨蓝外框、外角缺一格，开窗三张（细缝 → 一半 → 整个），字用 MV.lyricAt 按半拍一个一个打出来，
     打完右下角 ▼ 跟拍子一上一下。对话框放在上面：远景的路和水洼、近景的身子都在下半屏。不加名字牌：名字也是歌词以外的字。
  画面只由 t 决定：随机数都用 MV.rng('元素名' + 序号)，不用 Math.random()、Date，不存上一帧。

  时间线（128 BPM，一拍 0.469 秒，拍从 0 数）：
    拍 0（0 秒）      少年在坡顶起步，越骑越快（匀加速）；海鸥从右上角掠过（0.15–2.5 秒），远处帆船、浪、云一直在动
    拍 4（1.875）     对话框开窗；拍 4.5 起每半拍打一个字（「洼」在拍 6、「都」在拍 8、「我」在拍 10）
    拍 6（2.81）      前轮压进水洼：溅水花
    拍 6.5–8（3.05–3.75）菱形格子转场；拍 8 落点整屏是近景（window.PLAN = [3.75]）
    拍 8–10           近景侧脸骑车，头发和衣角被风吹着，护栏立柱从右往左飞快掠过
    拍 10（4.69）     回头笑（侧脸 → 转过来 → 笑，最后一张落在拍上）；字打完，▼ 跟拍子跳到片尾（6 秒）
  速度：开页面（下 600 KB 字体 + 准备）约 3.5 秒；1920×1080 画一帧约 5.5 ms（最慢约 22 ms），连出 PNG 约 16 ms。
  出预览动图：render_frames.mjs --fps 12 --width 1280 --height 720 --format png 渲 72 帧 →
    ffmpeg -framerate 12 -i %06d.png -vf "split[a][b];[a]scale=640:360:flags=neighbor,palettegen=max_colors=32:reserve_transparent=0:stats_mode=full[p];
    [b]scale=640:360:flags=lanczos[s];[s][p]paletteuse=dither=none" -loop 0，约 1.14 MB，GIF 里正好是这 32 色。
    坑：lanczos 缩小会在格子边上混出过渡色，palettegen 直接吃 lanczos 的那份，平均出来的 32 色有 27 色偏了几级；
    调色板要从最近邻缩的那份生成（上面的写法），lanczos 的那份再按它取色。全用 flags=neighbor 逐像素一格不差，约 1.10 MB。
  外部资源：Fusion Pixel Font 12px Proportional SC（@fontsource 的包，jsDelivr 加载，OFL-1.1）。
-->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<script src="../../templates/mv/kit.js"></script>
<style>html, body { margin: 0; overflow: hidden; background: #000; }</style>
</head><body><script>
(() => {
'use strict';
// ───────────────────────── 基本参数 ─────────────────────────
const W = 1920, H = 1080, FPS = 30, DURATION = 6, BPM = 128;
MV.tempo(BPM, 0);                                     // 第 0 拍在 0 秒；下面所有时刻都从拍子算
const BEAT = 60 / BPM, BT = (n) => MV.beatTime(n);
const { clamp } = MV;
const LW = 320, LH = 180, NPX = LW * LH;              // 逻辑画布：一切都在这上面一格一格画，最后整数倍放大
const FONT_URL = 'https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-proportional-sc@5.3.0/files/fusion-pixel-12px-proportional-sc-latin-400-normal.woff2';
const LYRIC = '冲过水洼，海风都追不上我';

// 时间线（拍从 0 数；128 BPM 一拍 0.469 秒）
const T_BOX = BT(4);          // 对话框打开
const T_TYPE = BT(4.5);       // 第一个字；之后每半拍打一个字
const T_SPLASH = BT(6);       // 前轮压进水洼：溅水花
const T_WIPE = BT(6.5);       // 菱形格子转场开始
const T_LAND = BT(8);         // 转场落点：整屏换成近景
const T_TURN = BT(10);        // 回头笑
window.LYRICS = [[T_TYPE, DURATION + 1, LYRIC]];
window.PLAN = [+T_LAND.toFixed(3)];

// ───────────────────────── 调色板（32 色） ─────────────────────────
const PAL = [
  '#1c2436', // 0  墨蓝：所有轮廓
  '#2c3f66', // 1  深蓝：短裤、最深的影子
  '#235a9c', // 2  深海
  '#2f7cc6', // 3  海、天顶
  '#4b9be3', // 4  天
  '#7cbcf0', // 5  天（中）
  '#aedcf6', // 6  天边、云影
  '#e2f4fb', // 7  地平线的亮、云的暗面
  '#ffffff', // 8  白：云顶、浪花、护栏、高光
  '#26a3b0', // 9  浅海的青
  '#84ddd0', // 10 浪花的影、浅水
  '#86b9be', // 11 远岬亮面（带一点雾）
  '#5f97a3', // 12 远岬背光
  '#245c3f', // 13 深绿
  '#3d8c47', // 14 绿
  '#74c04f', // 15 草
  '#bde374', // 16 草尖的亮
  '#3d4150', // 17 沥青暗、轮胎
  '#5c6273', // 18 沥青
  '#8b92a3', // 19 沥青亮、钢
  '#c6ccd6', // 20 浅灰
  '#3f2723', // 21 头发
  '#c27a57', // 22 皮肤暗
  '#f7c9a0', // 23 皮肤
  '#b4313d', // 24 衣服、车架的暗红
  '#ef5848', // 25 珊瑚红：衣服和车架，全片唯一的强调色
  '#f8c94a', // 26 黄：路中线、鸟嘴、反光片
  '#fff3c4', // 27 浅暖黄：阳光在水上的闪
  '#ecd6a0', // 28 沙
  '#c9a872', // 29 湿沙
  '#7a4a38', // 30 头发的亮、电线杆的木头
  '#ff9a7c', // 31 衣服亮面、脸上的红晕
];
const RGB = PAL.map((h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);

// ───────────────────────── 缓冲和小工具 ─────────────────────────
const BA = new Uint8Array(NPX), BB = new Uint8Array(NPX), BF = new Uint8Array(NPX), BU = new Uint8Array(NPX);
const CLEAR = 255;                                    // 对话框那一层的「透明」
let CUR = BF;                                         // 现在往哪块缓冲画
function px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= LW || y >= LH) return; CUR[y * LW + x] = c; }
function get(x, y) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= LW || y >= LH) return -1; return CUR[y * LW + x]; }
function rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); }
function hline(x0, x1, y, c) { for (let x = x0; x <= x1; x++) px(x, y, c); }
function vline(x, y0, y1, c) { for (let y = y0; y <= y1; y++) px(x, y, c); }
const F12 = (t) => Math.floor(t * 12 + 1e-6);         // 12 fps 的帧号：角色、浪、云的「换张」都按它

// 4×4 Bayer 有序抖动：v 是连续值，在 ramp[floor(v)] 和下一格之间按格子的阈值选
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bt = (x, y) => (BAYER[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
function dith(ramp, v, x, y) { const n = ramp.length - 1; if (v <= 0) return ramp[0]; if (v >= n) return ramp[n]; const k = Math.floor(v); return v - k > bt(x, y) ? ramp[k + 1] : ramp[k]; }

// 纹理噪声表：开页面时用 MV.rng 固定种子填一次，按世界坐标取（路面颗粒、草、浪的缺口）
const TEX = new Float32Array(64 * 64);
{ const r = MV.rng('tex'); for (let i = 0; i < TEX.length; i++) TEX[i] = r(); }
const tex = (x, y) => TEX[((y & 63) << 6) | (x & 63)];

// ───────────────────────── 拼角色：一组组像素 + 自动描 1 像素轮廓 ─────────────────────────
// 每个部件先描一圈轮廓（盖在前面画过的部件上，部件之间就有分界线），再填自己的颜色
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const KEY = (x, y) => ((y + 1024) << 12) | (x + 1024);
function Comp() { this.m = new Map(); }
Comp.prototype.add = function (cells, outline) {
  if (outline !== undefined) {
    const own = new Set(); for (const [x, y] of cells) own.add(KEY(x, y));
    for (const [x, y] of cells) for (const [dx, dy] of N4) { const k = KEY(x + dx, y + dy); if (!own.has(k)) this.m.set(k, outline); }
  }
  for (const [x, y, c] of cells) this.m.set(KEY(x, y), c);
  return this;
};
Comp.prototype.blit = function () { for (const [k, c] of this.m) px((k & 4095) - 1024, (k >> 12) - 1024, c); };

// 字符网格：map 把字母换成调色板序号，'.' 透明
function gridCells(rows, map, x0, y0, flip = false) {
  const out = [], w = rows[0].length;
  rows.forEach((r, j) => {
    if (r.length !== w) throw new Error('精灵行宽不一致：' + r);
    for (let i = 0; i < w; i++) {
      const ch = r[flip ? w - 1 - i : i]; if (ch === '.') continue;
      const c = map[ch]; if (c === undefined) throw new Error('精灵里有没定义的字母：' + ch);
      out.push([x0 + i, y0 + j, c]);
    }
  });
  return out;
}
// 多边形：像素中心在里面的格子（整数顶点，边是干净的台阶）
function polyCells(pts, c) {
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const out = [];
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
    const cy = y + 0.5, xs = [];
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > cy) !== (yj > cy)) xs.push(xi + ((cy - yi) / (yj - yi)) * (xj - xi));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.ceil(xs[k] - 0.5); x + 0.5 < xs[k + 1]; x++) out.push([x, y, c]);
  }
  return out;
}
function discCells(cx, cy, r, c) {
  const out = [];
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
    if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) out.push([x, y, c]);
  return out;
}
// 粗线段（两头圆）：胳膊、腿
function capsule(x0, y0, x1, y1, r, c) {
  const out = [], vx = x1 - x0, vy = y1 - y0, L2 = vx * vx + vy * vy || 1;
  for (let y = Math.floor(Math.min(y0, y1) - r); y <= Math.ceil(Math.max(y0, y1) + r); y++)
    for (let x = Math.floor(Math.min(x0, x1) - r); x <= Math.ceil(Math.max(x0, x1) + r); x++) {
      const u = clamp(((x - x0) * vx + (y - y0) * vy) / L2), ex = x - (x0 + u * vx), ey = y - (y0 + u * vy);
      if (ex * ex + ey * ey <= r * r) out.push([x, y, typeof c === 'function' ? c(u, ex, ey) : c]);
    }
  return out;
}
// 1 像素的线（Bresenham）
function lineCells(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const out = []; const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, x = x0, y = y0;
  for (;;) {
    out.push([x, y, c]);
    if (x === x1 && y === y1) break;
    const e2 = 2 * err; if (e2 >= dy) { err += dy; x += sx; } if (e2 <= dx) { err += dx; y += sy; }
  }
  return out;
}

// ───────────────────────── 天、云（两个镜头共用） ─────────────────────────
const SKY = [3, 4, 5, 6, 7];
function skyFill(hz) {
  for (let y = 0; y < hz; y++) {
    const v = Math.pow(y / hz, 1.25) * 4;
    for (let x = 0; x < LW; x++) CUR[y * LW + x] = dith(SKY, v, x, y);
  }
}
// 云：几团圆拼起来、底是平的；按「右上来的光」算明暗，在 6 / 7 / 8 三格之间抖动过渡。
// 每团圆的半径每 0.25 秒换一档（±0.5 格）：云边上几格像素在换张，云一直是活的，但不会抖。
// 抖动的格子按云自己的坐标取，云飘的时候花纹跟着走、不「滑」。
function cloud(cx, base, puffs, t, key) {
  cx = Math.round(cx); base = Math.round(base);
  const f = Math.floor(F12(t) / 3), sh = MV.hash(key) % 3;
  const P = puffs.map(([dx, dy, r], i) => [cx + dx, base + dy, r + 0.5 * (((f + i * 2 + sh) % 3) - 1)]);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity;
  for (const [x, y, r] of P) { x0 = Math.min(x0, x - r); x1 = Math.max(x1, x + r); y0 = Math.min(y0, y - r); }
  for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(LH - 1, base); y++) for (let x = Math.max(0, Math.floor(x0)); x <= Math.min(LW - 1, Math.ceil(x1)); x++) {
    let best = -1, nx = 0, ny = 0;
    for (const [qx, qy, r] of P) {
      const dx = x - qx, dy = y - qy, d = Math.hypot(dx, dy);
      if (d <= r && r - d > best) { best = r - d; nx = dx / r; ny = dy / r; }
    }
    if (best < 0) continue;
    let b = 0.62 + 0.55 * (nx * 0.6 - ny * 0.8);      // 朝光的一面亮
    b -= 0.5 * clamp((y - (base - 7)) / 7);            // 底下一层暗
    px(x, y, y === base ? 6 : dith([6, 7, 8], b * 2.4, x - cx, y - base));

// 溅水花：压进水那一刻起，两片水幕往上翻（4 张）→ 水珠抛出去落回来；水洼里的波纹一圈圈往外走；后轮带起一串水。

function splashA(t) {

  }

    const tt = dt - d0; if (tt < 0) continue;

// ───────────────────────── 镜头 B：近景，大号精灵（跟着少年走的跟拍镜头） ─────────────────────────

// ── 大号少年（近景）：同一个人，另画一套约 3 倍大的；头按「侧脸 → 转过来 → 回头笑」三张换 ──
// 身体、胳膊、腿用整数顶点的多边形和粗线段拼出来，每个部件描 1 像素轮廓；五官是手点的格子
function headCells(view, f) {
  const m = new Map(), put = (cells) => { for (const [x, y, c] of cells) m.set(KEY(x, y), c); };
  const face = {
    P: [[13, 8], [21, 7], [23, 10], [23, 12], [25, 14], [23, 15], [23, 17], [22, 19], [19, 21], [15, 21], [12, 18]],
    Q: [[8, 8], [20, 7], [22, 10], [22, 14], [21, 17], [19, 20], [16, 22], [12, 21], [8, 17]],
    S: [[4, 8], [20, 8], [21, 12], [20, 17], [17, 21], [12, 23], [7, 21], [4, 17], [3, 12]],
  }[view];

    P: [[12, 2], [24, 6], [24, 9], [22, 8], [21, 11], [19, 8], [17, 10], [15, 8], [13, 9]],
    Q: [[7, 3], [23, 6], [23, 9], [21, 8], [20, 11], [17, 8], [15, 11], [12, 8], [10, 10], [7, 8]],
    S: [[2, 4], [22, 5], [22, 9], [20, 8], [19, 11], [16, 8], [13, 11], [11, 8], [8, 11], [6, 8], [4, 10], [2, 9]],

  const faceCells = polyCells(face, 23);
  put(faceCells);
  put(polyCells(fringe, 21));

    Q: { cells: [[11, 11, 0], [12, 11, 0], [11, 12, 0], [12, 12, 8], [11, 13, 0], [12, 13, 0], [18, 11, 0], [18, 12, 0], [18, 13, 0], [16, 15, 22],
      [14, 18, 24], [15, 18, 24], [16, 18, 24], [10, 16, 31], [11, 16, 31], [19, 16, 31]],

      [9, 16, 0], [10, 16, 8], [11, 16, 8], [12, 16, 8], [13, 16, 8], [14, 16, 0], [9, 17, 0], [10, 17, 24], [11, 17, 25], [12, 17, 25], [13, 17, 24], [14, 17, 0],
      [10, 18, 0], [11, 18, 0], [12, 18, 0], [13, 18, 0], [5, 15, 31], [6, 15, 31], [17, 15, 31], [18, 15, 31]],

const BIKE_KNEE = [[0, 0], [3, 3], [0, 6], [-3, 3]];             // 膝盖跟着脚蹬转：四张
function boyB(t) {
  const f = F12(t), pf = f & 3, bob = pf & 1;
  const N = [NECK_B[0], NECK_B[1] + bob];                      // 脖子根；蹬车时身子一张一沉
  const at = (dx, dy) => [N[0] + dx, N[1] + dy];
  const C = new Comp();
  // 前轮（只露出上面一截，辐条三张一转）和车头
  const FH = [272, 196];
  const wheel = [];
  for (let y = 150; y < LH; y++) for (let x = 230; x < LW; x++) {
    const d = Math.hypot(x - FH[0], y - FH[1]);
    if (d < 29 && d >= 26.6) wheel.push([x, y, 0]); else if (d < 26.6 && d >= 25.4) wheel.push([x, y, 19]);
  }

  C.add([...capsule(N[0] - 11, N[1] + 62, N[0] - 2, N[1] + 114, 2.2, 24), ...capsule(HB[0], HB[1], N[0] - 2, N[1] + 114, 2.4, 25)], 0);   // 立管、下管（往下出画）
  C.add(capsule(HT[0] - 2, HT[1] + 5, N[0] - 10, N[1] + 63, 2.2, 25), 0);              // 上管
  C.add(capsule(N[0] - 14, N[1] + 55, N[0] - 11, N[1] + 62, 1.6, 19), 0);               // 座管

  const hip = at(-8, 50), kn = BIKE_KNEE[pf], K = at(18 + kn[0], 70 + kn[1]);
  C.add(capsule(K[0], K[1], K[0] - 3, LH + 6, 3.8, (u, ex) => (ex < -1.2 ? 22 : 23)), 0);

  // 身子：往前倾，背在左；背上两处和衣角被风吹得一鼓一鼓（三张）
  const T = [[-4, 0], [5, 1], [9, 5], [11, 11], [12, 21], [10, 32], [7, 43], [2, 51], [-11, 54], [-19, 50], [-21, 38], [-18, 24], [-14, 10], [-8, 2]];
  const torso = polyCells(T.map(([x, y]) => at(x, y)), 25);
  const ph = f % 3, FL = [[2, 0], [4, 2], [3, -1]], fl = (k) => FL[(ph + k) % 3];
  const flaps = [
    [[-14, 13], [-18 - fl(0)[0], 18 + fl(0)[1]], [-18, 24]],
    [[-18, 29], [-22 - fl(1)[0], 35 + fl(1)[1]], [-21, 40]],
    [[-19, 45], [-29 - fl(2)[0] * 2, 51 + fl(2)[1]], [-15, 54]],

  const inTorso = new Set(torso.map(([x, y]) => KEY(x, y)));
  const folds = new Set();                                                    // 被风压在胸前的几道褶子
  for (const [a, b] of [[[8, 10], [-4, 15]], [[10, 20], [-6, 26]], [[8, 31], [-7, 36]]]) for (const [x, y] of lineCells(...at(...a), ...at(...b), 0)) folds.add(KEY(x, y));

    const rx = x - N[0], ry = y - N[1], w = rx * 0.984 + ry * 0.179;          // 离脊梁多远：正的是胸前（朝光）

  const view = t < T_TURN - 2 / 12 ? 'P' : t < T_TURN ? 'Q' : 'S';
  const HO = [N[0] - 15, N[1] - 26];
  C.add(headCells(view, f).map(([x, y, c]) => [HO[0] + x, HO[1] + y, c]), 0);

  C.add(capsule(S[0], S[1], E[0], E[1], 4.4, (u, ex, ey) => (u < 0.55 ? (ey < -2 ? 31 : ey > 2 ? 24 : 25) : ey > 1.2 ? 22 : 23)), 0);
  const sf = [[0, 0], [-2, 2], [-1, 1]][f % 3];
  C.add(polyCells([at(-1, 12), at(9, 19 + sf[1]), at(2 + sf[0], 19 + sf[1])], 24), 0);
  C.add(capsule(E[0], E[1], Wr[0], Wr[1], 3.2, (u, ex, ey) => (ey > 1 ? 22 : 23)), 0);
  C.add(capsule(Wr[0] - 2, Wr[1] + 3, Wr[0] + 8, Wr[1] + 4, 1.7, 17), 0);            // 车把
  C.add(discCells(Wr[0] + 2, Wr[1] + 2, 3, 23).map(([x, y]) => [x, y, y > Wr[1] + 3 ? 22 : 23]), 0);
  C.blit();
}

// ───────────────────────── 转场：菱形格子从少年的脸上一圈圈翻开 ─────────────────────────
// 屏幕切成 16×16 的格子，格子的中心对准近景里少年的脸（远景里他正骑到这附近）；离脸越近的格子越早开始，
// 每格里一个菱形从中心长满整格，菱形里是近景、外面还是远景，菱形的边亮一格白。
// 每个像素要么是 A 要么是 B 要么是白（调色板以外的颜色一格都不出），最后一格正好在拍 8 长满。
const TILE = 16, TAU = 0.2;
const WO = { x: NECK_B[0] - 3, y: NECK_B[1] - 14, dmax: 1 };
function initWipe() {
  const ti = (x) => Math.floor((x - WO.x + 8) / TILE), tj = (y) => Math.floor((y - WO.y + 8) / TILE);
  WO.dmax = Math.max(Math.abs(ti(0)), Math.abs(ti(LW - 1))) + Math.max(Math.abs(tj(0)), Math.abs(tj(LH - 1)));
}
function transition(t, a, b) {
  CUR = BA; a.draw(t);
  CUR = BB; b.draw(t);
  const span = T_LAND - TAU - T_WIPE;
  for (let y = 0; y < LH; y++) {
    const j = Math.floor((y - WO.y + 8) / TILE), cy = WO.y + j * TILE - 0.5;
    for (let x = 0; x < LW; x++) {
      const i = Math.floor((x - WO.x + 8) / TILE), cx = WO.x + i * TILE - 0.5;
      const s = T_WIPE + span * Math.pow((Math.abs(i) + Math.abs(j)) / WO.dmax, 0.8);
      const r = 16.5 * clamp((t - s) / TAU), m = Math.abs(x - cx) + Math.abs(y - cy), p = y * LW + x;
      BF[p] = m < r - 1 ? BB[p] : m < r ? 8 : BA[p];
    }
  }
}

// ───────────────────────── 镜头表 ─────────────────────────
const SHOTS = [
  { name: '海边公路：冲下坡、溅水花', start: 0, end: T_LAND, draw: shotRoad },
  { name: '近景：回头笑', start: T_WIPE, end: DURATION + 1, draw: shotClose },
];
function compose(t) {
  const live = SHOTS.filter((s) => t >= s.start && t < s.end);
  if (live.length >= 2) transition(t, live[0], live[1]);
  else { CUR = BF; (live[0] || SHOTS[SHOTS.length - 1]).draw(t); }
}

// ───────────────────────── 字：像素字体在 12px 原尺寸画到小画布，二值化 ─────────────────────────
const GLYPHS = {};
function buildGlyphs(family) {
  const cv = document.createElement('canvas'); cv.width = 32; cv.height = 32;
  const g = cv.getContext('2d', { willReadFrequently: true });
  for (const ch of new Set(Array.from(LYRIC))) {
    g.clearRect(0, 0, 32, 32); g.fillStyle = '#fff'; g.textBaseline = 'top'; g.font = `12px ${family}`;
    g.fillText(ch, 2, 2);
    const adv = Math.round(g.measureText(ch).width), d = g.getImageData(0, 0, 32, 32).data, bits = [];
    for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) if (d[(y * 32 + x) * 4 + 3] > 127) bits.push([x - 2, y - 2]);
    GLYPHS[ch] = { adv: Math.max(adv, 4), bits };
  }
}

// ───────────────────────── 对话框（最上层、不跟镜头动） ─────────────────────────
const BOX = { x: 8, y: 6, w: 304, h: 30 };
function frameBox(x, y, w, h) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if ((i === 0 || i === w - 1) && (j === 0 || j === h - 1)) continue;        // 外角缺一格：圆角
    const e = Math.min(i, j, w - 1 - i, h - 1 - j);
    let c = e === 0 ? 0 : e === 1 ? 3 : e === 2 ? 6 : 8;
    if (e === 1 && (i === 1 || i === w - 2) && (j === 1 || j === h - 2)) c = 0;
    px(x + i, y + j, c);
  }
}
function drawUI(t) {
  BU.fill(CLEAR);
  if (t < T_BOX) return false;
  CUR = BU;
  const k = F12(t) - F12(T_BOX);
  if (k < 2) { const hh = k === 0 ? 4 : 14; frameBox(BOX.x, BOX.y + ((BOX.h - hh) >> 1), BOX.w, hh); return true; }   // 开窗：细缝 → 一半 → 整个
  frameBox(BOX.x, BOX.y, BOX.w, BOX.h);
  const L = MV.lyricAt(t, { per: BEAT / 2, pop: 1 / 60, tail: 9, gap: 0 });
  let cx = BOX.x + 12, last = -1;
  const ty = BOX.y + 9;
  if (L) for (const c of L.chars) {
    if (c.u <= 0) break;
    const gph = GLYPHS[c.ch]; if (!gph) continue;
    for (const [gx, gy] of gph.bits) px(cx + gx + 1, ty + gy + 1, 20);
    for (const [gx, gy] of gph.bits) px(cx + gx, ty + gy, 0);
    cx += gph.adv; last = c.k;
  }
  if (L && last === L.chars.length - 1 && t >= T_TYPE + (L.chars.length - 0.5) * (BEAT / 2)) {
    const ax = BOX.x + BOX.w - 15, ay = BOX.y + BOX.h - 10 + (MV.beatPhase(t) < 0.5 ? 1 : 0);    // ▼ 跟着拍子一上一下
    hline(ax, ax + 4, ay, 25); hline(ax + 1, ax + 3, ay + 1, 25); px(ax + 2, ay + 2, 25);
  }
  return true;
}

// ───────────────────────── 上屏：索引缓冲 → RGB → 小画布 → 整数倍放大 ─────────────────────────
const sceneCv = document.createElement('canvas'); sceneCv.width = LW; sceneCv.height = LH;
const sctx = sceneCv.getContext('2d'), SIMG = sctx.createImageData(LW, LH);
const uiCv = document.createElement('canvas'); uiCv.width = LW; uiCv.height = LH;
const uctx = uiCv.getContext('2d'), UIMG = uctx.createImageData(LW, LH);
function toImage(buf, img) {
  const d = img.data;
  for (let i = 0; i < NPX; i++) {
    const c = buf[i];
    if (c === CLEAR) { d[i * 4 + 3] = 0; continue; }
    const rgb = RGB[c]; d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2]; d[i * 4 + 3] = 255;
  }
}
function drawFrame(g, t) {
  compose(t);
  toImage(BF, SIMG); sctx.putImageData(SIMG, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(sceneCv, 0, 0, W, H);
}
function drawOverlay(g, t) {
  if (!drawUI(t)) return;
  toImage(BU, UIMG); uctx.putImageData(UIMG, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(uiCv, 0, 0, W, H);
}

MV.page({
  W, H, fps: FPS, duration: DURATION, draw: drawFrame, overlay: drawOverlay,
  ready: async () => {
    let family = '"PixelZH"';
    try {
      const ff = new FontFace('PixelZH', `url(${FONT_URL})`);
      await ff.load(); document.fonts.add(ff);
    } catch (e) {
      // 没加载上要报出来：出片时 MV.fail 直接报错停下（Windows、Mac 的系统字体不一样）；预览时写在播放条上，先用系统字体二值化凑合看
      MV.fail(`像素字体没加载上：${FONT_URL}（${e && e.message || e}）`);
      family = '"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
    }
    buildGlyphs(family);
    initWipe();
  },
});
})();
</script></body></html>
