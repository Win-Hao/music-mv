<!doctype html>
<!--
  像素游戏风（16-bit 时代的游戏画面）· music-mv 画风样例「雪夜街角的小螃蟹」
  ------------------------------------------------------------------------------
  这是原生像素画，不是插画加像素滤镜。关键画法：
  1. 只在 320×180 的小画布上画（LW×LH），每个像素都是调色板里的一个序号：
     画面先画进 Uint8Array 索引缓冲 B（一个格子一个调色板序号），最后才按调色板转成 RGB。
     放大到成片时整数倍（视口 640×360 → ×2，1920×1080 → ×6），imageSmoothingEnabled = false。
  2. 一套固定调色板 PAL（24 色）：夜空蓝 5 级、雪 5 级、螃蟹红橙 6 级（含夜里的暗部）、木头 3 级、暖灯黄 3 级、被灯照到的暖雪 2 级。
     暖黄只给灯和窗（一屏一个强调色）。出 GIF 时 palettegen 要 max_colors=24 且 reserve_transparent=0，才一格不差。
  3. 渐变一律用 4×4 Bayer 有序抖动在相邻两格调色板之间取色（夜空、雪地远近、灯照的光池），
     不用平滑渐变、不用半透明叠加。抖动的格子跟着图层的世界坐标走，镜头移动时花纹不会“滑”。
  4. 打光 = 换调色板：灯亮以后按到灯的距离算一个亮度等级（0/1/2，同样 Bayer 抖动），
     每个像素按 LIT1 / LIT2 查表换成更亮更暖的那一格；螃蟹在暗处、灯下各用一套颜色（夜里暗红，灯下橘色）。
     亮灯那一帧整屏再按 FLASH 表提一级（老游戏的闪白），灯头两帧十字星芒。
     影子（螃蟹脚下、长椅右下）是“灯照不到的格子”：材质标 4，打光时跳过，所以在暖色光池里留一块冷蓝。
  5. 精灵都是手写的字符网格（BODY / CLAW / EYES / LAMP_HEAD / HEART / BANG …），字母对应调色板；螃蟹按部件拼（腿、眼柄、眼睛、身子、钳子），
     每个部件自动描 1 像素深色外轮廓，再整体按“暗处 / 灯下”两套色表上色。
     动作逐帧换画：走路 4 帧（12 fps 一帧一换）、吃惊、蹲、腾空、落地压扁、回弹，没有补间；位置一律取整到逻辑像素。
  6. 镜头：不缩放（缩放像素画会把格子弄得大小不一），改成整像素的视差平移：前景 5 秒移 10 格，房子 0.45 倍，远山 0.2 倍，天空不动。
  7. 雪是单像素 / 2×2 的点，三层（远、中、近）；星星闪烁 = 在几格调色板之间换色；窗户偶尔闪一下 = 换色。
  8. 字：开源像素字体 Fusion Pixel 12px（OFL，jsDelivr 上 @fontsource 的包）在 12px 原尺寸画到小画布，
     alpha 二值化（>50% 才算有像素）后写进索引缓冲，所以放大后字也是一格一格的。字体没加载上就退回系统字体同样二值化。
     歌词进经典 RPG 对话框：深底、2 像素边框、圆角缺角、左上角名字牌「小螃蟹」，一字一字打出来，打完右下角 ▼ 闪。
  9. 左上角一排像素红心是血条式小 UI，螃蟹冒爱心时第三颗补满。
  画面只由 t 决定：随机数都用「元素名 + 序号」做种子（rnd），不存上一帧状态。
-->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<style>html, body { margin: 0; overflow: hidden; background: #0a0d1f; } canvas { display: block; image-rendering: pixelated; }</style>
</head><body>
<canvas id="out"></canvas>
<script>
// ───────────────────────── 基本参数 ─────────────────────────
const DURATION = 5, BPM = 120, BEAT = 60 / BPM;
const LW = 320, LH = 180;                         // 逻辑画布：一切都在这上面一格一格画
const SCALE = Math.max(1, Math.floor(Math.min((window.innerWidth || 640) / LW, (window.innerHeight || 360) / LH)));
const FONT_URL = 'https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-proportional-sc@5.3.0/files/fusion-pixel-12px-proportional-sc-latin-400-normal.woff2';
const LYRIC = '把今天的星星，都留给你';
const NAME = '小螃蟹';

// ───────────────────────── 调色板（24 色） ─────────────────────────
const PAL = [
  '#0a0d1f', // 0  墨蓝（轮廓、最深的夜）
  '#131a3b', // 1  深夜蓝
  '#1d2a57', // 2  夜蓝
  '#2b3f78', // 3  蓝
  '#3f5a98', // 4  地平线蓝
  '#6680bb', // 5  远处雪影
  '#93aad6', // 6  雪影
  '#c3d2ec', // 7  雪
  '#eef3fb', // 8  亮雪
  '#ffffff', // 9  白（近处雪花、高光）
  '#4a1a22', // 10 螃蟹轮廓 / 砖红暗
  '#9c2a2a', // 11 暗红
  '#e04a2e', // 12 橘红
  '#ff8a4a', // 13 亮橘
  '#ffd9b0', // 14 肚子浅杏
  '#5a3328', // 15 深木
  '#8f5a3a', // 16 木
  '#c99a62', // 17 亮木
  '#e8a23c', // 18 琥珀
  '#ffd45e', // 19 暖黄（灯、窗）——全片唯一的强调色
  '#fff4c4', // 20 灯芯浅暖
  '#f2cf9a', // 21 被照亮的雪
  '#d2ae98', // 22 被照亮的雪影（暖灰）
  '#6e1f26', // 23 夜里螃蟹的暗部
];
const PAL_RGB = PAL.map((h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
// 灯光查表：一级（LIT1）、二级（LIT2）各把一格颜色换成更亮更暖的一格
const LIT1 = [1, 2, 3, 4, 5, 22, 22, 21, 20, 9, 15, 12, 13, 14, 20, 16, 17, 18, 19, 20, 20, 20, 21, 11];
// 亮灯那一帧整屏提一级（冷白的闪，不是整屏变黄）
const FLASH = [1, 2, 3, 4, 5, 6, 7, 8, 9, 9, 11, 12, 13, 14, 20, 16, 17, 18, 19, 20, 9, 20, 21, 11];
const LIT2 = [2, 3, 4, 5, 6, 21, 21, 20, 20, 9, 11, 12, 13, 14, 20, 16, 17, 18, 19, 20, 20, 20, 21, 11];

// ───────────────────────── 缓冲和小工具 ─────────────────────────
const B = new Uint8Array(LW * LH);   // 调色板序号
const M = new Uint8Array(LW * LH);   // 材质：0 世界，1 螃蟹（自己换色），2 光源（不再被照亮），3 UI，4 影子（灯照不到）
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bt = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return h >>> 0; }
const rnd = (key) => hash(key) / 4294967296;          // 种子 = 元素名 + 序号
function px(x, y, c, m = 0) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= LW || y >= LH) return; const i = y * LW + x; B[i] = c; M[i] = m; }
function rect(x, y, w, h, c, m = 0) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c, m); }
function hline(x0, x1, y, c, m = 0) { for (let x = x0; x <= x1; x++) px(x, y, c, m); }
function vline(x, y0, y1, c, m = 0) { for (let y = y0; y <= y1; y++) px(x, y, c, m); }
// 字符网格精灵：map 把字母换成调色板序号，'.' 透明
function spr(rows, map, x, y, flip = false, m = 0) {
  x = Math.round(x); y = Math.round(y);
  const w = rows[0].length;
  for (let j = 0; j < rows.length; j++) {
    const r = rows[j];
    if (r.length !== w) throw new Error('精灵行宽不一致：' + r);
    for (let i = 0; i < w; i++) {
      const ch = r[flip ? w - 1 - i : i];
      if (ch === '.') continue;
      const c = map[ch];
      if (c === undefined) throw new Error('精灵里有没定义的字母：' + ch);
      px(x + i, y + j, c, m);
    }
  }
}
// Bayer 抖动取色：v 是连续值，在 ramp[floor(v)] 和 ramp[floor(v)+1] 之间按格子阈值选
function dith(ramp, v, x, y) { const f = Math.max(0, Math.min(ramp.length - 1.0001, v)); const k = Math.floor(f); return (f - k) > bt(x, y) ? ramp[Math.min(k + 1, ramp.length - 1)] : ramp[k]; }

// 一组像素 + 自动描 1 像素外轮廓（轮廓画在这组像素外面一圈）
function outlined(cells, oc, m = 0) {
  const set = new Set(cells.map(([x, y]) => (y + 64) * 1024 + x + 64));
  for (const [x, y] of cells) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (!set.has((y + dy + 64) * 1024 + x + dx + 64)) px(x + dx, y + dy, oc, m);
  for (const [x, y, c] of cells) px(x, y, c, m);
}

// ───────────────────────── 时间轴 ─────────────────────────
const LAMP_ON = 2.5;
const frameOf = (t) => Math.floor(t * 12 + 1e-6);         // 12 fps 的帧号（逐帧换画用）
const camX = (t) => 2 * Math.min(t, DURATION);             // 前景 5 秒平移 10 格
const GROUND = 106;                                        // 地平线
const FEET = 139;                                          // 螃蟹脚踩的那一行
const LAMP_X = 150, LAMP_BASE = 128;                       // 路灯（世界坐标）
const BENCH_X = 192, BENCH_FEET = 126;
const CRAB_STOP = 166;                                     // 螃蟹身子左上角停在这（世界坐标）

// ───────────────────────── 天空、星星、月亮 ─────────────────────────
function drawSky(t) {
  for (let y = 0; y < GROUND; y++) {
    const v = 0.35 + Math.pow(y / GROUND, 1.25) * 3.3;
    for (let x = 0; x < LW; x++) px(x, y, dith([0, 1, 2, 3, 4], v, x, y));
  }
  // 月牙：在圆 A 里、又不在圆 B 里的格子；靠外的一圈用浅一格
  for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) {
    const a = (i - 7.5) ** 2 + (j - 7.5) ** 2, b = (i - 11) ** 2 + (j - 5) ** 2;
    if (a < 7.6 ** 2 && b > 7 ** 2) px(266 + i, 10 + j, a > 6.4 ** 2 || b < 8.2 ** 2 ? 7 : 8);
  }
  const f = frameOf(t);
  for (let i = 0; i < 64; i++) {
    const x = Math.floor(rnd('star-x' + i) * LW), y = Math.floor(Math.pow(rnd('star-y' + i), 1.3) * 80) + 2;
    if (x > 260 && x < 286 && y < 30) continue;
    const kind = rnd('star-kind' + i);
    const period = 6 + Math.floor(rnd('star-p' + i) * 14);               // 帧
    const ph = Math.floor(rnd('star-ph' + i) * period);
    const on = ((f + ph) % period) < Math.max(2, period * 0.6);
    const tw = ((f + ph) % period) === 0;                                // 闪一下
    if (kind < 0.72) px(x, y, tw ? 9 : on ? 7 : 5);
    else if (kind < 0.93) { px(x, y, tw ? 9 : 8); if (on) { px(x - 1, y, 5); px(x + 1, y, 5); px(x, y - 1, 5); px(x, y + 1, 5); } }
    else {
      px(x, y, 9); px(x - 1, y, 7); px(x + 1, y, 7); px(x, y - 1, 7); px(x, y + 1, 7);
      if (on || tw) { px(x - 2, y, 5); px(x + 2, y, 5); px(x, y - 2, 5); px(x, y + 2, 5); }
    }
  }
}

// ───────────────────────── 远山（视差 0.2） ─────────────────────────
function drawHills(t) {
  const off = Math.round(camX(t) * 0.2);
  for (let sx = 0; sx < LW; sx++) {
    const x = sx + off;
    const h1 = Math.round(94 + 4 * Math.sin(x * 0.021 + 1.3) + 2 * Math.sin(x * 0.057));
    for (let y = h1; y < GROUND + 2; y++) px(sx, y, y === h1 ? 4 : y < h1 + 3 ? dith([4, 3], (y - h1) / 3 * 1.5, x, y) : 3);
    const h2 = Math.round(99 + 3 * Math.sin(x * 0.034 + 4.1) + 2 * Math.sin(x * 0.09 + 2));
    for (let y = h2; y < GROUND + 2; y++) px(sx, y, y === h2 ? 5 : 2);
  }
  // 远处小松树剪影 + 远村的点点窗光
  for (let i = 0; i < 14; i++) {
    const wx = Math.floor(rnd('ftree' + i) * 360) - off;
    const by = Math.round(99 + 3 * Math.sin((wx + off) * 0.034 + 4.1) + 2 * Math.sin((wx + off) * 0.09 + 2)) + 1;
    const hgt = 5 + Math.floor(rnd('ftreeh' + i) * 4);
    for (let j = 0; j < hgt; j++) { const half = Math.floor(j / 2); hline(wx - half, wx + half, by - hgt + j, 1); }
    px(wx, by - hgt, 5);
  }
  const f = frameOf(t);
  for (let i = 0; i < 9; i++) {
    const wx = Math.floor(rnd('fwin' + i) * 340) - off, wy = 101 + Math.floor(rnd('fwiny' + i) * 4);
    px(wx, wy, (f + i * 3) % 23 === 0 ? 18 : 19, 2);
  }
}

// ───────────────────────── 房子（视差 0.45） ─────────────────────────
const HOUSES = [
  { x: 4, w: 44, wall: 26, roof: 16, c: [3, 2], kind: 'siding', door: 18, wins: [[6, 10], [32, 10]], chim: 30 },
  { x: 92, w: 38, wall: 22, roof: 14, c: [10, 15], kind: 'brick', door: 6, wins: [[22, 8]], chim: 8 },
  { x: 230, w: 56, wall: 34, roof: 18, c: [2, 1], kind: 'siding', door: 25, wins: [[6, 6], [42, 6], [6, 20], [42, 20], [24, 6]], chim: 40 },
  { x: 300, w: 40, wall: 24, roof: 15, c: [3, 2], kind: 'siding', door: 4, wins: [[24, 9]], chim: 26 },
];
function drawHouses(t) {
  const off = Math.round(camX(t) * 0.45), f = frameOf(t), base = 110;
  HOUSES.forEach((H, hi) => {
    const x = H.x - off, top = base - H.wall;
    // 烟囱 + 烟
    const cx = x + H.chim;
    rect(cx, top - H.roof + 2, 5, H.roof, 10); vline(cx, top - H.roof + 2, top, 0); vline(cx + 4, top - H.roof + 2, top, 0);
    hline(cx - 1, cx + 5, top - H.roof + 1, 7); hline(cx, cx + 4, top - H.roof, 8);
    for (let k = 0; k < 4; k++) {
      const age = ((t * 0.9 + k * 0.25 + hi * 0.13) % 1);
      const sx = cx + 2 + Math.round(Math.sin(age * 5 + hi) * 1.5 + age * 6), sy = top - H.roof - 2 - Math.round(age * 16);
      const s = age < 0.25 ? 2 : age < 0.7 ? 3 : 2;
      const col = age < 0.45 ? 5 : 4;
      if (s === 2) rect(sx, sy, 2, 2, col);
      else { hline(sx, sx + 2, sy + 1, col); vline(sx + 1, sy, sy + 2, col); }
    }
    // 墙
    for (let j = 0; j < H.wall; j++) for (let i = 0; i < H.w; i++) {
      let c = H.c[0];
      if (H.kind === 'siding' && j % 4 === 3) c = H.c[1];
      if (H.kind === 'brick' && (j % 4 === 3 || ((i + (Math.floor(j / 4) % 2) * 3) % 6 === 0 && j % 4 !== 3))) c = H.c[1];
      if (i >= H.w - 3) c = H.c[1];                      // 右边背光一条
      px(x + i, top + j, c);
    }
    vline(x - 1, top, base, 0); vline(x + H.w, top, base, 0);
    // 屋顶：雪盖住的三角
    const rw = H.w + 8, rx = x - 4;
    for (let j = 0; j < H.roof; j++) {
      const half = Math.round((rw / 2) * (j + 1) / H.roof);
      const mid = rx + Math.floor(rw / 2);
      for (let i = mid - half; i <= mid + half; i++) {
        const edge = i === mid - half || i === mid + half;
        const c = edge ? 6 : (j < 2 ? 8 : dith([8, 7], (j / H.roof) * 1.6, i, j));
        px(i, top - H.roof + j, c);
      }
    }
    hline(rx, rx + rw, top, 0); hline(rx + 1, rx + rw - 1, top + 1, H.c[1]);
    for (let i = rx + 2; i < rx + rw - 1; i++) { const r = rnd('icicle' + hi + ':' + i); if (r < 0.32) { px(i, top + 1, 8); if (r < 0.12) px(i, top + 2, 7); } }
    // 窗
    H.wins.forEach(([wx, wy], wi) => {
      const flick = rnd('win' + hi + ':' + wi + ':' + Math.floor(t * 6)) < 0.07;
      const lit = !(hi === 2 && wi === 4);
      rect(x + wx - 1, top + wy - 1, 8, 9, 0);
      for (let j = 0; j < 7; j++) for (let i = 0; i < 6; i++) {
        let c = lit ? (flick ? 18 : 19) : 2;
        if (lit && (i === 0 || j === 0)) c = flick ? 15 : 18;       // 窗框内侧的影子
        if (i === 2 || j === 3) c = 0;                               // 十字窗棂
        if (lit && !flick && i >= 3 && j >= 4) c = 20;               // 灯芯那一角亮一点
        px(x + wx + i, top + wy + j, c, lit ? 2 : 0);
      }
      hline(x + wx - 2, x + wx + 7, top + wy + 8, 8); hline(x + wx - 1, x + wx + 6, top + wy + 9, 6);  // 窗台积雪
    });
    // 门
    const dx = x + H.door, dh = 13;
    rect(dx - 1, base - dh - 1, 9, dh + 1, 0);
    rect(dx, base - dh, 7, dh, 15); vline(dx + 1, base - dh + 1, base - 1, 16); vline(dx + 4, base - dh + 1, base - 1, 16);
    px(dx + 5, base - 6, 19, 2);
    hline(dx - 2, dx + 8, base - dh - 2, 7);
    // 墙根积雪
    for (let i = -3; i < H.w + 3; i++) { const hh = 1 + Math.round(1.5 + 1.5 * Math.sin((i + hi * 7) * 0.5)); for (let j = 0; j < hh; j++) px(x + i, base - j, j === hh - 1 ? 8 : 7); }
  });
}

// ───────────────────────── 地面（前景，视差 1） ─────────────────────────
function drawGround(t) {
  const off = Math.round(camX(t));
  for (let y = GROUND; y < LH; y++) {
    const v = 0.35 + Math.pow((y - GROUND) / (LH - GROUND), 0.9) * 1.5;      // 远处暗、近处亮一点：雪影 → 雪
    for (let sx = 0; sx < LW; sx++) { const x = sx + off; px(sx, y, dith([5, 6, 7], v, x, y)); }
  }
  hline(0, LW - 1, GROUND, 6);
  // 雪面上几道缓坡：上沿亮一格、下面一格影子
  for (let i = 0; i < 12; i++) {
    const wx = Math.floor(rnd('ridge-x' + i) * 420) - 50 - off, wy = GROUND + 8 + Math.floor(rnd('ridge-y' + i) * 60);
    const len = 14 + Math.floor(rnd('ridge-l' + i) * 22);
    for (let k = 0; k < len; k++) {
      const yy = wy - Math.round(Math.sin((k / len) * Math.PI) * 2);
      px(wx + k, yy, wy > 140 ? 8 : 7); if (k > 1 && k < len - 2) px(wx + k, yy + 1, 5);
    }
  }
  // 前景两个雪堆（左下、右下）
  snowMound(10 - off, 180, 50, 14); snowMound(306 - off, 182, 64, 18);
  // 螃蟹走过的小脚印
  const cx = crabWorldX(t);
  for (let x = -40; x < cx + 6; x += 6) {
    const k = Math.round(x / 6) & 1, sx = x - off;
    px(sx, FEET - 1 + k * 2, 5); px(sx + 1, FEET - 1 + k * 2, 5); px(sx + 3, FEET + 2 - k * 2, 5);
  }
}
function snowMound(cx, by, w, h) {
  for (let j = 0; j < h; j++) {
    const f = j / h, half = Math.round((w / 2) * Math.sqrt(1 - f * f));
    for (let i = -half; i <= half; i++) {
      const top = j === h - 1 || Math.abs(i) === half;
      const c = top ? 8 : dith([6, 7, 8], 1.9 - (i + half) / (2 * half + 1) * 1.5 + f * 0.5, cx + i, by - j);
      px(cx + i, by - j, c);
    }
  }
}

// ───────────────────────── 松树（前景） ─────────────────────────
function drawTree(t) {
  const off = Math.round(camX(t)), cx = 40 - off, base = 122;

    const key = 'snow' + layer + ':' + i;
    const x0 = rnd(key + 'x') * (LW + 40), y0 = rnd(key + 'y') * (LH + 20);
    const sp = speed * (0.7 + rnd(key + 's') * 0.6);
    const y = ((y0 + sp * t) % (LH + 20)) - 10;
    const amp = 1 + rnd(key + 'a') * (layer + 1) * 1.5, ph = rnd(key + 'p') * 6.28;
    let x = x0 - off - 6 * t + amp * Math.sin(t * (1.2 + layer * 0.4) + ph);
    x = ((x % (LW + 40)) + LW + 40) % (LW + 40) - 20;
    const xi = Math.round(x), yi = Math.round(y);
    if (layer === 0) { if (yi < GROUND + 4) px(xi, yi, 6); }
    else if (layer === 1) px(xi, yi, 8);
    else { const big = rnd(key + 'b') < 0.55; px(xi, yi, 9); if (big) { px(xi + 1, yi, 9); px(xi, yi + 1, 8); px(xi + 1, yi + 1, 8); } }
  }
}

// ───────────────────────── 灯光（换色 + 抖动） ─────────────────────────
function lightPass(t) {
  const f = frameOf(t);
  if (t < LAMP_ON) return;
  const off = Math.round(camX(t)), lx = LAMP_X - off, ly = 56, gy = LAMP_BASE + 6;
  const flash = f === 30;
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
    const i = y * LW + x, m = M[i];
    if (m === 3 || m === 1) continue;                                        // UI 不动；螃蟹自己按暗处 / 灯下换整套颜色
    if (m === 2 || m === 4) { if (flash) B[i] = FLASH[B[i]]; continue; }      // 光源、影子不被灯照
    const dx = x - lx, wx = x + off;
    let I = 0;
    const d = Math.hypot(dx, (y - ly) * 1.1);
    I = Math.max(I, 2.2 * (1 - d / 19));                                    // 灯头四周
    if (y > ly + 6) {                                                       // 往下的光锥
      const fr = (y - ly - 6) / (gy - ly - 6), w = 7 + fr * 46;
      I = Math.max(I, (1 - Math.abs(dx) / w) * (0.55 + 0.25 * fr));
    }
    if (y >= GROUND + 4) {                                                  // 雪地上的光池
      const e = (dx / 78) ** 2 + ((y - gy) / 17) ** 2;
      I = Math.max(I, 2.4 * (1 - e));
    }
    const lvl = Math.min(2, Math.floor(I + bt(wx, y)));
    if (lvl === 1) B[i] = LIT1[B[i]]; else if (lvl === 2) B[i] = LIT2[B[i]];
    if (flash) B[i] = FLASH[B[i]];
  }
}
// 灯下的雪地上几颗一闪一闪的亮点
function drawGlints(t) {
  if (t < LAMP_ON) return;
  const off = Math.round(camX(t)), lx = LAMP_X - off, gy = LAMP_BASE + 6, k = Math.floor(t * 8);
  for (let i = 0; i < 26; i++) {
    const a = rnd('glint-a' + i) * Math.PI * 2, r = Math.sqrt(rnd('glint-r' + i)) * 0.85;
    const x = Math.round(lx + Math.cos(a) * r * 74), y = Math.round(gy + Math.sin(a) * r * 15);
    if (x < 0 || x >= LW || y < GROUND + 3 || y >= LH || M[y * LW + x] !== 0) continue;
    if (rnd('glint' + i + ':' + k) < 0.3) px(x, y, 9);
  }
}
// 亮灯头两帧：十字星芒
function drawFlare(t) {
  const f = frameOf(t);
  if (f < 30 || f > 31) return;
  const off = Math.round(camX(t)), lx = LAMP_X - off, ly = 56;
  const len = f === 30 ? 16 : 10;
  for (let k = 3; k < len; k++) {
    const c = k < len - 4 ? 20 : 19;
    px(lx - 9 - k + 3, ly, c, 3); px(lx + 9 + k - 3, ly, c, 3);
    if (k % 2 === 0) { px(lx - 6 - Math.floor(k * 0.7), ly - 5 - Math.floor(k * 0.7), 19, 3); px(lx + 6 + Math.floor(k * 0.7), ly - 5 - Math.floor(k * 0.7), 19, 3); }
    if (k % 2 === 0) { px(lx - 6 - Math.floor(k * 0.7), ly + 5 + Math.floor(k * 0.7), 19, 3); px(lx + 6 + Math.floor(k * 0.7), ly + 5 + Math.floor(k * 0.7), 19, 3); }
  }
}

// ───────────────────────── 字 ─────────────────────────
const GLYPHS = {};       // 字 → { w, h, bits }
function buildGlyphs(family) {
  const cv = document.createElement('canvas'); cv.width = 32; cv.height = 32;
  const g = cv.getContext('2d', { willReadFrequently: true });
  for (const ch of new Set((LYRIC + NAME).split(''))) {
    g.clearRect(0, 0, 32, 32); g.fillStyle = '#fff'; g.textBaseline = 'top'; g.font = `12px ${family}`;
    g.fillText(ch, 2, 2);
    const adv = Math.round(g.measureText(ch).width);
    const d = g.getImageData(0, 0, 32, 32).data, bits = [];
    for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) if (d[(y * 32 + x) * 4 + 3] > 127) bits.push([x - 2, y - 2]);
    GLYPHS[ch] = { adv: Math.max(adv, 4), bits };
  }
}
function text(str, x, y, c, shadow) {
  let cx = x;
  for (const ch of str) {
    const gph = GLYPHS[ch]; if (!gph) continue;
    for (const [gx, gy] of gph.bits) { if (shadow !== undefined) px(cx + gx + 1, y + gy + 1, shadow, 3); }
    for (const [gx, gy] of gph.bits) px(cx + gx, y + gy, c, 3);
    cx += gph.adv;
  }
  return cx - x;
}
function textW(str) { let w = 0; for (const ch of str) w += GLYPHS[ch] ? GLYPHS[ch].adv : 0; return w; }

// ───────────────────────── UI：对话框、名字牌、红心 ─────────────────────────
function frameBox(x, y, w, h, fill) {
  // 圆角缺角的 RPG 窗口：墨蓝外线 → 白 → 雪影 → 深底
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const e = Math.min(i, j, w - 1 - i, h - 1 - j);
    const corner = (i < 2 || i > w - 3) && (j < 2 || j > h - 3);
    if ((i === 0 || i === w - 1) && (j === 0 || j === h - 1)) continue;          // 外角缺一格
    let c = fill;
    if (e === 0) c = 0; else if (e === 1) c = 9; else if (e === 2) c = 6;
    if (corner && e === 1 && ((i === 1 || i === w - 2) && (j === 1 || j === h - 2))) c = 0;
    px(x + i, y + j, c, 3);
  }
}
function drawDialog(t) {
  const f = frameOf(t), open = 35;          // 2.917 秒开始开窗
  if (f < open) return;
  const X = 10, Y = 145, W = 300, Hh = 32;
  if (f === open) { frameBox(X, Y + 13, W, 6, 1); return; }            // 第一帧：一条细缝
  frameBox(X, Y, W, Hh, 1);
  // 名字牌
  const nw = textW(NAME) + 12;
  frameBox(X + 8, Y - 9, nw, 17, 2);
  text(NAME, X + 14, Y - 6, 13);
  // 歌词：打字机，一秒 10 个字
  const n = Math.max(0, Math.min(LYRIC.length, Math.floor((t - 3.0) * 10 + 1e-6) + 1));
  const s = LYRIC.slice(0, f >= 36 ? n : 0);
  const tx = X + 16;
  text(s, tx, Y + 12, 9, 2);
  if (n >= LYRIC.length && Math.floor(t * 4) % 2 === 0) {                 // 打完：▼ 闪
    const ax = X + W - 14, ay = Y + Hh - 9;
    hline(ax, ax + 4, ay, 19, 3); hline(ax + 1, ax + 3, ay + 1, 19, 3); px(ax + 2, ay + 2, 19, 3);
  }
}
const HUD_HEART = ['.kk.kk.', 'kxxkxxk', 'kxxxxxk', '.kxxxk.', '..kxk..', '...k...'];
function drawHUD(t) {
  const f = frameOf(t);
  for (let i = 0; i < 3; i++) {
    const full = i < 2 || f >= 43;
    const blink = i === 2 && f >= 42 && f < 46 && f % 2 === 0;
    spr(HUD_HEART, { k: 0, x: full ? (blink ? 13 : 12) : 2 }, 6 + i * 9, 6, false, 3);
    if (full) px(7 + i * 9, 7, 14, 3);
  }
}

// ───────────────────────── 合成一帧 ─────────────────────────
const out = document.getElementById('out');
out.width = LW * SCALE; out.height = LH * SCALE;
const octx = out.getContext('2d'); octx.imageSmoothingEnabled = false;
const small = document.createElement('canvas'); small.width = LW; small.height = LH;
const sctx = small.getContext('2d');
const IMG = sctx.createImageData(LW, LH);
function drawFrame(t) {
  B.fill(0); M.fill(0);
  drawSky(t);
  drawSnow(t, 0);
  drawHills(t);
  drawHouses(t);
  drawGround(t);
  drawTree(t);
  drawSnow(t, 1);
  drawBench(t);
  drawLamp(t);
  const c = drawCrab(t);
  drawSnow(t, 2);
  lightPass(t);
  drawGlints(t);
  drawFlare(t);
  drawBubbles(t, c);
  drawHUD(t);
  drawDialog(t);
  const d = IMG.data;
  for (let i = 0; i < LW * LH; i++) { const rgb = PAL_RGB[B[i]]; d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2]; d[i * 4 + 3] = 255; }
  sctx.putImageData(IMG, 0, 0);
  octx.imageSmoothingEnabled = false;
  octx.drawImage(small, 0, 0, LW * SCALE, LH * SCALE);
}

window.sceneReady = (async () => {
  let family = '"PixelZH"';
  try {
    const ff = new FontFace('PixelZH', `url(${FONT_URL})`);
    await ff.load(); document.fonts.add(ff);
  } catch (e) {
    console.warn('像素字体没加载上，退回系统字体二值化', e);
    family = '"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif';
  }
  buildGlyphs(family);
  drawFrame(0);
})();
window.renderAt = async (t) => { drawFrame(t); return out.toDataURL('image/png'); };
</script></body></html>
