<!doctype html>
<!--
  纸艺拼贴绘本（cut & torn paper collage）· music-mv 画风示例：雪夜街角的小螃蟹（5 秒，BPM 120，第 6 拍 = 2.5 秒路灯亮）

  这不是"插画 + 纸纹滤镜"。画面里每样东西都是一张单独剪 / 撕出来的纸片，像在桌上贴好、一张一张拍下来：
  1. 纸片：每张纸片画一次，缓存成离屏画布（piece()）。房子 = 墙一张纸 + 屋顶一张纸 + 窗户一块块小方纸贴上去 + 窗格细纸条；
     路灯 = 杆一条纸 + 灯头几块纸；长椅 = 几根纸条；雪地 = 撕开的白纸条；天 = 一整张深蓝卡纸；星星 = 剪的小星星和打孔器打的圆点
  2. 纸的纹理按纸种用代码生成（makeSheet）：卡纸 = 斑驳 + 纤维 + 杂点；牛皮纸 = 暖棕 + 深色碎屑 + 长纤维；旧报纸 = 米白 + 灰色小字行和网点图；
     花纸 = 圆点 / 条纹；薄棉纸 = 半透明 + 皱痕；横格纸 = 蓝横线 + 红边线。每种纸先做一大张，纸片从大张上随机位置"剪"下来。
     纹理只在纸片里，从不在整个画面上叠一层
  3. 边（outline()）：剪刀边 = 每 24–66 px 一个小折角的折线，轻微抖；撕纸边 = 噪声推出来的毛边，下面露一圈宽窄不一的白色纸芯，
     再加几根纤维毛刺。剪的纸片外面多一圈手剪的暖白边（宽窄不匀，粗剪成小段直线）；纸片里沿右下有一点纸厚的暗线、左上一点亮线
  4. 层次：每张纸片往右下投一小块软影子（灯在左上），影子烘进纸片的缓存里；螃蟹整个垫高一层，在雪地上另有一块影子
  5. 定格：画面一秒只更新 12 次（STEP = floor(t*12)），每次每张纸片按"名字 + 第几张"抖 1–2 px、±0.5°（绕纸片自己的中心，大纸片转得少）；
     大张底纸（天、远山、雪地）是粘死的不抖；背景纸片还各有一点固定的歪（手贴的不正）。雪、星星按 STEP 走，镜头推近每 4 次更新挪一小格。
     螃蟹是纸偶：零件是硬纸片，绕关节转（肩上钉着铜脚钉），不压扁不拉伸；"压缩"靠腿张开、身子放低；走过的雪地上一格一格多出小脚印
  6. 路灯亮（2.5 秒）= 灯罩换成黄纸 + 黄色薄棉纸光锥和锯齿光晕"啪"地贴上 + 雪地上贴一块黄纸 + 拍照的灯打暖（world 里一次径向光）
  7. 歌词印在撕下来的横格纸条上，3.0 秒卡拍"啪"地贴上（放大回弹），两条半透明纸胶带随后一张一张贴住。画面上除了歌词不放别的字
  画面只由 t 决定：随机数全用"元素名 + 序号"做种子，不用 Math.random()，不存上一帧的状态。
  速度：Canvas 2D，开页面生成纸和纸片约 1–2 秒，之后一帧约 0.1 秒（1920×1080），走路线 A / B 都行。
  出 README 动图时：纹理多、每帧都在抖，sierra2_4a 抖动的 GIF 约 4.9 MB；paletteuse 换 dither=bayer:bayer_scale=4 约 3.8 MB，看着差不多。
-->

<script>
'use strict';
// ───────────────────────── 基础 ─────────────────────────

const cv = document.getElementById('c');
const PW = Math.max(320, Math.round(window.innerWidth || LW)), PH = Math.max(180, Math.round(window.innerHeight || LH));

let TILT = false;                        // 背景纸片贴得不正：每张固定歪一点（端点最多偏 3 px）
const BG_HOLD = 1, CAM_HOLD = 4;         // 镜头推近也是一格一格的：每 4 次更新挪一小格

// 种子随机数：同一个名字永远拿到同一串数
function hstr(s) { s = String(s); let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// ───────────────────────── 纸 ─────────────────────────
// kind: card 卡纸 / kraft 牛皮纸 / news 旧报纸 / dots 圆点花纸 / stripes 条纹花纸 / tissue 薄棉纸 / tape 纸胶带
const PAPER = {
  sky:     { base: '#233868', mot: 0.10, grain: 0.05, fibN: 1500, spkN: 2600 },
  sky2:    { base: '#29406F', mot: 0.10, grain: 0.05, fibN: 1500, spkN: 2600 },
  hill:    { base: '#3A5487', mot: 0.09, grain: 0.05 },
  print:   { base: '#A9B7CD', mot: 0.05 },
  snowB:   { base: '#D6DEEA', mot: 0.05, grain: 0.03, fib: [['#FFFFFF', 0.55], ['#A3B2C9', 0.3]], spk: [['#A9B6CB', 0.4]] },
  snowF:   { base: '#F4F0E7', mot: 0.04, grain: 0.028, fib: [['#FFFFFF', 0.6], ['#C9C0B0', 0.3]], spk: [['#CEC4B2', 0.4]], spkN: 900 },
  white:   { base: '#FFF9EE', mot: 0.03, grain: 0.022, fib: [['#E0D6C4', 0.35]], spk: [['#D8CEBC', 0.35]], spkN: 600 },
  kraft:   { base: '#B5875A', kind: 'kraft', mot: 0.10, grain: 0.06, fib: [['#7A5533', 0.4], ['#D8B68C', 0.35]], spk: [['#583A1E', 0.75], ['#E2C6A0', 0.5]], spkN: 5200, fibN: 2400 },
  kraftD:  { base: '#8A6340', kind: 'kraft', mot: 0.10, grain: 0.06, fib: [['#5A3E25', 0.4], ['#B48D64', 0.35]], spk: [['#3E2814', 0.7], ['#C29C72', 0.45]], spkN: 4200, fibN: 2000 },
  news:    { base: '#E5DFCF', kind: 'news', mot: 0.06, grain: 0.035, fib: [['#C7BEA9', 0.3]], spk: [['#9E9686', 0.35]], spkN: 900 },
  brick:   { base: '#9C4537' },
  slate:   { base: '#4C6087' },
  teal:    { base: '#3D7470', kind: 'dots', dot: '#EBDFC3' },
  stripe:  { base: '#E8DCC2', kind: 'stripes', stripe: '#B4584A', mot: 0.05 },
  pine:    { base: '#2E5A4F' },
  char:    { base: '#2C3140', mot: 0.08 },
  door:    { base: '#394A69' },
  win:     { base: '#F4C452', mot: 0.06, grain: 0.035 },
  winDim:  { base: '#D9A442', mot: 0.06, grain: 0.035 },
  winD:    { base: '#36405A' },
  glass:   { base: '#8B9AB4' },
  glassLit:{ base: '#FFDA62', mot: 0.05, grain: 0.03 },
  tissue:  { base: '#FFD45E', kind: 'tissue', mot: 0.16, grain: 0.03 },
  patch:   { base: '#F9DF92', mot: 0.06, grain: 0.03 },
  crab:    { base: '#E3603A', mot: 0.08 },
  crabD:   { base: '#C14A2D', mot: 0.08 },
  belly:   { base: '#F8DBB5', mot: 0.05, grain: 0.03 },
  spot:    { base: '#F39060' },
  cheek:   { base: '#F4A08E', mot: 0.05 },
  heart:   { base: '#E4524A', mot: 0.08 },
  cream:   { base: '#F3E8CB', mot: 0.05, grain: 0.03 },
  ruled:   { base: '#FBF6EA', mot: 0.03, grain: 0.02, fib: [['#E2D9C8', 0.3]], spk: [['#D6CCBA', 0.3]], spkN: 500 },
  tape:    { base: '#E7D8AE', kind: 'tape', mot: 0.08, grain: 0.03 },
  brass:   { base: '#C7A04A', mot: 0.05 },

function blot(g, w, h, r, amp, cell) {            // 斑驳：小图随机明暗 → 放大 + 模糊

  const sw = Math.ceil(w / cell) + 3, sh = Math.ceil(h / cell) + 3;
  const s = mk(sw, sh), sg = s.getContext('2d'), id = sg.createImageData(sw, sh), d = id.data;
  for (let i = 0; i < sw * sh; i++) { const v = r() * 2 - 1, c = v > 0 ? 255 : 0; d[i * 4] = c; d[i * 4 + 1] = c; d[i * 4 + 2] = c; d[i * 4 + 3] = Math.abs(v) * amp * 255; }
  sg.putImageData(id, 0, 0);
  g.save(); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.filter = `blur(${(cell * 0.4).toFixed(1)}px)`;
  g.drawImage(s, -cell * 1.5, -cell * 1.5, sw * cell, sh * cell); g.restore();

function grain(g, w, h, r, amp) {                 // 逐像素的细颗粒
  const id = g.getImageData(0, 0, w, h), d = id.data;

}
function specks(g, wL, hL, r, list, n) {         // 纸里的杂点、碎屑
  for (let i = 0; i < n; i++) {
    const [c, a] = list[(r() * list.length) | 0], rr = (0.35 + r() * r() * 1.7) * K;
    g.fillStyle = rgba(c, a * (0.35 + 0.65 * r())); g.beginPath();
    g.ellipse(r() * wL * K, r() * hL * K, rr, rr * (0.45 + r() * 0.55), r() * 3.14, 0, 6.283); g.fill();

    const [c, a] = list[(r() * list.length) | 0];
    g.strokeStyle = rgba(c, a * (0.35 + 0.65 * r())); g.lineWidth = (0.45 + r() * 0.7) * K;

function makeSheet(name, wL, hL, key) {

  const c = mk(w, h), g = c.getContext('2d'), r = R('sheet:' + name + ':' + key);

    const colW = 150 + r() * 40, gut = 16;
    for (let cx0 = -r() * 60; cx0 < wL; cx0 += colW + gut) {
      let y = 6 + r() * 20;
      while (y < hL) {
        const q = r();
        if (q < 0.035) {
          g.fillStyle = 'rgba(40,38,36,0.78)';
          for (let l = 0; l < 2; l++) { let x = cx0; const end = cx0 + colW * (0.6 + r() * 0.4); while (x < end) { const wl = 12 + r() * 30; g.fillRect(x * K, (y + l * 13) * K, Math.min(wl, end - x) * K, 8.5 * K); x += wl + 6; } }

    const s2 = 19;

      g.fillStyle = rgba(sp.dot, 0.8 + r() * 0.15); g.beginPath(); g.arc((x + (r() - 0.5) * 0.8) * K, (y + (r() - 0.5) * 0.8) * K, (3.7 + (r() - 0.5) * 0.5) * K, 0, 6.283); g.fill();

    for (let i = 0; i < 900 * area + 40; i++) { g.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,0.18)' : 'rgba(150,120,70,0.12)'; g.lineWidth = (0.6 + r()) * K; const x = r() * w, y = r() * h, L = (4 + r() * 14) * K, an = 1.1 + r() * 0.9; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(an) * L, y + Math.sin(an) * L); g.stroke(); }
  }

}
const SHEETS = {};
function sheetFor(name, wL, hL, key) {
  if (wL <= 1000 && hL <= 1000) { const k = 'S:' + name; if (!SHEETS[k]) SHEETS[k] = makeSheet(name, 1100, 1100, 'shared'); return { c: SHEETS[k], shared: true }; }
  return { c: makeSheet(name, wL + 4, hL + 4, key), shared: false };
}

// ───────────────────────── 纸片的边 ─────────────────────────
function polyArea(P) { let a = 0; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }
// pts：多边形顶点；torn：true（全撕）或者每条边一个 true/false（第 i 条边 = pts[i] → pts[i+1]）
// 返回 A = 纸的外轮廓（撕边处是白纸芯的边），B = 颜色层的轮廓（撕边处往里缩，露出纸芯），M = 手剪白边的轮廓
function outline(pts, torn, key, o) {

  const amp = o.amp ?? 4.2, jag = o.jag ?? 1.8, core = o.core ?? 4;

  let start = 0;
  if (Array.isArray(torn)) for (let i = 0; i < n; i++) if (isT(i) !== isT((i - 1 + n) % n)) { start = i; break; }
  const runs = [];
  for (let k = 0; k < n; k++) { const i = (start + k) % n, t = isT(i); if (!runs.length || runs[runs.length - 1].t !== t) runs.push({ t, e: [] }); runs[runs.length - 1].e.push(i); }
  const closedTorn = runs.length === 1 && runs[0].t;
  const A = [];

    let len = 0; for (const i of run.e) { const p = pts[i], q = pts[(i + 1) % n]; len += Math.hypot(q[0] - p[0], q[1] - p[1]); }
    let arc = 0;

      const ux = dx / L, uy = dy / L, nx = sg * uy, ny = -sg * ux;
      if (run.t) {                                // 撕边：沿边走，按弧长取噪声往外 / 往里推
        const N = Math.max(1, Math.round(L / 2.2));

          const s = k / N, a = arc + s * L, env = closedTorn ? Math.min(1, a / 8, (len - a) / 8) : Math.min(1, a / 9, (len - a) / 9);
          const off = env * (amp * fbm1(sA, a / 36) + jag * fbm1(sB, a / 6.5) + 0.55 * (r() - 0.5));

// 每个时刻螃蟹的姿势（按 STEP 取，定格）
function crabPose(ts) {
  const P = { x: 1210, lift: 0, tilt: 0, legs: [0, 0, 0, 0, 0, 0], elev: [24, 24], cl: [44, 44], open: [8, 8], lean: [0, 0], ext: 0,
    look: [0.65, 0.05], eyes: 'normal', mouth: 'smile', burst: 0, shadowK: 1 };
  if (ts < 2.0) {                                   // 横着走进来
    const p = ts / 2.0; P.x = -190 + (1210 + 190) * Math.sin(p * Math.PI / 2);
    const ph = STEP % 4, moving = ts < 1.84;
    if (moving) {
      const A = [3, 5, 1], B = [0, 2, 4];             // 两组腿交替抬（右 0、2 + 左 1 / 左 0、2 + 右 1）
      if (ph === 0) A.forEach((i) => (P.legs[i] = 18)); if (ph === 2) B.forEach((i) => (P.legs[i] = 18));
      if (ph === 1 || ph === 3) { P.legs = P.legs.map(() => 4); }
      P.lift = ph % 2 ? -2 : 4; P.tilt = ph === 0 ? 2 : ph === 2 ? -2 : 0;
      P.elev = ph < 2 ? [30, 18] : [18, 30]; P.open = ph < 2 ? [16, 4] : [4, 16];
    }
  } else if (ts < LIT_T) {                          // 停下：左看、右看、抬头看灯
    if (ts < 2.17) { P.look = [-1, 0.05]; P.lean = [-9, -9]; P.tilt = -2.5; }
    else if (ts < 2.34) { P.look = [1, 0.05]; P.lean = [9, 9]; P.tilt = 2.5; }
    else { P.look = [-0.55, -0.85]; P.lean = [-8, -8]; P.ext = 6; P.tilt = -1.5; P.elev = [20, 20]; }
  } else if (ts < 2.75) {                           // 灯亮：吃一惊
    const k = STEP - 30; P.lift = [30, 18, 6][k] ?? 0;
    P.elev = [58, 58]; P.cl = [30, 30]; P.open = [30, 30]; P.lean = [-14, 14]; P.ext = 12; P.eyes = 'small'; P.look = [-0.2, -0.6];
    P.mouth = 'o'; P.burst = k === 0 ? 1.22 : k === 1 ? 0.94 : 1; P.legs = P.legs.map(() => -10);
  } else if (ts < LYRIC_T) {                        // 预备：蹲下
    P.lift = -11; P.legs = P.legs.map(() => 11); P.elev = [6, 6]; P.cl = [30, 30]; P.open = [4, 4]; P.eyes = 'happy'; P.mouth = 'open'; P.lean = [-4, 4];
  } else if (ts < 3.34) {                           // 腾空，钳子举起来
    const k = STEP - 36; P.lift = [62, 96, 92, 52][k] ?? 0; P.legs = P.legs.map(() => 7);
    P.elev = [82, 82]; P.cl = [8, 8]; P.open = [26, 26]; P.eyes = 'happy'; P.mouth = 'open'; P.lean = [-6, 6]; P.ext = 6;
  } else {                                          // 落地回弹 → 举着钳子开心

    P.elev = [76, 76]; P.cl = [8, 8]; P.open = [20, 20]; P.eyes = 'happy'; P.mouth = 'open'; P.lean = [-5, 5];

}
function cput(p, x, y, rot, key, amp = 0.8, rmax = 0.6) {
  const [jx, jy, jr] = jit('crab-' + key, amp, rmax, p.size);
  ctx.save(); ctx.translate(x + jx, y + jy); if (rot || jr) ctx.rotate(rot + jr); ctx.drawImage(p.cv, p.x, p.y, p.w, p.h); ctx.restore();
}
function drawPupil(P, s) {
  if (P.eyes === 'happy') { marker(ctx, 4.6); ctx.beginPath(); ctx.moveTo(-10, 6); ctx.quadraticCurveTo(0, -12, 10, 6); ctx.stroke(); return; }
  const pr = P.eyes === 'small' ? 5.5 : 9, cx = P.look[0] * (21 - pr - 3.5), cy = P.look[1] * (21 - pr - 3.5);
  const r = R('pupil' + s + P.eyes + P.look.join()); ctx.fillStyle = '#211E1B'; ctx.beginPath();
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, rr = pr * (0.93 + r() * 0.12); ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,253,246,0.95)'; ctx.beginPath(); ctx.arc(cx - pr * 0.35, cy - pr * 0.38, Math.max(1.6, pr * 0.3), 0, 6.283); ctx.fill();
}
function drawMouth(P) {
  ctx.save(); ctx.translate(0, 10);
  if (P.mouth === 'o') { marker(ctx, 3.6); ctx.beginPath(); ctx.ellipse(0, 2, 6.5, 8, 0, 0, 6.283); ctx.stroke(); }
  else if (P.mouth === 'open') {
    ctx.fillStyle = '#3B1E18'; ctx.beginPath(); ctx.moveTo(-14, -1); ctx.quadraticCurveTo(0, 26, 14, -1); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = '#EE8A7C'; ctx.beginPath(); ctx.ellipse(0, 13, 8, 5.5, 0, 0, 6.283); ctx.fill(); ctx.restore();
    marker(ctx, 2.6); ctx.beginPath(); ctx.moveTo(-14, -1); ctx.quadraticCurveTo(0, 26, 14, -1); ctx.closePath(); ctx.stroke();
  } else { marker(ctx, 3.8); ctx.beginPath(); ctx.moveTo(-11, 0); ctx.quadraticCurveTo(0, 11, 11, 0); ctx.stroke(); }
  ctx.restore();
}
function drawCrab(P) {
  put(S.cshadow, P.x + 12, GROUND_F + 6, 0, P.shadowK);
  ctx.save();
  const [jx, jy, jr] = jit('crab', 1.2, 0.4, 300);
  ctx.translate(P.x + jx, GROUND_F - P.lift + jy); ctx.rotate(P.tilt * D2R + jr);
  for (const s of [-1, 1]) for (let i = 2; i >= 0; i--) { const L = LEGS[i]; cput(CR.leg[s][i], s * L.p[0], L.p[1], -s * P.legs[(s > 0 ? 3 : 0) + i] * D2R, 'leg' + s + i); }
  for (const s of [-1, 1]) {
    const k = s > 0 ? 1 : 0; ctx.save(); ctx.translate(s * 34, -146 - P.ext); ctx.rotate(P.lean[k] * D2R);
    cput(CR.stalk[s], 0, 0, 0, 'stalk' + s);
    const [ex, ey] = jit('crab-eyeJ' + s, 0.5, 0, 10); ctx.translate(ex, -60 + ey); ctx.drawImage(CR.eye[s].cv, CR.eye[s].x, CR.eye[s].y, CR.eye[s].w, CR.eye[s].h); drawPupil(P, s);
    ctx.restore();
  }
  ctx.save(); ctx.translate(0, -100);
  cput(CR.body, 0, 0, 0, 'body', 0.5, 0.3);
  for (const sp of CR.spots) cput(sp.p, sp.x, sp.y, 0, 'spot' + sp.x, 0.5);
  cput(CR.belly, 0, 0, 0, 'belly', 0.6, 0.4);
  cput(CR.cheek[0], -54, 8, 0, 'chl', 0.5); cput(CR.cheek[1], 54, 8, 0, 'chr', 0.5);
  drawMouth(P);
  ctx.restore();
  for (const s of [-1, 1]) {
    const k = s > 0 ? 1 : 0; ctx.save(); ctx.translate(s * 84, -112); ctx.rotate(-s * P.elev[k] * D2R);
    cput(CR.arm[s], 0, 0, 0, 'arm' + s);
    ctx.save(); ctx.translate(s * 46, 0); ctx.rotate(-s * P.cl[k] * D2R);
    cput(CR.fing[s], 0, 0, 0, 'fing' + s);
    ctx.save(); ctx.translate(s * 38 * CS, -9 * CS); ctx.rotate(-s * P.open[k] * D2R); cput(CR.dact[s], 0, 0, 0, 'dact' + s); ctx.restore();
    cput(CR.palm[s], 0, 0, 0, 'palm' + s);
    ctx.restore();
    cput(CR.brad, s * 2, 0, 0, 'brad' + s, 0.3);
    ctx.restore();
  }
  ctx.restore();
  if (P.burst) put(S.burst, P.x + 168, GROUND_F - P.lift - 292, -0.12, P.burst, 'burst', 1.2, 1);
}

// ───────────────────────── 每一帧 ─────────────────────────
function drawSnow(layer, n, s0, s1, v0, v1, ts) {
  for (let i = 0; i < n; i++) {
    const r = R('sn' + layer + ':' + i), x0 = r() * 2200 - 140, y0 = r() * 1300, v = v0 + r() * (v1 - v0), am = 6 + r() * 16, fr = 0.4 + r() * 0.9, ph = r() * 6.28, sc = s0 + r() * (s1 - s0), kind = (r() * S.flakes.length) | 0;
    const y = ((y0 + v * ts) % 1300) - 110, x = x0 + am * Math.sin(ts * fr * 6.283 + ph) - ts * v * 0.12;
    const rot = R('snr' + layer + i + ':' + STEP)() * 6.283;
    put(S.flakes[kind], x, y, rot, sc);
  }
}
function render(t) {
  STEP = Math.floor(t * UPS + 1e-6); const ts = STEP / UPS, lit = ts >= LIT_T - 1e-6, ls = STEP - 30;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#1f2f55'; ctx.fillRect(0, 0, PW, PH);
  // 镜头：很慢地推近 1.0 → 1.05（定格：也是一次一格）
  const camStep = Math.floor(STEP / CAM_HOLD) * CAM_HOLD, cam = 1 + 0.05 * Math.min(1, camStep / UPS / 4.67), CX = 1130, CY = 690;
  ctx.setTransform(K, 0, 0, K, OX, OY); ctx.translate(CX, CY); ctx.scale(cam, cam); ctx.translate(-CX, -CY);
  put(S.sky, 0, 0);
  put(S.sky2, 0, 0);
  HOLD = BG_HOLD; TILT = true;
  for (const s of S.stars) {                        // 星星一闪一闪：换大一点 / 小一点的那张，转一点
    const k = Math.floor((STEP + s.ph) / s.per), rr = R('tw' + s.i + ':' + k)();
    const sc = s.isStar ? 0.8 + rr * 0.4 : (rr < 0.18 ? 0.55 : 1), rot = s.isStar ? (rr - 0.5) * 0.35 : 0;
    put(s.p, s.x, s.y, rot, sc, 'st' + s.i, 1.2, 1);
  }
  put(S.moon, 1690, 150, -0.2, 1, 'moon', 1.2, 0.6);
  drawSnow(0, 60, 0.32, 0.5, 30, 70, ts);
  put(S.hill, 0, 0);                                // 大张的底纸是粘死的，不抖
  for (const h of S.houses) for (const q of h.parts) {
    if (q.w) {                                       // 窗户：暖光微微闪（亮的那张纸叠上去的多少在变）
      const w = q.w, key = 'w' + (w.x || 0) + (w.y || 0) + (w.a.x | 0);
      put(w.a, 0, 0, 0, 1, key, 0.9, 0.5);
      if (w.lit && w.b) { const f = 0.62 + 0.38 * (0.5 + 0.5 * n1(hstr(key), STEP / 2.6)); ctx.globalAlpha = f; put(w.b, 0, 0, 0, 1, key, 0.9, 0.5); ctx.globalAlpha = 1; }
      if (w.m) put(w.m, 0, 0, 0, 1, key + 'm', 0.7, 0.6);
      if (w.s) put(w.s, 0, 0, 0, 1, key + 's', 0.7, 0.6);
    } else put(q.p, q.x || 0, q.y || 0, 0, 1, 'h' + q.p.x + '_' + q.p.y, 1.0, 0.4);
  }
  S.tree.forEach((p, i) => put(p, 0, 0, 0, 1, 'tree' + i, 1, 0.4));
  put(S.bankB, 0, 0);
  drawSnow(1, 40, 0.5, 0.75, 50, 100, ts);
  if (lit) {                                         // 光锥、光晕：第 6 拍"啪"地贴上
    const pop = ls === 0 ? 1.07 : ls === 1 ? 0.98 : 1;
    put(S.cone, LAMP_X, 290, 0, pop, 'cone', 1.2, 0.2);
    put(S.cone2, LAMP_X, 290, 0, pop, 'cone2', 1.2, 0.2);
    put(S.halo, LAMP_X, 258, ls * 0.05, ls === 0 ? 1.2 : ls === 1 ? 0.93 : 1, 'halo', 1, 0.8);
  }
  const L = S.lamp;
  put(L.pole, 0, 0, 0, 1, 'lp-pole', 0.8, 0.15);
  put(L.base, 0, 0, 0, 1, 'lp-base', 0.8, 0.4);
  put(L.bar, 0, 0, 0, 1, 'lp-bar', 0.8, 0.4); put(L.knobL, LAMP_X - 37, 347, 0, 1, 'lp-kl', 0.6); put(L.knobR, LAMP_X + 37, 347, 0, 1, 'lp-kr', 0.6);
  put(L.collar, 0, 0, 0, 1, 'lp-col', 0.8, 0.4);
  put(L.house, 0, 0, 0, 1, 'lp-house', 0.8, 0.3);
  put(lit ? L.glassLit : L.glass, 0, 0, 0, 1, 'lp-glass', 0.6, 0.3);
  put(L.m1, 0, 0, 0, 1, 'lp-m1', 0.5, 0.3); put(L.m2, 0, 0, 0, 1, 'lp-m2', 0.5, 0.3);
  put(L.cap, 0, 0, 0, 1, 'lp-cap', 0.8, 0.3); put(L.capS, 0, 0, 0, 1, 'lp-capS', 0.8, 0.4); put(L.fin, LAMP_X, 170, 0, 1, 'lp-fin', 0.6);
  S.bench.forEach((p, i) => put(p, 0, 0, 0, 1, 'bench' + i, 0.9, 0.3));
  put(S.bankF, 0, 0);
  for (let k = 0, last = -1e9; k < 21 && k < STEP; k += 2) {      // 横着走过的每一步，两边各留一小串三个尖脚印（走到哪儿出到哪儿）

    }
  }
  if (lit) { const pop = ls === 0 ? 1.08 : ls === 1 ? 0.97 : 1; put(S.patchT, 1050, 902, 0, pop, 'patchT', 1, 0.2); put(S.patch, 1060, 900, 0, pop, 'patch', 1, 0.3); }

    const k = STEP - 42, sc = [0.5, 1.24, 0.9, 1.06][k] ?? 1, bob = ts < 4.2 ? (Math.floor(STEP / 2) % 2 ? -5 : 2) : 0, rot = ts < 4.2 ? (Math.floor(STEP / 2) % 2 ? 0.07 : -0.05) : 0;
    put(S.heart, P.x + 6, GROUND_F - 352 + bob, rot, sc, 'heart', 1.2, 0.8);
  }
  if (ts >= LYRIC_T - 1e-6) {                        // 歌词纸条卡在第 7 拍"啪"地贴上，胶带一张一张跟上
    const k = STEP - 36, sc = [1.13, 0.97][k] ?? 1, rot = (k === 0 ? -4.5 : k === 1 ? -1.8 : -2.5) * D2R, LX0 = 470, LY0 = 142;
    const at = (x, y) => [LX0 + x * Math.cos(rot) - y * Math.sin(rot), LY0 + x * Math.sin(rot) + y * Math.cos(rot)];
    put(S.lyric, LX0, LY0, rot, sc, 'lyric', 1, 0.3);
    if (k >= 1) { const [x, y] = at(-366, -40); put(S.tape[0], x, y, -0.75 + (k === 1 ? -0.1 : 0), k === 1 ? 1.12 : 1, 'tape0', 0.8, 0.5); }
    if (k >= 2) { const [x, y] = at(384, 4); put(S.tape[1], x, y, 1.22 + (k === 2 ? 0.12 : 0), k === 2 ? 1.12 : 1, 'tape1', 0.8, 0.5); }
  }

  // 拍照的光：灯亮前整体暗一点、偏冷；亮了以后灯下面暖、亮（这是拍摄时的布光，不是纸纹）
  ctx.globalCompositeOperation = 'multiply';
  if (!lit) { ctx.fillStyle = 'rgb(222,226,238)'; ctx.fillRect(-200, -200, 2400, 1500); }

    const g = ctx.createRadialGradient(1040, 640, 140, 1040, 640, 1150); g.addColorStop(0, 'rgb(255,255,255)'); g.addColorStop(1, 'rgb(218,222,236)'); ctx.fillStyle = g; ctx.fillRect(-200, -200, 2400, 1500);

  }

  const v = ctx.createRadialGradient(PW / 2, PH / 2, PH * 0.45, PW / 2, PH / 2, PH * 1.05); v.addColorStop(0, 'rgb(255,255,255)'); v.addColorStop(1, 'rgb(204,204,214)'); ctx.fillStyle = v; ctx.fillRect(0, 0, PW, PH);
  const fl = 250 + Math.round(R('flick' + camStep)() * 5); ctx.fillStyle = `rgb(${fl},${fl},${fl})`; ctx.fillRect(0, 0, PW, PH);

}

window.sceneReady = (async () => {
  try {
    await Promise.race([document.fonts.load(`700 55px "LXGW WenKai"`, LYRIC), new Promise((r) => setTimeout(r, 15000))]);
  } catch (e) { /* 字体没下载到就用系统字体 */ }
  buildScene();
  render(0);
})();
window.renderAt = async (t) => { await window.sceneReady; render(t); return cv.toDataURL('image/png'); };
