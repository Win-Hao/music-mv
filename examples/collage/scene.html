<!doctype html>
<!--
  纸艺拼贴绘本（cut & torn paper collage）· 赶早班：闹钟在床头柜上跳、吐司弹起来、女孩冲出门跑过斑马线、公交车门在她面前打开
  示范场景只为展示画法，做 MV 时场景、角色、构图从你的歌来。
  这一页示范「拼贴快切」整片方案：四张拼好的纸卡在拍上一张换一张，三次换法各不一样（滑进来、撕开、翻过去），
  每张卡看得清的时候停 0.9–1.7 秒，卡里还有卡在拍上的动作。6 秒 = 140 BPM 的 14 拍，用 kit.js 的 MV.page 搭，浏览器直接打开就能看。

  这不是「插画 + 纸纹滤镜」。画面里每样东西都是一张单独剪 / 撕出来的纸片，像在桌上贴好、一张一张拍下来：
  1. 工具：Canvas 2D。每张纸片开页面时画一次，缓存成离屏画布（piece()），每帧只是把纸片「贴」上去（put()）。
     闹钟 = 红卡纸圆 + 铜色圈 + 奶油色表盘 + 12 根小纸条刻度（没有数字）+ 三根纸条指针 + 中心一颗铜脚钉 + 两只铜铃 + 两只脚；
     吐司 = 金棕色的边一张 + 奶油色的心一张（上面刷一点烤色）；公交车 = 奶油色上身 + 青绿下身 + 一条红纸条 + 一格格薄棉纸车窗
  2. 纸（makeSheet()）：按纸种用代码生成一大张，纸片从大张上随机位置「剪」下来，纹理只在纸片里，从不整屏叠一层。
     牛皮纸 = 暖棕 + 深色碎屑 + 长纤维（床头柜、地板再画几道木纹）；格子布纹纸 = 横竖两组半透明色条，交叉处最深，细斜纹像织出来的；
     旧报纸 = 米白 + 一栏栏灰色短横条当字、两行粗块当标题、网点块当图（没有一个真字）；薄棉纸 = 半透明 + 皱痕（窗帘、车窗、热气、灯光）；
     圆点花纸、条纹花纸（被子上一块块拼布，沿边压一圈虚线针脚）；横格纸（歌词纸条）；纸胶带 = 半透明 + 细皱纹。都叠斑驳、细颗粒、杂点、纤维。
     点缀：纸胶带（歌词纸条两头）、订书钉（窗帘、擦手巾、太阳、站牌上各钉一颗）、铜脚钉（纸偶关节、钟心、车轮）
  3. 边（outline()）：剪刀边 = 每 24–66 px 一个小折角的折线；撕纸边 = 噪声推出来的毛边，下面露一圈宽窄不一的白纸芯和纤维毛刺。
     剪的纸片外面多一圈手剪的暖白边（宽窄不匀，粗剪成小段直线）；纸片里沿右下一点纸厚的暗线、左上一点亮线
  4. 分层：每张纸片往右下投一小块软影子（灯在左上），影子烘进纸片的缓存里；大张底纸（墙、天、路）粘死不抖，
     别的纸片每张有一点固定的歪（手贴的不正，端点最多偏 3 px）；女孩腾空时脚下贴一块软影子，跳得越高越小
  5. 颜色：暖的早晨：奶油、牛皮纸、番茄红、芥末黄、青绿、浅天蓝、桃色。不用深色底配亮色、不用紫色渐变
  6. 动起来：画面一拍只更新 5 次（140 BPM 下一秒 11.7 次，STEP = floor(拍 × 5)），拍点永远是某一张的第一帧，卡拍不会差半张。
     每张纸片每次按「名字 + 第几张」抖 1–1.4 px、转零点几度（绕自己的中心，大纸片转得少）。动作是一张张摆出来的关键姿势，不是补间：
     闹钟拍前三张抬起来、左右轮流歪，拍上落回桌面，脚边贴两道小纸条，铃边两套弧形纸条轮流换；吐司拍上弹出去；
     女孩是纸偶（头、头发、马尾、身子、裙子、书包、上下臂、手、大腿、小腿、袜子、鞋都是单独的纸片，肩、肘、胯、膝钉铜脚钉），
     零件是硬纸片，绕关节转，不压扁不拉伸，蹲、跳靠关节角度和身子高低；跑步一拍一大步、拍上落地，马尾跟着上下甩；
     公交车门打开 = 换成越来越窄的门片（定格动画的替换片），不是把一张门片压扁；热气每张换一缕剪好的形状
  7. 光：拍照的灯在左上：overlay 最后叠一层暖色 soft-light、一圈暖灰暗角，歌词纸条也吃到同样的光。
     车里的灯 = 一块黄色薄棉纸「啪」地贴进门里 + 一块更淡的落到人行道上；红绿灯亮 = 换一张绿纸片 + 后面一圈黄薄棉纸
  8. 转场（都是这画风自己的手法，落点卡在拍上，window.PLAN 写了三个落点）：
     第 3 拍「滑进来」：新卡从右边 3 张滑进来，旧卡被推着往左走（走 55% 的路），新卡左边一圈手剪白边、往旧卡上投影；
       滑动那几张拍的时候纸在动，照片上糊出一小段拖影（这一张那段路取 12 个位置平均，见 slideIn），卡边的白边和影子最后清楚地贴一次；
       拍上那张落位，再往回弹 12 px
     第 6 拍「撕开」：吐司那张先从上往下裂一道缝（缝里露出下一张），再撕到底、两半绕撕口下端往两边转开甩出画面，
       撕口露白纸芯和纤维，两半往下面那张投影；拍上正好甩干净
     第 10 拍「翻过去」：右下角掀起来往左上翻（折线以外沿折线翻到上面），背面是素纸，靠折线一侧暗、中间亮，影子落在下面那张上
  9. 歌词：一句原创歌词手写在撕下来的横格纸条上（霞鹜文楷粗体，1920 宽时 66 px，每个字各歪一点、大一点小一点、上下错一点，
     描两遍、再吃掉一些墨点像笔没水），第 4 拍「啪」地贴上（放大回弹），下一张、下下张两条纸胶带一条一条贴住。
     纸条在 overlay 里画，最上层、不跟卡走；歌词出来以后的三张卡，上面那一条（y 50–200、x 350–1170）都留空，纸条不压东西。
     画面上除了歌词不放别的字：表盘只有刻度，车上没有线路号，站牌只是一块圆纸，报纸用横条代替字
  时间线（拍从 0 数，一拍 0.4286 秒，一拍 5 张）：
     0–2 拍 闹钟一拍一跳（第 1、2 拍落地），秒针一张一格走，窗外太阳一格格升；第 2 拍被窝里的女孩睁眼
     第 3 拍（1.286 s）吐司那张滑进来落位    第 4 拍 歌词纸条贴上，吐司机开始抖    第 5 拍 吐司弹起来
     第 6 拍（2.571 s）撕开，露出街口那张     第 7 拍 门被撞开、女孩叼着吐司冲出来、红灯换绿灯   第 8、9 拍 跑过斑马线、拍上落地
     第 10 拍（4.286 s）翻页露出公交车，女孩急刹、喘气    第 11 拍 车门打开、车里的灯亮    第 12 拍 起跳
     第 13 拍 落在车门台阶上、车身一沉，举起手、小臂往后摆一下到片尾
  速度（4 核、无独显的 Windows，render_frames 报的数）：开页面先下字体、烤纸和纸片，1920×1080 约 6 秒（1280×720 约 3 秒）；
     之后 1920×1080 一帧约 0.07 秒，转场那几张两张卡都画、约 0.1 秒。
  出预览动图（6 秒，12 fps 共 72 张）：
     node scripts/render_frames.mjs --page examples/collage/scene.html --fps 12 --width 1280 --height 720 --format png --out <临时目录> --workers 1
     ffmpeg -framerate 12 -i <临时目录>/%06d.png -vf "scale=640:360:flags=lanczos,split[a][b];[a]palettegen=max_colors=176:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle" -loop 0 <输出>.gif
     4.1 MB（640×360、72 帧）。纹理多、每张都在抖：同样 176 色换 sierra2_4a 抖动是 6.1 MB；bayer 抖动看着差不多
  外部资源：霞鹜文楷 LXGW WenKai（字体 OFL-1.1，网页字体包 lxgw-wenkai-webfont 是 MIT，jsDelivr 加载）
  坑：
  - 拍照的灯、暗角放在 overlay 里最后叠，歌词纸条也要吃到同样的光，不然像贴在镜头上
  - 「每张照片曝光差一点点」的闪只差 1% 亮度，看不太出来，却让 GIF 每帧整屏都变（bayer 点阵整屏翻）：同样 192 色从 4.3 MB 涨到 6.0 MB。
    这版不闪，定格感靠纸片抖
  - 拍子和定格要对齐：按「一秒 12 张」取整，140 BPM 的拍点落在两张中间，落位会早或晚半张；改成按拍取整（一拍 5 张）
  - 整张卡滑进来，一张就挪 600 多 px。拖影取的路太长（取一张走的一半）就成了一叠重影、整屏发虚；取 6% 的路、12 个位置刚好，
    位置太少，竖边会出一道道分开的残影；卡边的白边和影子要另外清楚地贴，不然糊得看不出是一张卡
  - 卡比画面每边宽 40 px（出血），落位往回弹、撕开时两半转起来，边上才不会露出黑底
  - 撕开的两半是同一条撕口：先在准备时算好一条撕线，两半各自往里缩一点露白纸芯，不然两边的毛边对不上；
    拍前那一张两半还要挂在画面两边，拍上才甩干净，不然看着早落位一张
  - 侧面的纸偶，近侧的手一抬就挡脸：举手就举过头、往后斜一点（压着后脑勺），往前伸的手放在下巴以下；远侧的手举起来会藏在头后面
  - 全角标点画在字框的左下角：按字框居中画，逗号会缩进前一个字里看不见；标点按格子左边对齐
  - 只给小纸片用的纸别烤 1100 见方的大张（按大小分 600、1100 两档共用），开页面能省三分之一的时间
-->

'use strict';
// ───────────────────────── 拍子、镜头表 ─────────────────────────
const W = 1920, H = 1080, FPS = 30, DURATION = 6;
MV.tempo(140, 0);                                    // 一拍 60/140 = 0.4286 秒，6 秒正好 14 拍
const UPB = 5;                                       // 定格：一拍拍 5 张（一秒 11.7 张），拍点永远是某一张的第一帧
const stepOf = (t) => Math.floor(MV.beat(t) * UPB + 1e-6);
const at = (beat) => beat * UPB;                     // 第几拍 → 第几张
let STEP = 0;                                        // 现在是第几张（drawFrame、overlay 一开头设好）
// 四张卡。land：在第几拍完全落位；len：转场占落位前几张；trans：怎么接上一张；settle：落位后头两张往回弹多少 px
const SHOTS = [
  { name: '闹钟在床头柜上跳', land: 0, draw: card1 },
  { name: '吐司从吐司机里弹起来', land: 3, len: 3, trans: slideIn, settle: [-12, 3], draw: card2 },
  { name: '女孩冲出门、跑过斑马线', land: 6, len: 4, trans: tearOpen, draw: card3 },
  { name: '公交车门在她面前打开', land: 10, len: 4, trans: pageTurn, draw: card4 },
];
window.PLAN = SHOTS.slice(1).map((s) => +MV.beatTime(s.land).toFixed(3));     // 转场落点（成片秒）
const LYRIC_BEAT = 4;
window.LYRICS = [[MV.beatTime(LYRIC_BEAT), DURATION, '一路小跑，追上早晨']];      // 原创的一句：第 4 拍贴上，留到片尾

// ───────────────────────── 小工具 ─────────────────────────
const D2R = Math.PI / 180;
const R = (key) => MV.rng(key);                      // 同一个名字永远拿到同一串随机数
const fbm = (key, x) => 0.62 * MV.noise(key, x) + 0.27 * MV.noise(key + '2', x * 2.13) + 0.11 * MV.noise(key + '3', x * 4.37);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const hex2 = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => { const c = hex2(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const shade = (h, f) => '#' + hex2(h).map((v) => Math.max(0, Math.min(255, Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)))).toString(16).padStart(2, '0')).join('');
let K = 1;                                           // 逻辑 px → 物理 px：纸和纸片按出图的分辨率烤（ready 里定）

// ───────────────────────── 纸 ─────────────────────────
// kind：card 卡纸 / kraft 牛皮纸 / news 旧报纸 / gingham 格子布纹纸 / dots 圆点花纸 / stripes 条纹花纸 / tissue 薄棉纸 / tape 纸胶带
const PAPER = {
  white:   { base: '#FFF9EE', mot: 0.03, grain: 0.022, fib: [['#E0D6C4', 0.35]], spk: [['#D8CEBC', 0.35]], spkN: 600 },
  back:    { base: '#EDE3CE', mot: 0.06, grain: 0.03, fib: [['#D0C1A4', 0.45], ['#FFFFFF', 0.3]], spk: [['#B5A589', 0.45]], spkN: 1100 },
  cream:   { base: '#F4E9CF', mot: 0.05, grain: 0.03 },
  kraft:   { base: '#BC8D5E', kind: 'kraft', mot: 0.10, grain: 0.06, fib: [['#7E5835', 0.4], ['#DBB98E', 0.35]], spk: [['#5B3C20', 0.7], ['#E4C8A2', 0.5]], spkN: 5000, fibN: 2300 },
  kraftD:  { base: '#8F6643', kind: 'kraft', mot: 0.10, grain: 0.06, fib: [['#5C4027', 0.4], ['#B68F66', 0.35]], spk: [['#402A16', 0.7], ['#C59E74', 0.45]], spkN: 4200, fibN: 2000 },
  news:    { base: '#E8E2D2', kind: 'news', mot: 0.06, grain: 0.035, fib: [['#C9C0AB', 0.3]], spk: [['#A0988A', 0.35]], spkN: 900 },
  gingB:   { base: '#F6F1E4', kind: 'gingham', ink: '#86AAD0', cell: 40, mot: 0.05, grain: 0.03 },
  gingR:   { base: '#F8EFE0', kind: 'gingham', ink: '#D9584A', cell: 22, mot: 0.05, grain: 0.03 },
  dotsY:   { base: '#E8B443', kind: 'dots', dot: '#FFF4D8', mot: 0.06 },
  dotsT:   { base: '#4F978D', kind: 'dots', dot: '#E8EFDC', mot: 0.06 },
  stripe:  { base: '#F0E4CB', kind: 'stripes', stripe: '#D96A52', mot: 0.05 },
  tissueY: { base: '#FFD66A', kind: 'tissue', mot: 0.16, grain: 0.03 },
  tissueW: { base: '#FFFDF6', kind: 'tissue', mot: 0.10, grain: 0.02 },
  tissueC: { base: '#F4A08C', kind: 'tissue', mot: 0.14, grain: 0.03 },
  tissueB: { base: '#BFE2EE', kind: 'tissue', mot: 0.10, grain: 0.02 },
  tissueR: { base: '#E5544A', kind: 'tissue', mot: 0.12, grain: 0.03 },
  tissueG: { base: '#B4B9BF', kind: 'tissue', mot: 0.10, grain: 0.02 },
  tape:    { base: '#E9DAB0', kind: 'tape', mot: 0.08, grain: 0.03 },
  ruled:   { base: '#FBF6EA', mot: 0.03, grain: 0.02, fib: [['#E2D9C8', 0.3]], spk: [['#D6CCBA', 0.3]], spkN: 500 },
  red:     { base: '#E05B3F' },
  redD:    { base: '#B9442F' },
  mustard: { base: '#E8B240', mot: 0.07 },
  mustD:   { base: '#C48F2A', mot: 0.07 },

  tealD:   { base: '#3B7A72' },

  sky2:    { base: '#CBE5EC', mot: 0.06, grain: 0.03 },
  haze:    { base: '#9DB8CB', mot: 0.07 },
  peach:   { base: '#F7C49B', mot: 0.06, grain: 0.03 },
  dawn:    { base: '#FBE3A6', mot: 0.06, grain: 0.03 },
  sun:     { base: '#F29A3A', mot: 0.07 },
  sunY:    { base: '#F4BE3E', mot: 0.07 },
  green:   { base: '#6FA45B', mot: 0.09 },
  greenD:  { base: '#4E7F45', mot: 0.09 },
  road:    { base: '#8D939E', mot: 0.09, grain: 0.05 },
  stone:   { base: '#CFCBC1', mot: 0.07 },
  stoneD:  { base: '#A9A59D', mot: 0.07 },
  lamp:    { base: '#5D5A57', mot: 0.06 },

  skinD:   { base: '#DDA985', mot: 0.04, grain: 0.03 },

  hair:    { base: '#4A2E23' },
  brass:   { base: '#C9A24C', mot: 0.05 },
  crust:   { base: '#C88A45' },
  bread:   { base: '#F7E5BC', mot: 0.05, grain: 0.03 },
  brownD:  { base: '#5A3D2E' },
  steel:   { base: '#B9BFC7', mot: 0.03, grain: 0.02 },
};

function blot(g, w, h, r, amp, cell) {               // 斑驳：小图随机明暗 → 放大 + 模糊
  if (amp <= 0) return;
  const sw = Math.ceil(w / cell) + 3, sh = Math.ceil(h / cell) + 3;
  const s = mk(sw, sh), sg = s.getContext('2d'), id = sg.createImageData(sw, sh), d = id.data;
  for (let i = 0; i < sw * sh; i++) { const v = r() * 2 - 1, c = v > 0 ? 255 : 0; d[i * 4] = c; d[i * 4 + 1] = c; d[i * 4 + 2] = c; d[i * 4 + 3] = Math.abs(v) * amp * 255; }
  sg.putImageData(id, 0, 0);
  g.save(); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.filter = `blur(${(cell * 0.4).toFixed(1)}px)`;
  g.drawImage(s, -cell * 1.5, -cell * 1.5, sw * cell, sh * cell); g.restore();
}
function grain(g, w, h, r, amp) {                    // 逐像素的细颗粒
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const v = (r() - 0.5) * 2 * amp * 255, c = (r() - 0.5) * amp * 80; d[i] += v + c; d[i + 1] += v; d[i + 2] += v - c; }
  g.putImageData(id, 0, 0);
}
function specks(g, wL, hL, r, list, n) {             // 纸里的杂点、碎屑

      g.strokeStyle = 'rgba(222,112,102,0.6)'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-half + 52, -80); g.lineTo(-half + 52, 80); g.stroke();
      g.globalAlpha = 0.94; g.drawImage(c, -Wc / 2 + 18, -FS * 1.3 + 22, Wc, Hc);
    } });
  LY.half = half;
  LY.tape = [0, 1].map((k) => piece('tape' + k, { pts: rectP(-64, -20, 128, 40), torn: [0, 1, 0, 1], paper: 'tape', alpha: 0.74, core: 0, amp: 1.6, jag: 2.2, edge: false, shadow: { x: 1, y: 1.5, b: 2, a: 0.16 } }));
}
function overlay(g, t) {
  STEP = stepOf(t);
  const L = MV.lyricAt(t, { tail: 1 });
  if (L) {                                           // 第 4 拍「啪」地贴上（放大回弹），下一张、下下张两条纸胶带一条一条贴住
    const k = STEP - stepOf(L.start), sc = [1.14, 0.97][k] ?? 1, rot = ([-5, -1.6][k] ?? -2.4) * D2R, X = 760, Y = 124;
    const at2 = (x, y) => [X + x * Math.cos(rot) - y * Math.sin(rot), Y + x * Math.sin(rot) + y * Math.cos(rot)];
    put(g, LY.strip, X, Y, rot, sc, 'lyric', 1, 0.3);
    if (k >= 1) { const [x, y] = at2(-LY.half + 26, -36); put(g, LY.tape[0], x, y, -0.75 + (k === 1 ? -0.1 : 0), k === 1 ? 1.12 : 1, 'tape0', 0.8, 0.5); }
    if (k >= 2) { const [x, y] = at2(LY.half - 22, 8); put(g, LY.tape[1], x, y, 1.22 + (k === 2 ? 0.12 : 0), k === 2 ? 1.12 : 1, 'tape1', 0.8, 0.5); }
  }
  // 拍照的灯：左上来的暖光、一圈暖灰暗角（不做每张曝光一闪：只差 1%，看不太出来，GIF 却每帧整屏都变）
  g.save();
  g.globalCompositeOperation = 'soft-light';
  const warm = g.createRadialGradient(320, 80, 40, 520, 260, 1500); warm.addColorStop(0, 'rgba(255,212,150,0.5)'); warm.addColorStop(1, 'rgba(255,212,150,0)');
  g.fillStyle = warm; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'multiply';
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 1.08); v.addColorStop(0, '#FFFFFF'); v.addColorStop(1, 'rgb(212,204,194)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.restore();
}

  EDGE_SH = (() => { const c = mk(160 * K, (H + 240) * K), e = c.getContext('2d'); e.filter = `blur(${12 * K}px)`; e.fillStyle = 'rgba(34,24,20,0.42)'; e.fillRect(36 * K, 60 * K, 116 * K, (H + 120) * K);
    return { cv: c, x: -70, y: -120, w: 160, h: H + 240, size: H }; })();   // 它投在旧卡上的影子（只露出卡边左边那一截）
  BACK = sheetFor('back', 900, 900, 'flap').c;       // 翻页背面的素纸（1100 见方一张，铺开不太看得出重复）

MV.page({ W, H, fps: FPS, duration: DURATION, ready, draw: drawFrame, overlay });
