<!doctype html>
<!--
  皮影戏（Chinese shadow puppetry）· 锣鼓声里舞狮：关节皮影狮子跟着锣鼓点甩头、眨眼、扑绣球，油灯一晃暗下去又亮起来，狮子跃上高台
  示范场景只为展示画法，做 MV 时场景、角色、构图从你的歌来。
  白布幕后面点着油灯，刻好的染色兽皮贴在幕上演：观众看到的颜色是灯光透过皮子透出来的。6 秒，BPM 120，两个镜头（两套布景）。

  关键画法（Canvas 2D，不靠库；给以后读代码学画法的 agent）：
  1. 工具和分层：kit.js 的 MV.page。draw 里自己在离屏画布上合成，最后一次贴进 g；歌词牌在 overlay（最上层，不跟布景换）。
     皮片、布、灯光图都按画布的物理分辨率刻（g.getTransform().a 就是逻辑 px → 物理 px），GIF、草稿、成片都清楚；画布大小变了才重刻。
  2. 透光模型：每帧先在一张白底的「透光图」T 上，把每片皮用 multiply 叠上去（皮子的颜色 = 它让多少光透过去）。
     镂空是真的挖掉（destination-out），那里只剩布、最亮；两片皮叠在一起自动更暗（狮子的远侧腿压在身子上、杆子压在高台上）。
     最后：画面 = 幕后的灯光图 × T。不描轮廓线、不涂阴影，明暗全由「透多少光」决定。
  3. 一片皮怎么刻（hide()）：先染色，再叠一层皮纹（斑驳、纤维），沿边留一道深色皮边，往里挖一道细刀口线，然后按纹样挖空：
     回纹（fret()：一条底线上一排方折回钩，刻成细缝）、如意云、月牙鳞、钱孔、小圆孔、牙齿三角。同一张皮上可以补染第二种颜色（狮背的金脊、眉毛）。
     几个圆拼成的皮（云片）皮边只能沿外轮廓走：放大一圈的并集垫深色、挖掉放大半圈的、再填染色，留下的细缝就是刀口线。
  4. 布和灯：布纹（经纬线、粗纱、几处不匀）和钉死的地条一起烤进 TBG。幕后一盏油灯，亮点在幕中间偏上，四角暗；
     火苗一直在跳：整幕亮度用固定种子的值噪声在 ±3–4% 里跳，亮点跟着挪几像素。亮度 > 1 时把灯光图再 lighter 叠一遍（冲一下），< 1 时盖一层黑。
  5. 狮子是关节皮影：身子、头、下颌、尾巴、四条腿、眼珠（换片：睁 / 闭）各一片，每片的 (0,0) 就是它的线铆，只绕铆钉转、不变形。
     远侧的两条腿染深一档、错开一点。腿的角度由「髋到落脚面的距离」定（acos），站着、下蹲时两只脚一直踩住，空中收腿，扑的那下前爪往前抓。
     三根操纵杆（身子、脖子、前爪）都朝右下伸出画面；手那头离幕远，杆子画在 1/4 大小的画布上糊开再放大，靠近铆点的一段另画清楚的。
     手持的抖：值噪声给身子、头一点位移和转角，一直在抖；落上高台亮相的那半拍手稳住（抖到 0.2 倍）。
     尾巴的惯性晃：身子的加速度推一个弹簧，每帧从 0 秒重新积分到 t（步长 1/240 秒），所以只由 t 决定。
  6. 动起来的手感：皮影按 t 连续动（30 fps），眨眼是瞬间换片。所有时刻从拍子算：每拍狮子往下一蹲、甩一下头（重拍甩得最大、嘴张得最大），
     鼓槌钉在鼓架伸出的立柱上，拍间抬起、每拍落在鼓面上；锣在重拍上被敲得一晃，绣球被杆子每拍颠一下。挂线的云、彩穗一直在线上轻轻摆。
  7. 转场「灯一暗一亮换一幕」：第 6.8–8 拍油灯一晃（灯光图的亮点先往左甩再往右回），第 6.85–7.44 拍暗到约 24%（不到黑帧）；
     最暗时换布景：旧布景抽离幕布（putSoft()：在 1/3 大小的画布上糊开再放大，变大、变虚、变淡），新的高台、彩穗从幕外按上来（反过来，大虚淡 → 贴上变清楚）。
     狮子不换：它从第 7 拍起跳，灯暗时正在半空，第 8 拍（重拍）落上高台，灯在同一拍回来并冲一下；绣球在暗里被杆子挪到台沿，落台那一下被震得弹起。
     整个转场没有切：画面里一直是同一只狮子，布景是在暗里换的。
  8. 歌词：一块深色皮牌，字是刻空的（Noto Serif SC 900 填字后 destination-out），一根杆举着从幕的左边沿着幕滑进来（裁在台框里，像从侧幕进场），第 2 拍到位。
     牌子在 overlay 里用 multiply 乘到画面上：和幕上的皮一样叠暗，灯暗时它也暗。字按 MV.lyricAt 一个一个从牌后亮起一盏小灯
     （径向光只保留字形里的部分，lighter 加上去，亮度跟着油灯走）。
  9. 台框是木头的，在幕前面，不透光、不动；布也不动，没有镜头推拉。
  时间线（第 n 拍 = n × 0.5 秒，拍子当锣鼓点）：
    第 0 拍（重拍）猛甩头、锣一晃；第 1 拍小甩头；第 1.1 拍歌词牌从左边滑进来，冲过一点再退回，第 2 拍停稳；第 2 拍眨眼，字一个个亮；第 3 拍下蹲蓄力，第 3.3 拍起扑；
    第 4 拍（重拍）扑到最高、前爪抓、一口咬住绣球，绣球被打飞，锣又一晃；第 4.6 拍落地压一下；第 5、6 拍甩头；第 6.6 拍再蹲，第 7 拍起跳；
    第 6.8–8 拍灯一晃、暗下去、换布景；第 8 拍（重拍，4.0 秒，PLAN）落上高台站稳、灯亮冲一下、大甩头、绣球弹起；
    第 9 拍绣球落回台沿再弹两下（第 9.5、9.75 拍）；第 9、10、11 拍甩头；第 10.5 拍眨眼。
  画面只由 t 决定：随机数全用 MV.rng / MV.noise 加「元素名 + 序号」种子，不用 Math.random()、Date，不存上一帧。
  速度：Canvas 2D 同步画完。开页面约 5 秒（大半在等 jsDelivr 的字体），刻皮片、烤布纹约 0.2 秒；1920×1080 一帧画约 0.03 秒，连 PNG 编码约 0.11 秒。
  出 README 动图：render_frames.mjs --fps 12 --width 1280 --height 720 --format png；ffmpeg scale=640:360:flags=lanczos，
    palettegen=max_colors=56:stats_mode=diff:reserve_transparent=0，paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle，-loop 0，72 帧约 4.2 MB。
    灯一直在闪，每帧整屏都变，GIF 压不下去：96 色约 5.6 MB、64 色约 4.5 MB；bayer_scale 调到 4、5 更小，但灯光的渐变出一圈圈色环，不如少几个颜色。
  坑：操纵杆会横穿脸和歌词牌：狮子、绣球的杆子都朝右下出画，歌词牌放在左下、它的杆朝左下；挂线要细、清楚、淡，直接画在透光图上
    （画在小画布上再放大会糊成一道道竖的暗带）；布纹里大斑太重，整幕会出竖条带；后加的光（落台那下冲亮）会把浅色皮冲白，要留颜色的皮染深；
    腿的角度要在挪到髋上之前、在身子的坐标里取点算，挪过去再取点会把髋的偏移算两遍，腿全劈开。
  字体：Noto Serif SC 900（@fontsource/noto-serif-sc@5.3.1，SIL OFL 1.1，jsDelivr 按字取分包）。没有别的外部资源。
-->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.3.1/900.css">
<script src="../../templates/mv/kit.js"></script>
<style>html, body { margin: 0; overflow: hidden; background: #000; }</style>
</head><body><script>
'use strict';
// ======================= 基本量 =======================
const W = 1920, H = 1080, FPS = 30, DUR = 6, TAU = Math.PI * 2;
MV.tempo(120, 0);                                   // 第 0 拍在 0 秒，一拍 0.5 秒；拍子就是锣鼓点
const { clamp, lerp, seg } = MV, EZ = MV.ease, bt = MV.beatTime;
const LYRIC = '锣鼓一响，狮子醒了';
window.LYRICS = [[bt(2), bt(12), LYRIC]];
const FONT = '"Noto Serif SC","Songti SC","SimSun",serif';
const T_DARK = bt(7.5), T_LAND = bt(8);             // 3.75 秒灯最暗、换布景；4.0 秒（第 8 拍，重拍）落上高台
window.PLAN = [+T_LAND.toFixed(3)];
const GY = 850, LEG = 120, HIP = 46, REST = GY - LEG - HIP;      // 地条上沿、腿长、髋在身子中心下面多少、站着时身子中心的高度
const PX = 1250, H1 = 190, H2 = 140, TOP2 = GY - H1 - H2, REST2 = TOP2 - LEG - HIP;   // 高台：中心 x、下层高、上层高、台面
const XA = 760, XB = 960, XC = 1240;                // 狮子站的三处：开场、扑完、高台上
const BALL2 = [PX + 240, GY - H1 - 46];             // 高台下层右边的台沿上，绣球落在这里
const X0 = 34, Y0 = 50, X1 = W - 34, Y1 = H - 38;   // 台框里的幕
const D = {   // 染料：数值 = 这块皮让多少光透过去（multiply 用）
  red: '#F0643A', redLt: '#F8925C', redDk: '#8E2E18', redFar: '#C24A2C',
  gold: '#F4C65E', goldDk: '#9A6A1C', green: '#76AE90', greenDk: '#33604C', sage: '#A9C9B6',
  ink: '#4A372A', inkDk: '#2B1E16', wood: '#C88C58', woodDk: '#6C3F22', pale: '#F8EBD0', raw: '#E8C89A', eye: '#FFE9A8',
};

// ======================= 工具 =======================
const sm = EZ.smooth;
const nz = MV.noise;
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function dk(hex, k) { const n = parseInt(hex.slice(1), 16); return `rgb(${Math.round((n >> 16 & 255) * k)},${Math.round((n >> 8 & 255) * k)},${Math.round((n & 255) * k)})`; }
function ell(cx, cy, rx, ry = rx, rot = 0) { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, rot, 0, TAU); return p; }
function rect(x, y, w, h) { const p = new Path2D(); p.rect(x, y, w, h); return p; }
function poly(pts) { const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath(); return p; }
function capsule(x1, y1, x2, y2, r1, r2 = r1) {
  const a = Math.atan2(y2 - y1, x2 - x1), p = new Path2D();
  p.arc(x1, y1, r1, a + Math.PI / 2, a - Math.PI / 2); p.arc(x2, y2, r2, a - Math.PI / 2, a + Math.PI / 2); p.closePath(); return p;
}
function plaquePath(w, h, r) {   // 四角内凹的牌子
  const p = new Path2D(), x0 = -w / 2, x1 = w / 2, y0 = -h / 2, y1 = h / 2;
  p.moveTo(x0 + r, y0); p.lineTo(x1 - r, y0); p.arc(x1, y0, r, Math.PI, Math.PI / 2, true); p.lineTo(x1, y1 - r);
  p.arc(x1, y1, r, -Math.PI / 2, -Math.PI, true); p.lineTo(x0 + r, y1); p.arc(x0, y1, r, 0, -Math.PI / 2, true);
  p.lineTo(x0, y0 + r); p.arc(x0, y0, r, Math.PI / 2, 0, true); p.closePath(); return p;
}

// ======================= 刻皮 =======================
let K = 0;        // 逻辑 px → 物理 px（画布多大就按多大刻，GIF、草稿、成片都清楚）
let MOT = null;   // 皮纹：浅色底上的斑驳和纤维（multiply 进每片皮）
function makeMot() {
  const s = 256, c = mk(s, s), x = c.getContext('2d'), r = MV.rng('hide-tex');
  x.fillStyle = '#fff'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 90; i++) {
    const px = r() * s, py = r() * s, rad = 8 + r() * 46, g = x.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, `rgba(120,80,50,${.05 + r() * .09})`); g.addColorStop(1, 'rgba(120,80,50,0)');
    for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) { x.save(); x.translate(ox, oy); x.fillStyle = g; x.fillRect(px - rad, py - rad, rad * 2, rad * 2); x.restore(); }
  }
  x.lineCap = 'round';
  for (let i = 0; i < 140; i++) {   // 纤维、血管
    const px = r() * s, py = r() * s, a = r() * TAU, l = 10 + r() * 40;
    x.strokeStyle = `rgba(110,70,40,${.05 + r() * .08})`; x.lineWidth = .6 + r() * 1.1;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * l * .5 + (r() - .5) * 12, py + Math.sin(a) * l * .5 + (r() - .5) * 12, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  return c;
}
let CUR = '';     // 正在刻的那片皮的名字（皮纹的偏移用它做种子）
// 一块染色的皮：染色 → 皮纹 → 皮边 + 刀口线 → 挖纹样
function hide(g, path, dye, o = {}) {
  const e = o.edge ?? 3.5, k = o.knife ?? 2.5, rule = o.rule || 'nonzero';
  g.save();
  g.fillStyle = dye; g.fill(path, rule);
  g.clip(path, rule);
  if (o.tex !== 0) {
    const pt = g.createPattern(MOT, 'repeat'), r = MV.rng('mot' + CUR + dye);
    pt.setTransform(new DOMMatrix().translate(r() * 256, r() * 256).rotate(r() * 360));
    g.globalCompositeOperation = 'multiply'; g.globalAlpha = o.tex ?? 1; g.fillStyle = pt; g.fill(path, rule); g.globalAlpha = 1;
  }
  g.lineJoin = 'round'; g.lineCap = 'round';
  if (k > 0) { g.globalCompositeOperation = 'destination-out'; g.lineWidth = 2 * (e + k); g.strokeStyle = '#000'; g.stroke(path); }
  g.globalCompositeOperation = 'source-over';
  if (e > 0) { g.lineWidth = 2 * e; g.strokeStyle = o.edgeCol || dk(dye, .5); g.stroke(path); }
  if (o.carve) { g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.strokeStyle = '#000'; o.carve(g); }
  g.restore();
}
// 纹样（在 carve 里调用：填的、描的地方就挖空）
function dot(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function coin(g, x, y, r) { const p = new Path2D(); p.arc(x, y, r, 0, TAU); const s = r * .95; p.rect(x - s / 2, y - s / 2, s, s); g.fill(p, 'evenodd'); }   // 钱孔
function slot(g, x, y, w, h) { const p = new Path2D(); p.roundRect(x, y, w, h, Math.min(w, h) / 2); g.fill(p); }
function tri(g, x1, y1, x2, y2, x3, y3) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.closePath(); g.fill(); }
// 月牙：大圆减去往反方向挪开的小圆，a 是月牙鼓出去的方向
function cres(g, x, y, r, a, th = .42) {
  const d = r * th, rb = r * .92, xi = (rb * rb - r * r - d * d) / (2 * d), ta = Math.acos(clamp(xi / r, -1, 1)), tb = Math.atan2(Math.sqrt(Math.max(0, r * r - xi * xi)), xi + d);
  const p = new Path2D(), c = Math.cos(a), s = Math.sin(a), T = (px, py) => [x + px * c - py * s, y + px * s + py * c];
  for (let i = 0; i <= 12; i++) { const q = lerp(-ta, ta, i / 12), [px, py] = T(r * Math.cos(q), r * Math.sin(q)); i ? p.lineTo(px, py) : p.moveTo(px, py); }
  for (let i = 0; i <= 12; i++) { const q = lerp(tb, -tb, i / 12), [px, py] = T(-d + rb * Math.cos(q), rb * Math.sin(q)); p.lineTo(px, py); }
  p.closePath(); g.fill(p);
}
// 云纹：swirl 是一个回卷的旋涡刻成细线；cloud 是一朵祥云：一大一小两个卷 + 一条往右甩的云尾。
// 不对称是故意的：两个一样大的卷并排、下面再刻一道弧，缩小以后像一张笑脸
function swirl(g, x, y, r, sgn = 1, lw = 2.6, turns = 1.35) {
  g.lineWidth = lw; g.beginPath();
  for (let i = 0; i <= 40; i++) { const q = i / 40, a = sgn * q * turns * TAU, rr = r * (1 - q * .78); const px = x + Math.cos(a - Math.PI / 2) * rr * sgn, py = y + Math.sin(a - Math.PI / 2) * rr; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.stroke();
}
function cloud(g, x, y, s, lw = 2.6) {
  swirl(g, x - 5 * s, y - 2 * s, 11 * s, 1, lw); swirl(g, x + 12 * s, y + 3 * s, 6.5 * s, -1, lw);
  g.lineWidth = lw; g.beginPath(); g.moveTo(x - 16 * s, y + 7 * s); g.bezierCurveTo(x - 4 * s, y + 15 * s, x + 14 * s, y + 15 * s, x + 30 * s, y + 8 * s); g.stroke();
}
// 回纹：一条底线上一排方折的回钩，刻成细缝
function fret(g, x, y, w, h, lw = 3) {
  const n = Math.max(1, Math.round(w / (h * 1.15))), u = w / n;
  g.lineWidth = lw; g.lineJoin = 'miter'; g.lineCap = 'butt'; g.beginPath();
  g.moveTo(x, y + h); g.lineTo(x + w, y + h);
  for (let i = 0; i < n; i++) {
    const a = x + i * u;
    g.moveTo(a + u * .12, y + h); g.lineTo(a + u * .12, y); g.lineTo(a + u * .88, y); g.lineTo(a + u * .88, y + h * .72);
    g.lineTo(a + u * .36, y + h * .72); g.lineTo(a + u * .36, y + h * .34); g.lineTo(a + u * .62, y + h * .34);
  }
  g.stroke(); g.lineJoin = 'round'; g.lineCap = 'round';
}

// 一片皮 = 一张离屏画布（按物理分辨率刻），pivot 在 (0,0)
function piece(key, box, draw) {
  const [x0, y0, x1, y1] = box, pad = 4, w = x1 - x0 + 2 * pad, h = y1 - y0 + 2 * pad;
  const c = mk(w * K, h * K), g = c.getContext('2d');
  g.setTransform(K, 0, 0, K, (pad - x0) * K, (pad - y0) * K); g.lineJoin = 'round'; g.lineCap = 'round';
  CUR = key; draw(g);
  return { c, x: x0 - pad, y: y0 - pad, w, h };
}
function put(ctx, P, x, y, rot = 0, s = 1) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (s !== 1) ctx.scale(s, s);
  ctx.drawImage(P.c, P.x, P.y, P.w, P.h); ctx.restore();
}
const here = (ctx, P) => ctx.drawImage(P.c, P.x, P.y, P.w, P.h);   // 在当前变换的原点（铆钉）上贴一片

// ======================= 狮子的刻法（朝右；每片的 (0,0) 就是它的铆钉）=======================
function artBody(g) {
  const p = new Path2D();
  p.moveTo(-186, -18);
  p.bezierCurveTo(-176, -74, -64, -84, 40, -74);

// ======================= 动作（全按拍子排）=======================
// 跳：x 匀速，y 是抛物线
function arc(t, t0, t1, a, b, hgt) { const u = seg(t, t0, t1); return [lerp(a[0], b[0], u), lerp(a[1], b[1], u) - 4 * hgt * u * (1 - u), u]; }

const TOSS = [[0, .34], [1, .14], [2, .07], [5, .2], [6, .16], [8, .4], [9, .14], [10, .22], [11, .14]];

function toss(t) { let s = 0; for (const [n, a] of TOSS) s += a * kick(t - bt(n)); return s; }
// 站着时每拍往下一蹲（重拍蹲得深）
function bob(t) {
  const n = Math.floor(MV.beat(t) + 1e-6), dt = t - bt(n);

// 身子（不含手抖）：x、y、转角、离地多高能落脚（地面高度）、腿收起多少
function bodyAt(t) {

    return { x: XA, y: REST + bob(t) + 26 * EZ.inOut(seg(t, T_CR1, T_UP1)), rot: .05 * EZ.inOut(seg(t, T_CR1, T_UP1)), gy: GY, air: 0 };
  }

  }

    const land = 30 * Math.sin(Math.PI * seg(t, T_DN1, T_DN1 + .2)) - 6 * Math.sin(Math.PI * seg(t, T_DN1 + .2, T_DN1 + .34));
    return { x: XB, y: REST + 6 * (1 - seg(t, T_DN1, T_DN1 + .2)) + land + bob(t) + 28 * EZ.inOut(seg(t, T_CR2, T_UP2)), rot: .06 * EZ.inOut(seg(t, T_CR2, T_UP2)), gy: GY, air: 0 };
  }

// 尾巴的惯性：身子的加速度推一个弹簧，每帧从 0 秒积分到 t（步长 1/240 秒），画面才只由 t 决定

function pose(t) {

// ======================= 一帧 =======================
// 离幕有一段距离的皮片：影子更大、更虚、更淡。小画布上糊开再放大回来
function putSoft(ctx, P, x, y, rot, s, blur, alpha) {

  if (blur < .6) { ctx.globalAlpha = alpha; put(ctx, P, x, y, rot, s); ctx.globalAlpha = 1; return; }
  const rr = Math.max(Math.hypot(P.x, P.y), Math.hypot(P.x + P.w, P.y), Math.hypot(P.x, P.y + P.h), Math.hypot(P.x + P.w, P.y + P.h));
  const half = rr * s + blur * 2.5 + 4, px = Math.ceil(2 * half * K * SQ);
  if (SA.width < px) { SA = mk(px, px); SB = mk(px, px); }
  const a = SA.getContext('2d'), bb = SB.getContext('2d');
  a.setTransform(1, 0, 0, 1, 0, 0); a.clearRect(0, 0, px, px); a.setTransform(K * SQ, 0, 0, K * SQ, px / 2, px / 2); put(a, P, 0, 0, rot, s);

}
// 挂线：细、清楚、淡，直接画在透光图上

function rod(x1, y1, x2, y2, w = 6, a = 1) {

// 线铆：一粒深色的线结，中间一点亮。画在当前变换的原点

function drawLion(t, P) {

  LEGS.forEach(([hx], i) => { T.save(); T.translate(hx + 10, HIP - 4); T.rotate(angF[i]); here(T, S.legF); T.restore(); });

function lamp(t) {   // 油灯：火苗一直跳；换幕时灯一晃、暗下去，第 8 拍又亮起来、冲一下
  const u = seg(t, bt(6.8), T_LAND), sway = Math.sin(TAU * u) * Math.sin(Math.PI * u);
  const down = t < T_DARK ? EZ.inOut(seg(t, bt(6.85), T_DARK - .03)) : 1 - EZ.in(seg(t, T_DARK + .03, T_LAND));
  const surge = t >= T_LAND ? .28 * Math.exp(-(t - T_LAND) / .16) : 0;

  return { b: (1 - .76 * down) * fl * (1 + surge), fx: 7 * nz('fx', t * 2.5) - 230 * sway, fy: 5 * nz('fy', t * 2.5) + 40 * Math.abs(sway) };

  const f1 = far1(t), f2 = far2(t);
  if (f1 < 1) drawSet1(t, f1);
  if (f2 < 1) drawSet2(t, f2);
  const [bx, by, br] = ballAt(t);
  put(T, S.ball, bx, by, br); T.save(); T.translate(bx, by); rivet(3.6); T.restore();
  rod(bx - 44 * Math.sin(br), by + 44 * Math.cos(br), bx + 190, 1340, 5);
  for (const r of drawLion(t, P)) rod(...r);
  // 杆子：糊开、放大、乘上去
  R2.setTransform(1, 0, 0, 1, 0, 0); R2.clearRect(0, 0, RC2.width, RC2.height); R2.filter = `blur(${(6.4 * K * RQ).toFixed(2)}px)`; R2.drawImage(RC, 0, 0); R2.filter = 'none';
  T.setTransform(1, 0, 0, 1, 0, 0); T.drawImage(RC2, 0, 0, RC2.width, RC2.height, 0, 0, TC.width, TC.height);
  // ---- 2 灯光 × 透光，3 台框 ----
  const L = lamp(t);
  OUT.setTransform(1, 0, 0, 1, 0, 0); OUT.globalCompositeOperation = 'copy'; OUT.globalAlpha = 1;
  OUT.drawImage(BACK, (-BM + L.fx) * K, (-BM + L.fy) * K);
  if (L.b > 1) { OUT.globalCompositeOperation = 'lighter'; OUT.globalAlpha = L.b - 1; OUT.drawImage(BACK, (-BM + L.fx) * K, (-BM + L.fy) * K); OUT.globalAlpha = 1; }
  OUT.globalCompositeOperation = 'multiply'; OUT.drawImage(TC, 0, 0);
  OUT.globalCompositeOperation = 'source-over'; OUT.drawImage(FRAME, 0, 0);
  if (L.b < 1) { OUT.fillStyle = `rgba(0,0,0,${(1 - L.b).toFixed(4)})`; OUT.fillRect(0, 0, OUTC.width, OUTC.height); }
}

// ======================= 歌词牌（overlay：最上层，不跟镜头动）=======================
// 牌子是一片深色皮，从幕的左边沿着幕滑进来（back 缓动：冲过一点再退回），第 2 拍停稳；乘到画面上（和幕上的皮一样叠暗），字是刻空的透出布光，
// 再按 MV.lyricAt 一个字一个字从牌后亮起一盏小灯（光只从字里透出来，跟着油灯一起明暗）
function plaqueAt(t) {
  if (t < bt(1.1)) return null;
  const k = seg(t, bt(1.1), bt(2)), x0 = X0 - S.plW / 2 - 30, x1 = X0 + 60 + S.plW / 2;
  return { x: lerp(x0, x1, EZ.back(k, 1.2)) + 1.1 * nz('plx', t * 4), y: 990 + .8 * nz('ply', t * 5), rot: .004 * nz('plr', t * 3) };
}
function overlay(g, t) {
  const pl = plaqueAt(t); if (!pl) return;
  g.save(); g.beginPath(); g.rect(X0, Y0, X1 - X0, Y1 - Y0); g.clip();
  g.globalCompositeOperation = 'multiply';
  g.save(); g.filter = `blur(${(2.2 * K).toFixed(2)}px)`; g.strokeStyle = 'rgba(38,24,14,.6)'; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(pl.x - S.plW / 2 + 90, pl.y + 30); g.lineTo(pl.x - S.plW / 2 - 140, 1340); g.stroke(); g.restore();
  put(g, S.plaque, pl.x, pl.y, pl.rot);
  const L = MV.lyricAt(t, { per: .07, pop: .14, tail: 1 });
  if (L) {
    const c = GLC.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'copy'; c.fillStyle = 'rgba(0,0,0,0)'; c.fillRect(0, 0, GLC.width, GLC.height);
    c.globalCompositeOperation = 'lighter'; c.setTransform(K, 0, 0, K, -S.letters.x * K, -S.letters.y * K);
    let any = false;
    for (const ch of L.chars) {
      const a = (.6 * ch.u + .9 * Math.exp(-(((ch.u - .55) / .3) ** 2))) * clamp(lamp(t).b, 0, 1.3);   // 字后的小灯跟着油灯一起明暗
      if (a < .01 || CHARX[ch.k] === undefined) continue;
      any = true; const x = CHARX[ch.k], gr = c.createRadialGradient(x, 3, 0, x, 3, 60);
      gr.addColorStop(0, `rgba(255,226,160,${a})`); gr.addColorStop(.5, `rgba(255,200,120,${a * .6})`); gr.addColorStop(1, 'rgba(255,190,110,0)');
      c.fillStyle = gr; c.fillRect(x - 60, -57, 120, 120);
    }
    if (any) {
      c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'destination-in'; c.drawImage(S.letters.c, 0, 0);
      g.globalCompositeOperation = 'lighter';
      g.save(); g.translate(pl.x, pl.y); g.rotate(pl.rot); g.drawImage(GLC, S.letters.x, S.letters.y, S.letters.w, S.letters.h); g.restore();
    }
  }
  g.restore();
}

function drawFrame(g, t) {
  const k = g.getTransform().a;
  if (Math.abs(k - K) > 1e-6) build(k);   // 画布大小变了（预览时拉窗口）才重刻
  render(t);
  g.drawImage(OUTC, 0, 0, W, H);
}
MV.page({ W, H, fps: FPS, duration: DUR, draw: drawFrame, overlay,
  ready: async () => {
    await MV.font('900 60px "Noto Serif SC"', LYRIC);   // 没下到：出片时报错停下，预览时写在播放条上
    build(Math.min((innerWidth || W) / W, (innerHeight || H) / H));
  } });
</script></body></html>
