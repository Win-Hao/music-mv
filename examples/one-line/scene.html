<!doctype html>
<!--
  一笔画（continuous line drawing / one-line animation）· 一根不离纸的线：窗台上的种子发芽开花，一片花瓣被风带走、变成鸟飞出窗外，落在一只伸出来的手上
  示范场景只为展示画法，做 MV 时场景、角色、构图从你的歌来。

  关键画法（Canvas 2D，不靠画图库；页面接口是 templates/mv/kit.js 的 MV.page）：
  1. 工具：一支笔、一种墨、一个粗细。所有线都是 6.6 px（1920 宽时，640 宽的 GIF 里约 2.2 px）的圆头线，不按笔速变粗细。
     推镜头时只放大点的位置、线宽不变（先把点换到画面坐标再描），推到 3 倍还是同一支笔。
  2. 拓扑先行，线只有两个头：落笔处（窗框右下角）和此刻的笔尖。笔的路线按一笔画排：窗框右边往上（中途鼓出右边那朵云）→ 窗框顶
     （中途垂下上面那朵云）→ 左边往下 → 窗台一圈 → 花盆 → 盆口里的土 → 种子。奇数度的结点只能有起点、终点两个，多出来的用回描补
     （窗台上 122 px、花盆右边 131 px，沿旧线再走一遍，看不出来）。云是窗框上鼓出去的一段线：窗框挡住了它的另一半，所以挂在框上不算另起一根。
     之后笔尖往上长成茎和叶，绕出花心和五片花瓣；最后画的那片花瓣在线的末端，所以它能被风带走、拖着线飞。
     镜头二里窗框推到了画外，云和手的线都从画框外接进来（画框外面可以连）。
  3. 分层：一张墨层（所有线一个颜色、一次描完，回描和交叉都不会更黑）、一张颜色层、纸；合成 = 纸 × 颜色 × 洇 × 墨（multiply）。
     笔头一个小点（直径约两倍线宽）跟着笔尖，看得出「正在画」；花瓣变鸟时这个点滑到鸟头上当眼睛，从此鸟就是笔，它飞过的路就是新画的线。
  4. 纸和纹理：暖白纸是开页面时烤的一张（值噪声浆斑 + 细颗粒 + 纤维 + 轻暗角），固定在画面上、不跟镜头推（纸不动，纸上的画在变）；
     墨层缩到 1/4 再放大垫在下面当一点洇（22%），再用一张平铺噪声把墨挖淡 12%（吃纸不匀）。
     手抖：沿弧长两层平滑噪声（波长 110 px、21 px，幅度 1.5 px）往法线方向推，两头收到 0，接头才对得上；墨在纸上不会自己动，线不 boil。
     噪声格点来自 MV.rng 固定种子、查表插值。镜头二里的东西（云、手、鸟拖的线）按镜头二的大小定抖动，推近了不会抖得太粗。
  5. 颜色：只有墨，加一块淡淡的珊瑚红（花的颜色）。开花那一下在花瓣后面晕开，飞走的那片花瓣带着自己那一块，变形时这块颜色
     MV.morph 成鸟胸口的红。色块比线错开几像素、边缘糊 2.5 px、边上深一点，像水彩随手刷的，不是填色。
  6. 光：不画光和阴影，明暗只有墨和纸。
  7. 动起来的手感：30 fps 连续动。生长和变形都按弧长：茎是笔尖往上画出来的；花苞 = 五片挤在一起的窄花瓣，拍上用弹性缓动
     （1–2 帧内弹开、冲过头 35% 再摆回）转到五个方向、拉长变宽。风是一根函数：平时茎尖晃 2–3 px，起风时 0.16 秒弯到 18 px 再衰减着摆回；
     花瓣在风里打转、翻面、卷一个小圈。两朵云沿窗框慢慢漂、鼓包一胀一缩。鸟每拍扇两下翅膀（落地那一下正好翅膀在上）；
     落在手上时手往下一沉再弹回，鸟收翅、点两下头。
  8. 转场 = 花瓣变鸟 + 跟着鸟推出窗外（穿越推进）：
     花瓣 → 鸟用 MV.morph（两个闭合形状按弧长各取 160 点、对齐起点再插值）。两个形状都在「挂线点为原点、朝前是 +x」的局部坐标里，
     对齐只算一次，挂线点（花瓣根 = 鸟尾尖）一直接在线上。
     镜头绕一个不动点 F 推：镜头一慢推 1.0 → 1.2（镜头一唯一的慢动作），第 4 拍前 0.28 秒起变成推窗（log 缩放 = 慢推的线性项 +
     smoothstep 的大推，速度连续），第 5 拍落在 3 倍：窗洞右上那块天（世界里 640×360）正好占满画面；之后按更慢的速度接着推（3 → 3.24）。
     镜头二的云、手在「镜头二坐标」（1920×1080）里设计，缩成 1/3 放进那块天，推满时 1:1；花在那块天的左边，推完正好出画。
     鸟的路线写在画面坐标里，它留下的线按「当时的镜头」换回世界坐标，所以推镜头时旧线跟着世界放大、从画框边出去，
     镜头二里看到的是一根从左下升上来、绕一圈的线。落地前 0.2 秒，这根线按弧长对齐、收进手的轮廓（和手的线重合），手心里只剩一只鸟。
     推窗那几帧开动态模糊：子帧间隔不超过 1.5 px 才糊成一片，间隔大了 6.6 px 的线会裂成几根残影。
  9. 歌词：hanzi-writer-data 的笔画中线按笔顺写，笔画之间用 1.7 px 的细连笔（牵丝）连成一根线：上一笔的出笔方向接下一笔的入笔方向
     （三次贝塞尔），起笔 0.8 倍粗、收笔收到 0.5 倍，笔画 6.6 px、字号 84 px。笔尖也带一个点，写完收进线头。
     歌词在 overlay（最上层、不跟镜头动），放右下：镜头二里线和手都在左下。写到哪，后面就垫一块羽化的纸（就是那张纸本身），线不压字。
     时间来自 window.LYRICS + MV.lyricAt；笔画用 MV.glyphs 取（网络问题取不到时出片报错停下），数据里没有的字才退回系统字体。

  时间线（BPM 70，一拍 0.857 秒，第 0 拍在 0 秒；全片 7 拍）：
    开片前 0.8 秒落笔（第一帧已经有窗框右边、窗框顶和两朵云），0–1.62 秒画完窗、窗台、花盆、土、种子；1.62 起歌词开始写（2 秒写完）
    第 2 拍（1.71）种子冒出两片子叶 → 笔尖往上长成茎和两片叶，2.36–2.52 绕出花苞
    第 3 拍（2.57）花苞弹开成五瓣花，后面晕开珊瑚红
    2.84 起风，2.95 最后画的那片花瓣被带走，卷一个小圈往右上飞；3.15 起花瓣变鸟、镜头开始推窗
    第 4 拍（3.43）变成鸟、开始扇翅膀；第 5 拍（4.29）推出窗外，落在镜头二（window.PLAN）
    4.15–4.9 鸟在天上绕一圈；4.48–5.0 手从左下伸上来；4.93 起鸟拖的线收进手的轮廓
    第 6 拍（5.14）落在手心，手往下一沉再弹回，鸟收翅、5.42 和 5.72 点头；第 7 拍（6.0）结束

  画面只由 t 决定：没有 Math.random()、Date、performance.now()；随机数都是 MV.rng（「元素名 + 序号」做种子），不存上一帧，
  鸟拖的线每帧都从花瓣飞走那一刻按 1/120 秒重新采样一遍。
  速度（4 核、无独显的机器，render_frames.mjs 实测）：开页面约 1.8 秒（从 jsDelivr 取 10 个字的笔画数据、烤纸）；
  1920×1080 一帧连存 PNG 约 0.2 秒，推窗那几帧开了动态模糊（最多 24 个子帧）约 0.45 秒。静止的窗框、窗台、花盆线开页面时就抖好存着，每帧只换算点、描一遍。
  出 GIF：render_frames.mjs --page examples/one-line/scene.html --fps 12 --width 1280 --height 720 --format png --workers 1 --out <临时目录> →
  ffmpeg -framerate 12 -i <临时目录>/%06d.png -vf "scale=640:360:flags=lanczos,split[a][b];[a]palettegen=max_colors=128[p];
  [b][p]paletteuse=dither=sierra2_4a:diff_mode=rectangle" -loop 0（72 帧，约 1.6 MB）。纸固定在画面上，GIF 每帧只存变了的那块，颜色给到 128 也不大。
  外部资源：hanzi-writer-data@2.0.1（jsDelivr 按字取 JSON 的 medians，Arphic Public License）。
  坑：
  - 只有墨的时候小圈容易被看成眼睛：花心那一圈要小，鸟的眼睛用笔头那个实心点
  - 一笔画的帧差小：新画出来的一段细线只占几百个像素，video_rhythm 会把「笔在画」量成几乎不动。镜头一要有一个一直在走的慢推
    （这里 1.0 → 1.2），歌词也在种子画完那一刻就开写，长茎那一秒才不会被量成大轮廓没动
  - 按飞行方向镜像的鸟，竖着飞时会压成一条线（像在转身）：拍上「变成鸟」那一刻要让它斜着飞
  - MV.morph 自己找对齐的起点：花瓣对鸟时转走了 8 个点，所以挂线点不用它输出的第 0 点，固定在局部原点（差 3 px，被线宽盖住）
  - 云的一串鼓包用半个正弦，高低随机会变成锯齿；挂在窗框顶上的云沿框滑时，框顶那两段的端点也要跟着滑，不然线会断开
  - 沿旧线回描的那段也要算进笔的路线（只走笔、不多出墨），不然笔尖接不上
  - 歌词后面垫的纸会盖掉经过的线：歌词放在线和手都不去的那一角
-->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<script src="../../templates/mv/kit.js"></script>
<style>html, body { margin: 0; padding: 0; overflow: hidden; background: #F5EFE3; }</style>
</head><body><script>
// ======================= 画面、拍子、时间线 =======================
const W = 1920, H = 1080, FPS = 30, DUR = 6, BPM = 70;
MV.tempo(BPM, 0);                                  // 第 0 拍在 0 秒，一拍 0.857 秒，片长正好 7 拍
const { clamp, lerp, seg, ease } = MV;
const TAU = Math.PI * 2, BT = MV.beatTime;
const T = {
  route0: -0.8, route1: 1.62,                      // 笔画窗、云、窗台、花盆、土和种子（开片前就落笔了，第一帧不是白纸）
  sprout: BT(2),                                   // 1.71 拍上：种子冒出两片子叶
  stem1: 2.36, bud1: 2.52,                         // 笔尖往上长成茎和叶，顶上绕出花苞
  bloom: BT(3),                                    // 2.57 拍上：花苞弹开
  gust: 2.84, detach: 2.95,                        // 起风，最后画的那片花瓣被带走
  morph0: 3.15, morph1: BT(4),                     // 3.43 拍上：花瓣变成鸟
  push0: 3.15, push1: BT(5),                       // 4.29 拍上：推出窗外，落在镜头二（转场落点）
  loop: 4.15,                                      // 鸟在天上绕一圈从这里开始
  hand0: 4.48, hand1: 5.0,                         // 手从下面伸上来
  wrap0: 4.93,                                     // 鸟拖的线在落地前 0.2 秒收进手的轮廓
  land: BT(6),                                     // 5.14 拍上：落在手心
  lyric0: 1.62, lyricLen: 2.0,                     // 歌词开写（种子画完那一刻）、写多久
};
window.PLAN = [+T.push1.toFixed(3)];
const LYRIC = '窗台那朵花，飞到你指尖';
window.LYRICS = [[T.lyric0, DUR, LYRIC]];

const INK = '#2B2420', LW = 6.6, DOT_R = 6.3;      // 一种墨、一个粗细；笔头的点直径约两倍线宽
const PAPER = [245, 239, 227];
const ACC = '228,112,86';                          // 唯一的颜色：花的珊瑚红

// ======================= 小工具 =======================
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const lp = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const unit = (v) => { const d = Math.hypot(v[0], v[1]) || 1; return [v[0] / d, v[1] / d]; };
const rot = (v, a) => { const c = Math.cos(a), s = Math.sin(a); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c]; };
const lerpAng = (a, b, u) => a + ((((b - a) % TAU) + TAU * 1.5) % TAU - Math.PI) * u;   // 走近的那边转
const smooth = ease.smooth;
const elastic = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 9 - 0.75) * TAU / 3) + 1);
const mix = (P, Q, m) => P.map((p, i) => lp(p, Q[i], m));
// 平滑噪声（-1→1）：格点值来自 MV.rng（固定种子）先存成表，每个点查表插值，比每次现算快
const LAT = new Map();
function nz(key, x) {
  let a = LAT.get(key);
  if (!a) { const r = MV.rng(key); a = new Float32Array(1024); for (let i = 0; i < 1024; i++) a[i] = r() * 2 - 1; LAT.set(key, a); }
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(a[i & 1023], a[(i + 1) & 1023], u);
}
// 同一帧里算过的几何（花、鸟、手）存一下，下一帧换 t 就清掉；画面仍只由 t 决定
let MEMO_T = NaN, MEMO = {};
function memo(t, key, fn) { if (t !== MEMO_T) { MEMO_T = t; MEMO = {}; } return key in MEMO ? MEMO[key] : (MEMO[key] = fn()); }

// ======================= 线的几何 =======================
function cum(p) { const L = new Float64Array(p.length); for (let i = 1; i < p.length; i++) L[i] = L[i - 1] + dist(p[i - 1], p[i]); return L; }
function plen(p) { let s = 0; for (let i = 1; i < p.length; i++) s += dist(p[i - 1], p[i]); return s; }
function dense(pts, step) {                        // 每段等分加点（拐角留着）
  const o = [pts[0].slice()];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], n = Math.max(1, Math.ceil(dist(a, b) / step));
    for (let k = 1; k <= n; k++) o.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return o;
}
function resampleN(p, n) {                         // 开放的线按弧长取 n 个点（两头都在）
  if (p.length < 2) return Array.from({ length: n }, () => p[0].slice());
  const L = cum(p), tot = L[L.length - 1] || 1, o = [];
  for (let k = 0, j = 1; k < n; k++) {
    const s = tot * k / (n - 1);
    while (j < p.length - 1 && L[j] < s) j++;
    const d = L[j] - L[j - 1];
    o.push(lp(p[j - 1], p[j], d > 0 ? clamp((s - L[j - 1]) / d) : 0));
  }
  return o;
}
function cr(pts, n = 8, closed = false) {          // Catmull-Rom：几个控制点连成顺滑的线（同一个点写两遍就是尖角）
  const m = pts.length, o = [];
  const at = closed ? (i) => pts[((i % m) + m) % m] : (i) => pts[Math.max(0, Math.min(m - 1, i))];
  for (let i = 0; i < (closed ? m : m - 1); i++) {
    const a = at(i - 1), b = at(i), c = at(i + 1), d = at(i + 2);
    for (let k = 0; k < n; k++) {
      const u = k / n, u2 = u * u, u3 = u2 * u;
      o.push([0, 1].map((j) => 0.5 * (2 * b[j] + (-a[j] + c[j]) * u + (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * u2 + (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * u3)));
    }
  }
  if (!closed) o.push(pts[m - 1].slice());
  return o;
}
// 手抖：沿弧长的平滑噪声，往法线方向推开；两头 taper 长度内收到 0，接头才对得上
function wob(p, key, amp, wl, taper = 24) {
  if (!amp || p.length < 3) return p;
  const L = cum(p), tot = L[L.length - 1];
  return p.map((q, i) => {
    const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    const o = amp * Math.min(1, L[i] / taper, (tot - L[i]) / taper) * (nz(key, L[i] / wl) + 0.35 * nz(key + '~', L[i] / (wl * 0.19)));
    return [q[0] - dy / d * o, q[1] + dx / d * o];
  });
}
function cutPoly(p, s) {                           // 从头量 s 长的一段；tip 是笔尖
  if (s <= 0) return { pts: [p[0]], tip: p[0] };
  for (let i = 1, acc = 0; i < p.length; i++) {
    const d = dist(p[i - 1], p[i]);
    if (acc + d >= s) { const tip = lp(p[i - 1], p[i], d ? (s - acc) / d : 0); return { pts: [...p.slice(0, i), tip], tip }; }
    acc += d;
  }
  return { pts: p, tip: p[p.length - 1] };
}
function trace(g, p, closed = false) {             // 往当前路径里加一条线（整片一个粗细，一次 stroke 画完）
  if (p.length < 2) return;
  g.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]);
  if (closed) g.closePath();
}

// ======================= 镜头：绕一个不动点推 =======================
// 镜头二（窗外的天）按 1920×1080 设计，缩成 1/3 放进窗洞右上（世界里 640×360，花在它左边、不进镜头二）。绕 F 推到 3 倍时它正好占满画面
const F = [1200, 135], BS = 1 / 3, BO = [800, 90], ZB = 3;
const bw = (p) => [BO[0] + BS * p[0], BO[1] + BS * p[1]];                 // 镜头二坐标 → 世界
const toS = (p, z) => [F[0] + (p[0] - F[0]) * z, F[1] + (p[1] - F[1]) * z];  // 世界 → 画面
const toW = (p, z) => [F[0] + (p[0] - F[0]) / z, F[1] + (p[1] - F[1]) / z];  // 画面 → 世界
// log 缩放 = 慢推（镜头一 A1、镜头二 A2，转场里线性过渡）+ 转场的大推（smoothstep）。两头的速度都接得上
const A1 = Math.log(1.2) / T.push0, A2 = 0.045, PD = T.push1 - T.push0;
const LPUSH = Math.log(ZB) - A1 * T.push0 - PD * (A1 + A2) / 2;
function zoomAt(t) {
  if (t <= T.push0) return Math.exp(A1 * t);
  const u = Math.min(1, (t - T.push0) / PD);
  let v = A1 * T.push0 + PD * (A1 * u + (A2 - A1) * u * u / 2) + LPUSH * smooth(u);
  if (t > T.push1) v += A2 * (t - T.push1);
  return Math.exp(v);
}

// ======================= 窗、云、窗台、花盆：笔的路线 =======================
